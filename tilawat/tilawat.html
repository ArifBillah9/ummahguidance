<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --brand:#175a45;
    --brand-dark:#0f4534;
    --brand-light:#1f6f55;
    --cream:#fdfaf3;
    --ink:#1b1b1b;
    --gold:#c9973f;
    --line:#d8d2c2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
    background:#e9e5da;
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 30px rgba(0,0,0,.15);
    overflow:hidden;
  }

  /* ===== HEADER ===== */
  header{
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    position:relative;
    z-index:30;
    flex-shrink:0;
  }
  header .left{display:flex; align-items:center; gap:10px;}
  #mainHeader{
    position:absolute; top:0; left:0; right:0;
    transition:transform .28s ease, opacity .28s ease;
  }
  #mainHeader.hidden-bar{
    transform:translateY(-100%); opacity:0; pointer-events:none;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:#fff; cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:20px; height:20px;}
  .icon-btn.filled{background:#fff; color:var(--brand);}
  header h1{font-size:19px; font-weight:600;}
  header .right{display:flex; align-items:center; gap:2px;}

  /* ===== READER VIEW ===== */
  #readerView{flex:1; display:flex; flex-direction:column; min-height:0;}
  .status-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px; font-size:12px; color:#8a8370;
  }
  #pdfViewer{
    flex:1; display:flex; flex-direction:column; min-height:0; padding:0;
  }
  .page-frame{
    position:relative;
    flex:1;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }
  #pdfCanvas{
    display:block;
  }
  .page-nav{
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:8px 0 2px; flex-shrink:0;
    max-height:60px; overflow:hidden;
    transition:max-height .28s ease, opacity .28s ease, padding .28s ease;
  }
  .page-nav.hidden-bar{
    max-height:0; opacity:0; padding-top:0; padding-bottom:0; pointer-events:none;
  }
  .nav-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--gold);
    background:#fff; color:var(--brand); display:flex; align-items:center;
    justify-content:center; cursor:pointer;
  }
  .nav-btn svg{width:18px; height:18px;}
  .nav-btn:disabled{opacity:.4; cursor:default;}
  #pageIndicator{font-size:13px; color:var(--brand); min-width:70px; text-align:center;}
  #loadingMsg{padding:40px 10px; text-align:center; color:#8a8370; font-size:14px;}

  /* ===== FOOTER PLAYER ===== */
  footer{
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    color:#fff; flex-shrink:0;
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    position:absolute; left:0; right:0; bottom:0;
    z-index:20;
    transition:transform .28s ease, opacity .28s ease;
  }
  footer.hidden-bar{
    transform:translateY(100%); opacity:0; pointer-events:none;
  }
  #playBtn{
    width:42px; height:42px; border-radius:50%; background:#fff;
    color:var(--brand); border:none; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; cursor:pointer;
  }
  #playBtn svg{width:18px; height:18px;}
  .reciter{flex:1; min-width:0;}
  .reciter .name{font-size:14px; font-weight:600; line-height:1.3;}
  .reciter .sub{font-size:11px; opacity:.75;}
  footer .right-icons{display:flex; align-items:center; gap:12px;}
  footer .right-icons svg{width:18px; height:18px; cursor:pointer;}

  /* ===== DROPDOWN MENU ===== */
  #menuOverlay{
    position:absolute; inset:0; background:rgba(0,0,0,.25);
    display:none; z-index:40;
  }
  #menuOverlay.show{display:block;}
  #menuCard{
    position:absolute; top:56px; right:10px; width:260px;
    background:#fff; border-radius:10px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .menu-item{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; font-size:14.5px; color:#20402f;
    cursor:pointer; border-bottom:1px solid #eee;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:#f3f3f3;}
  .menu-item svg{width:20px; height:20px; color:var(--brand); flex-shrink:0;}

  /* ===== MUSHAF SELECT VIEW ===== */
  #selectView{
    position:absolute; inset:0; background:var(--cream);
    display:none; flex-direction:column; z-index:35;
  }
  #selectView.show{display:flex;}
  .select-grid{
    flex:1; overflow-y:auto; padding:16px 14px 30px;
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .mushaf-card{cursor:pointer; text-align:center;}
  .mushaf-thumb{
    position:relative; aspect-ratio:3/4; border-radius:8px;
    background:#fff; display:flex; flex-direction:column; justify-content:center;
    align-items:center; gap:6px; padding:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    overflow:hidden;
  }
  .mushaf-thumb img{
    width:100%; height:100%; object-fit:cover; border-radius:5px; display:block;
  }
  .mushaf-thumb .mini-line{
    width:78%; height:5px; border-radius:2px; background:#d8d2c2;
  }
  .mushaf-thumb .mini-line.short{width:55%;}
  .mushaf-thumb .bismillah{
    font-family:'Amiri',serif; font-size:13px; color:#333; direction:rtl;
  }
  .check-badge{
    position:absolute; top:6px; left:6px; width:22px; height:22px;
    background:var(--brand); border-radius:50%; display:none;
    align-items:center; justify-content:center; color:#fff;
  }
  .check-badge svg{width:13px; height:13px;}
  .mushaf-card.active .check-badge{display:flex;}
  .mushaf-card.active .mushaf-thumb{outline:2.5px solid var(--brand); outline-offset:2px;}
  .mushaf-card .label{margin-top:8px; font-size:13px; color:#20402f; font-weight:500; line-height:1.4;}

  /* ===== AYAH SELECT TOOLBAR (floating, positioned at the tapped line) ===== */
  .ayah-toolbar{
    position:absolute; left:2.5%; right:2.5%;
    background:linear-gradient(180deg,var(--brand-light),var(--brand-dark));
    display:none; align-items:center; justify-content:space-around;
    padding:7px 2px; z-index:16; box-shadow:0 4px 14px rgba(0,0,0,.35);
    border-radius:10px;
    transition:top .15s ease;
  }
  .ayah-toolbar.show{display:flex;}
  .ayah-toolbar button{
    background:none; border:1.5px solid rgba(255,255,255,.85); color:#fff;
    width:32px; height:32px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer;
  }
  .ayah-toolbar button:active{background:rgba(255,255,255,.18);}
  .ayah-toolbar button svg{width:16px; height:16px;}
  .ayah-toolbar button#atPlay svg{width:14px; height:14px; margin-left:1px;}
  .ayah-toolbar button.bookmarked{background:rgba(255,255,255,.22);}
  .ayah-toolbar button.bookmarked svg{fill:#fff;}
  .ayah-highlight{
    position:absolute; left:3%; right:3%; border-radius:5px;
    background:rgba(120,224,140,.55);
    display:none; z-index:11; pointer-events:none;
    transition:top .15s ease, height .15s ease;
  }
  .ayah-highlight.show{display:block;}

  /* thumb border themes */
  .thumb-classic{border:3px double #222;}
  .thumb-saudi{border:2px solid #b8873c; background:linear-gradient(#fff,#fdf6e6);}
  .thumb-colorful{border:2px solid #2a7a63; background:linear-gradient(135deg,#fef7e7,#eaf5ef);}
  .thumb-colorful-hafiz{border:2px solid #2287a8; background:linear-gradient(135deg,#eaf6fb,#fef7e7);}
  .thumb-madina{border:2px solid #16694f;}
  .thumb-nurani{border:2px solid #d18b1f; background:linear-gradient(135deg,#fff3de,#fff);}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== HEADER ===================== -->
  <header id="mainHeader" class="hidden-bar">
    <div class="left">
      <button class="icon-btn filled" title="হোম">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      </button>
      <h1>কুরআন</h1>
    </div>
    <div class="right">
      <button class="icon-btn" id="moonBtn" title="নাইট মোড">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button class="icon-btn" id="searchBtn" title="খুঁজুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="translateBtn" title="অনুবাদ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h9M7 3v2m0 0c0 4-2 7-5 8m5-4c1 2 3 3 5 4"/><path d="m14 20 4-9 4 9M15.5 17h5"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="মেনু">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>

    <!-- dropdown menu (image 2) -->
    <div id="menuOverlay">
      <div id="menuCard">
        <div class="menu-item" id="miPrint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M4 9h4M4 15h4"/></svg>
          <span>প্রিন্ট সিলেক্ট করুন</span>
        </div>
        <div class="menu-item" id="miLang">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          <span>ভাষা পরিবর্তন করুন</span>
        </div>
        <div class="menu-item" id="miTranslator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h9M7 3v2m0 0c0 4-2 7-5 8m5-4c1 2 3 3 5 4"/><path d="m14 20 4-9 4 9M15.5 17h5"/></svg>

          <span id="ayahSelectLabel">পাতা নম্বরে যান</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== READER VIEW ===================== -->
  <div id="readerView">
    <div id="pdfViewer">
      <div class="page-frame" id="pageFrame">
        <div id="loadingMsg">পাতা লোড হচ্ছে…</div>
        <canvas id="pdfCanvas" style="display:none;"></canvas>
        <div class="ayah-highlight" id="ayahHighlight"></div>
        <div class="ayah-toolbar" id="ayahToolbar">
          <button id="atPlay" title="তিলাওয়াত শুনুন">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="atCopy" title="কপি করুন">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="12" height="14" rx="1.5"/><path d="M8 7V4.5A1.5 1.5 0 0 1 9.5 3H19a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 1-1.5 1.5H18"/></svg>

          <button id="atShare" title="শেয়ার করুন">

          </button>
          <button id="atTafsir" title="তাফসীর">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H13v16h6.5c.8 0 1.5-.7 1.5-1.5z"/></svg>
          </button>
          <button id="atBookmark" title="বুকমার্ক">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button id="atClose" title="মূল আকারে দেখুন">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>
          </button>
        </div>
      </div>
      <div class="page-nav hidden-bar" id="pageNavBar">
        <button class="nav-btn" id="prevPageBtn" title="পূর্ববর্তী পাতা">

        </button>

        <button class="nav-btn" id="nextPageBtn" title="পরবর্তী পাতা">

        </button>
      </div>
    </div>
  </div>

  <!-- ===================== MUSHAF SELECT VIEW (image 3) ===================== -->
  <div id="selectView">
    <header>
      <div class="left">
        <button class="icon-btn" id="backBtn" title="ফিরে যান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1>কুরআন</h1>
      </div>
      <div class="right">
        <button class="icon-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>
    </header>
    <div class="select-grid" id="selectGrid"></div>
  </div>

  <!-- ===================== FOOTER PLAYER ===================== -->
  <footer id="mainFooter" class="hidden-bar">
    <button id="playBtn">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="reciter">
      <div class="name">মাহের আল মুআইক্বিলি</div>
      <div class="sub" id="playStatus">তিলাওয়াত শুনতে চালু করুন</div>
    </div>
    <div class="right-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2 21 6 17 10M3 6h18M7 22 3 18 7 14M21 18H3"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
    </div>
  </footer>
  <audio id="audio" preload="none"></audio>
</div>

/* যেটি সিলেক্ট করা হয় সেটিই localStorage-এ সেইভ থাকে এবং পরের বার অ্যাপ চালু হলে
   ডিফল্টভাবে সেই মুসহাফ/প্রিন্টই দেখানো হয় */
let selectedMushaf = localStorage.getItem('mushafStyle') || MUSHAF_STYLES[0].id;
if(!MUSHAF_STYLES.some(s => s.id === selectedMushaf)) selectedMushaf = MUSHAF_STYLES[0].id;

/* ---------------------------------------------------------------
   BUILD THE MUSHAF SELECTION GRID
--------------------------------------------------------------- */
const selectGrid = document.getElementById('selectGrid');
function renderMushafGrid(){
  selectGrid.innerHTML = '';
  MUSHAF_STYLES.forEach(style => {
    const card = document.createElement('div');
    card.className = 'mushaf-card' + (style.id === selectedMushaf ? ' active' : '');
    card.dataset.id = style.id;
    card.innerHTML = `
      <div class="mushaf-thumb ${style.thumb}">
        <div class="check-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <img src="${style.img}" alt="${style.name.replace('\n',' ')}" loading="lazy">
      </div>
      <div class="label">${style.name.replace('\n','<br>')}</div>
    `;
    card.addEventListener('click', () => {
      const changed = selectedMushaf !== style.id;
      selectedMushaf = style.id;
      /* নির্বাচিত প্রিন্ট সেইভ করা হচ্ছে, পরের বার এটিই ডিফল্ট হিসেবে খুলবে */
      localStorage.setItem('mushafStyle', selectedMushaf);
      renderMushafGrid();
      applyMushafTheme();
      if(changed) switchMushafPdf(style.file);
      document.getElementById('selectView').classList.remove('show');
    });
    selectGrid.appendChild(card);
  });
}
renderMushafGrid();

function applyMushafTheme(){
  const style = MUSHAF_STYLES.find(s => s.id === selectedMushaf);
  const frame = document.getElementById('pageFrame');
  const themeColors = {
    'thumb-classic':'#c9973f','thumb-saudi':'#b8873c','thumb-colorful':'#2a7a63',
    'thumb-colorful-hafiz':'#2287a8','thumb-madina':'#16694f','thumb-nurani':'#d18b1f'
  };
  document.documentElement.style.setProperty('--gold', themeColors[style.thumb] || '#c9973f');
}
applyMushafTheme();

/* ---------------------------------------------------------------
   BENGALI NUMERALS (for the page indicator, e.g. 83 -> ৮৩)
--------------------------------------------------------------- */
function toBengaliNumeral(n){
  const digits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(n).split('').map(d => digits[+d] || d).join('');
}

/* ---------------------------------------------------------------
   RENDER QURAN PDF PAGE-BY-PAGE  (pdf.js)
   Source: Emdadia-Hafezi-Quran.pdf (হাফিজী কুরআন, এমদাদিয়া লাইব্রেরী)
--------------------------------------------------------------- */
let PDF_URL = (MUSHAF_STYLES.find(s => s.id === selectedMushaf) || MUSHAF_STYLES[0]).file;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let currentPage = 1;
let totalPages = 1;
let renderingPage = false;

const pageFrame = document.getElementById('pageFrame');
const pdfCanvas = document.getElementById('pdfCanvas');
const loadingMsg = document.getElementById('loadingMsg');
const pageIndicator = document.getElementById('pageIndicator');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');

async function loadQuranPdf(){
  try{
    loadingMsg.textContent = 'পাতা লোড হচ্ছে…';
    loadingMsg.style.display = 'block';
    pdfCanvas.style.display = 'none';
    pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
    totalPages = pdfDoc.numPages;
    loadingMsg.style.display = 'none';
    pdfCanvas.style.display = 'block';
    const target = Math.min(Math.max(currentPage, 1), totalPages);
    await renderPage(target);
  }catch(err){
    loadingMsg.textContent = 'পিডিএফ লোড করা যায়নি। ফাইলটি এই HTML-এর একই ফোল্ডারে আছে কিনা যাচাই করুন।';
  }
}

/* "প্রিন্ট সিলেক্ট করুন" থেকে নতুন মুসহাফ/প্রিন্ট বাছাই করলে এখানে PDF পাল্টে যায়,
   বর্তমান পাতা নম্বর যতটা সম্ভব ধরে রাখা হয় */
function switchMushafPdf(file){
  hideAyahToolbar();
  PDF_URL = file;
  loadQuranPdf();
}

async function renderPage(num){
  if(!pdfDoc || renderingPage) return;
  renderingPage = true;
  const page = await pdfDoc.getPage(num);
  const containerWidth = pageFrame.clientWidth;
  const containerHeight = pageFrame.clientHeight;
  const baseViewport = page.getViewport({scale:1});
  const scale = Math.min(containerWidth / baseViewport.width, containerHeight / baseViewport.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const displayViewport = page.getViewport({scale});
  const renderViewport = page.getViewport({scale: scale * dpr});

  const ctx = pdfCanvas.getContext('2d');
  pdfCanvas.width = renderViewport.width;
  pdfCanvas.height = renderViewport.height;
  pdfCanvas.style.width = displayViewport.width + 'px';
  pdfCanvas.style.height = displayViewport.height + 'px';

  await page.render({canvasContext: ctx, viewport: renderViewport}).promise;
  renderingPage = false;
  currentPage = num;
  pageIndicator.textContent = `${toBengaliNumeral(currentPage)} / ${toBengaliNumeral(totalPages)}`;
  prevPageBtn.disabled = currentPage <= 1;
  nextPageBtn.disabled = currentPage >= totalPages;
}

/* keep the page perfectly fitted on resize / orientation change (all devices) */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(pdfDoc) renderPage(currentPage); }, 200);
});
window.addEventListener('orientationchange', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(pdfDoc) renderPage(currentPage); }, 200);
});

/* ---------------------------------------------------------------
   IMMERSIVE FULLSCREEN MODE — tap the page to show/hide the
   header, footer and page-nav bars (hidden by default)
--------------------------------------------------------------- */
const mainHeader = document.getElementById('mainHeader');
const mainFooter = document.getElementById('mainFooter');
const pageNavBar = document.getElementById('pageNavBar');

function setImmersive(on){
  mainHeader.classList.toggle('hidden-bar', on);
  mainFooter.classList.toggle('hidden-bar', on);
  pageNavBar.classList.toggle('hidden-bar', on);
}

/* ---------------------------------------------------------------
   ট্যাপ করে আয়াত সিলেক্ট করা (image 1 এর মতো):
   পাতার যেখানে ট্যাপ করা হবে সেই লাইনটি সবুজ রঙে হাইলাইট হবে
   এবং উপরে play/copy/share/tafsir/bookmark/close আইকনসহ একটি
   সবুজ টুলবার ভেসে উঠবে।
--------------------------------------------------------------- */
const ayahToolbar = document.getElementById('ayahToolbar');
const ayahHighlight = document.getElementById('ayahHighlight');
const ESTIMATED_LINES = 15; /* হাফিজী/মাদানী মুসহাফের প্রতি পাতায় সাধারণত ১৫ লাইন */

function showAyahToolbar(clientY){
  const canvasRect = pdfCanvas.getBoundingClientRect();
  const frameRect = pageFrame.getBoundingClientRect();
  if(clientY < canvasRect.top || clientY > canvasRect.bottom) return;

  const lineHeight = canvasRect.height / ESTIMATED_LINES;
  const relY = clientY - canvasRect.top;
  const lineIndex = Math.min(ESTIMATED_LINES - 1, Math.floor(relY / lineHeight));
  const topInFrame = (canvasRect.top - frameRect.top) + lineIndex * lineHeight;

  ayahHighlight.style.top = topInFrame + 'px';
  ayahHighlight.style.height = lineHeight + 'px';
  ayahHighlight.classList.add('show');

  /* টুলবারটি হাইলাইট করা লাইনের ঠিক উপরে ভাসিয়ে দেখানো হয়;
     লাইনটি পাতার একদম উপরের দিকে হলে টুলবার লাইনের নিচে বসবে */
  ayahToolbar.classList.add('show');
  const toolbarH = ayahToolbar.offsetHeight || 44;
  const gap = 8;
  let toolbarTop = topInFrame - toolbarH - gap;
  if(toolbarTop < 4){
    toolbarTop = topInFrame + lineHeight + gap;
  }
  ayahToolbar.style.top = toolbarTop + 'px';

  setImmersive(true);
}

function hideAyahToolbar(){
  ayahHighlight.classList.remove('show');
  ayahToolbar.classList.remove('show');
  setImmersive(false);
}

pageFrame.addEventListener('click', (e) => {
  if(e.target.closest('.ayah-toolbar')) return; /* টুলবারের বাটনে ক্লিক আলাদাভাবে সামলানো হয় */
  if(ayahToolbar.classList.contains('show')){
    hideAyahToolbar();
  }else{
    showAyahToolbar(e.clientY);
  }
});

document.getElementById('atClose').addEventListener('click', (e) => {
  e.stopPropagation();
  hideAyahToolbar();
});
document.getElementById('atPlay').addEventListener('click', (e) => {
  e.stopPropagation();
  playBtn.click();
});
document.getElementById('atCopy').addEventListener('click', (e) => {
  e.stopPropagation();
  const text = `সূরা তিলাওয়াত — পাতা ${toBengaliNumeral(currentPage)}`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(
      () => alert('রেফারেন্স কপি করা হয়েছে। (এটি স্ক্যান করা পাতা হওয়ায় আয়াতের হুবহু লেখা কপি করা যায় না)'),
      () => alert('কপি করা যায়নি।')
    );
  }
});
document.getElementById('atShare').addEventListener('click', (e) => {
  e.stopPropagation();
  const shareData = { title:'কুরআন তিলাওয়াত', text:`পাতা ${toBengaliNumeral(currentPage)} দেখুন`, url: location.href };
  if(navigator.share){ navigator.share(shareData).catch(()=>{}); }
  else{ alert('এই ব্রাউজারে শেয়ার সমর্থিত নয়।'); }
});
document.getElementById('atTafsir').addEventListener('click', (e) => {
  e.stopPropagation();
  alert('এটি স্ক্যান করা মুসহাফ পাতা হওয়ায় আয়াতভিত্তিক তাফসীর এখানে সমর্থিত নয়।');
});
document.getElementById('atBookmark').addEventListener('click', (e) => {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.classList.toggle('bookmarked');
  if(btn.classList.contains('bookmarked')){
    localStorage.setItem('bookmarkPage_' + selectedMushaf, currentPage);
    alert('এই পাতাটি বুকমার্ক করা হয়েছে।');
  }else{
    localStorage.removeItem('bookmarkPage_' + selectedMushaf);
  }
});

prevPageBtn.addEventListener('click', () => { if(currentPage > 1) renderPage(currentPage - 1); });
nextPageBtn.addEventListener('click', () => { if(currentPage < totalPages) renderPage(currentPage + 1); });

/* swipe left/right to turn pages */
let touchStartX = null;
pageFrame.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
pageFrame.addEventListener('touchend', e => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
    else if(dx > 0 && currentPage > 1) renderPage(currentPage - 1);
  }
  touchStartX = null;
}, {passive:true});

});

});
