<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>

    @font-face{   
    font-family:'Kalpurush';
    src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  

  :root{
    --brand:#175a45;
    --brand-dark:#0f4534;
    --brand-light:#1f6f55;
    --cream:#fdfaf3;
    --ink:#1b1b1b;
    --gold:#c9973f;
    --line:#d8d2c2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
    background:#e9e5da;
    color:var(--ink);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }

     html,body{
    margin:0;padding:0;
    font-family:'Kalpurush','Hind Siliguri','Noto Sans Bengali',sans-serif;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 30px rgba(0,0,0,.15);
    overflow:hidden;
  }

  /* ===== HEADER ===== */
  header{
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    position:relative;
    z-index:30;
    flex-shrink:0;
  }
  header .left{display:flex; align-items:center; gap:10px;}
  #mainHeader{
    position:absolute; top:0; left:0; right:0;
    transition:transform .28s ease, opacity .28s ease;
  }
  #mainHeader.hidden-bar{
    transform:translateY(-100%); opacity:0; pointer-events:none;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:#fff; cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:20px; height:20px;}
  .icon-btn.filled{background:#fff; color:var(--brand);}
  header h1{font-size:19px; font-weight:600;}
  header .right{display:flex; align-items:center; gap:2px;}

  /* ===== READER VIEW ===== */
  #readerView{flex:1; display:flex; flex-direction:column; min-height:0;}
  .status-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px; font-size:12px; color:#8a8370;
  }
  #pdfViewer{
    flex:1; display:flex; flex-direction:column; min-height:0; padding:0; width:100%;
    position:relative;
  }
  .page-frame{
    position:relative;
    flex:1;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    width:100%;
    height:100%;
  }
  #pdfCanvas{
    display:block;
  }
  .page-nav{
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:8px 0 2px; flex-shrink:0;
    max-height:60px; overflow:hidden;
    transition:max-height .28s ease, opacity .28s ease, padding .28s ease;
  }
  .page-nav.hidden-bar{
    max-height:0; opacity:0; padding-top:0; padding-bottom:0; pointer-events:none;
  }
  .nav-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--gold);
    background:#fff; color:var(--brand); display:flex; align-items:center;
    justify-content:center; cursor:pointer;
  }
  .nav-btn svg{width:18px; height:18px;}
  .nav-btn:disabled{opacity:.4; cursor:default;}
  #pageIndicator{font-size:13px; color:var(--brand); min-width:70px; text-align:center;}
  #loadingMsg{padding:40px 10px; text-align:center; color:#8a8370; font-size:14px;}

  /* ===== FOOTER PLAYER ===== */
  footer{
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    color:#fff; flex-shrink:0;
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    position:absolute; left:0; right:0; bottom:0;
    z-index:20;
    transition:transform .28s ease, opacity .28s ease;
  }
  footer.hidden-bar{
    transform:translateY(100%); opacity:0; pointer-events:none;
  }
  #playBtn{
    width:42px; height:42px; border-radius:50%; background:#fff;
    color:var(--brand); border:none; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; cursor:pointer;
  }
  #playBtn svg{width:18px; height:18px;}
  .reciter{flex:1; min-width:0;}
  .reciter .name{font-size:14px; font-weight:600; line-height:1.3;}
  .reciter .sub{font-size:11px; opacity:.75;}
  footer .right-icons{display:flex; align-items:center; gap:12px;}
  footer .right-icons svg{width:18px; height:18px; cursor:pointer;}

  /* ===== DROPDOWN MENU ===== */
  #menuOverlay{
    position:absolute; inset:0; background:rgba(0,0,0,.25);
    display:none; z-index:40;
  }
  #menuOverlay.show{display:block;}
  #menuCard{
    position:absolute; top:56px; right:10px; width:260px;
    background:#fff; border-radius:10px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .menu-item{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; font-size:14.5px; color:#20402f;
    cursor:pointer; border-bottom:1px solid #eee;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:#f3f3f3;}
  .menu-item svg{width:20px; height:20px; color:var(--brand); flex-shrink:0;}

  /* ===== MUSHAF SELECT VIEW ===== */
  #selectView{
    position:absolute; inset:0; background:var(--cream);
    display:none; flex-direction:column; z-index:35;
  }
  #selectView.show{display:flex;}
  .select-grid{
    flex:1; overflow-y:auto; padding:16px 14px 30px;
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .mushaf-card{cursor:pointer; text-align:center;}
  .mushaf-thumb{
    position:relative; aspect-ratio:3/4; border-radius:8px;
    background:#fff; display:flex; flex-direction:column; justify-content:center;
    align-items:center; gap:6px; padding:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    overflow:hidden;
  }
  .mushaf-thumb img{
    width:100%; height:100%; object-fit:cover; border-radius:5px; display:block;
  }
  .mushaf-thumb .mini-line{
    width:78%; height:5px; border-radius:2px; background:#d8d2c2;
  }
  .mushaf-thumb .mini-line.short{width:55%;}
  .mushaf-thumb .bismillah{
    font-family:'Amiri',serif; font-size:13px; color:#333; direction:rtl;
  }
  .check-badge{
    position:absolute; top:6px; left:6px; width:22px; height:22px;
    background:var(--brand); border-radius:50%; display:none;
    align-items:center; justify-content:center; color:#fff;
  }
  .check-badge svg{width:13px; height:13px;}
  .mushaf-card.active .check-badge{display:flex;}
  .mushaf-card.active .mushaf-thumb{outline:2.5px solid var(--brand); outline-offset:2px;}
  .mushaf-card .label{margin-top:8px; font-size:13px; color:#20402f; font-weight:500; line-height:1.4;}

  /* ===== AYAH SELECT TOOLBAR ===== */
  .ayah-toolbar{
    position:absolute; left:2.5%; right:2.5%; width:auto;
    background:var(--brand-dark); border-radius:8px;
    display:none; align-items:center; gap:8px; padding:12px 14px;
    z-index:50;
    transform:translateY(-50%);
    box-shadow:0 8px 20px rgba(0,0,0,.3);
  }
  .ayah-toolbar.show{display:flex; animation:slideIn .3s ease-out;}
  .ayah-toolbar button{
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.18); color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:all .2s ease;
  }
  .ayah-toolbar button svg{width:19px; height:19px;}
  .ayah-toolbar button:hover{background:rgba(255,255,255,.28); transform:scale(1.08);}
  .ayah-toolbar button:active{background:rgba(255,255,255,.35); transform:scale(0.95);}

  .ayah-highlight{
    position:absolute; left:3%; right:3%; width:auto;
    background:rgba(31, 111, 85, .18); 
    border:none;
    border-radius:0px;
    display:none; z-index:25;
    box-shadow:inset 0 0 0 1px rgba(23, 90, 69, .5);
    transition:opacity .2s ease;
  }
  .ayah-highlight.show{display:block; opacity:1;}

  /* ===== NIGHT MODE ===== */
  body.night{
    background:#1a1a1a;
  }
  body.night #app{
    background:#1c1c1c;
    color:#eee;
  }
  body.night .mushaf-thumb{background:#2a2a2a;}
  body.night .menu-item{background:#2a2a2a; color:#ddd;}
  body.night .page-frame{background:#1e1e1e;}
  body.night .nav-btn{background:#2a2a2a; color:#ddd;}
  body.night .select-grid{background:#1c1c1c;}
  body.night .mushaf-card .label{color:#ddd;}

  @keyframes highlightPulse {
    0% { opacity:0; transform:scaleY(0.9); }
    100% { opacity:1; transform:scaleY(1); }
  }

  @keyframes slideIn {
    0% { opacity:0; transform:translateY(-50%) scale(0.95); }
    100% { opacity:1; transform:translateY(-50%) scale(1); }
  }

</style>
</head>
<body>

<div id="app">

  <!-- ===================== HEADER ===================== -->
  <header id="mainHeader">
    <div class="left">
      <button class="icon-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
      <h1 id="headerTitle">কুরআন শরীফ</h1>
    </div>
    <div class="right">
      <button class="icon-btn" id="moonBtn" title="রাত মোড">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="translateBtn" title="অনুবাদ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8L5 3M8 3H5M9 3L11 8M3 8v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M3 8h14M3 8v6M9 3v11"/></svg>
      </button>
      <button class="icon-btn" id="searchBtn" title="সার্চ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== MENU OVERLAY ===================== -->
  <div id="menuOverlay">
    <div id="menuCard">
      <div class="menu-item" id="miPrint">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="5"/><rect x="2" y="9" width="20" height="9"/><path d="M8 19h8v3H8z"/></svg>
        <span>মুসহাফ নির্বাচন</span>

      <div class="menu-item" id="miAyahSelect">

        <span>পাতা নম্বর দিয়ে যান</span>
      </div>
    </div>
  </div>

  <!-- ===================== READER VIEW ===================== -->
  <div id="readerView">
    <div class="status-bar">
      <span id="statusText">লোড হচ্ছে...</span>
      <span id="timeMark"></span>
    </div>
    <div id="pdfViewer">
      <div class="page-frame" id="pageFrame">
        <canvas id="pdfCanvas"></canvas>
        <div id="ayahHighlight" class="ayah-highlight">
          <div style="position:absolute; top:50%; left:6px; transform:translateY(-50%); font-size:12px; color:var(--brand); opacity:.85; font-weight:700; letter-spacing:.3px;" id="ayahLineNum"></div>
        </div>
        <div class="ayah-toolbar" id="ayahToolbar">
          <button id="atPlay" title="শুনুন">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="atCopy" title="কপি করুন">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </button>
          <button id="atBookmark" title="বুকমার্ক">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button id="atShare" title="শেয়ার করুন">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2l-11 20-4-9-9-4 24-7z"/></svg>
          </button>
          <button id="atTafsir" title="তাফসীর">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 7H20"/></svg>
          </button>
          <button id="atClose" title="বন্ধ করুন">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="loadingMsg"></div>
      </div>
      <div class="page-nav" id="pageNavBar">
        <button class="nav-btn" id="prevPageBtn" title="আগের পাতা">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="pageIndicator">পাতা ১/৬০৪</span>
        <button class="nav-btn" id="nextPageBtn" title="পরের পাতা">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== MUSHAF SELECT VIEW ===================== -->
  <div id="selectView">
    <header>
      <div class="left">
        <button class="icon-btn" id="backBtn" title="ফিরে যান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1>কুরআন মুসহাফ</h1>
      </div>
    </header>
    <div class="select-grid" id="selectGrid"></div>
  </div>

  <!-- ===================== FOOTER PLAYER ===================== -->
  <footer id="mainFooter" class="hidden-bar">
    <button id="playBtn">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="reciter">
      <div class="name">মাহের আল মুআইক্বিলি</div>
      <div class="sub" id="playStatus">তিলাওয়াত শুনতে চালু করুন</div>
    </div>
    <div class="right-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2 21 6 17 10M3 6h18"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
    </div>
  </footer>
  <audio id="audio" preload="none"></audio>
</div>

let selectedMushaf = 'hafizi-emdadia'; // ডিফল্ট মুসহাফ
let currentPage = 1;
let totalPages = 604;
const pdfCanvas = document.getElementById('pdfCanvas');
const pageFrame = document.getElementById('pageFrame');
const pageNavBar = document.getElementById('pageNavBar');
const mainHeader = document.getElementById('mainHeader');
const mainFooter = document.getElementById('mainFooter');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const pageIndicator = document.getElementById('pageIndicator');
const loadingMsg = document.getElementById('loadingMsg');
const selectGrid = document.getElementById('selectGrid');
const selectView = document.getElementById('selectView');

let pdfDoc = null;

function toBengaliNumeral(n){
  const bengaliDigits = '০১२৩৪৫৬৭৮৯';
  return String(n).split('').map(d => bengaliDigits[d] || d).join('');
}

function loadQuranPdf(){
  const mushafData = MUSHAF_STYLES.find(m => m.id === selectedMushaf);
  if(!mushafData) return;

  loadingMsg.textContent = 'পিডিএফ লোড হচ্ছে...';
  pdfjsLib.getDocument(mushafData.file).promise.then(
    doc => {
      pdfDoc = doc;
      totalPages = doc.numPages;
      loadingMsg.textContent = '';
      
      // বর্তমান পাতা পুনরায় রেন্ডার করুন
      if(currentPage > totalPages) currentPage = 1;
      renderPage(currentPage);
    },
    err => {
      loadingMsg.textContent = '❌ পিডিএফ লোড করা যায়নি। অবস্থান যাচাই করুন।';
      console.error('PDF error:', err);
    }
  );
}

function renderPage(pageNum){
  if(!pdfDoc) return;
  pdfDoc.getPage(pageNum).then(page => {
    const scale = Math.min(window.innerWidth / page.getViewport({scale:1}).width, 3);
    const viewport = page.getViewport({scale});
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;
    
    page.render({canvasContext: pdfCanvas.getContext('2d'), viewport}).promise.then(() => {
      currentPage = pageNum;
      pageIndicator.textContent = `পাতা ${toBengaliNumeral(pageNum)}/${toBengaliNumeral(totalPages)}`;
      prevPageBtn.disabled = pageNum <= 1;
      nextPageBtn.disabled = pageNum >= totalPages;
      hideAyahToolbar();
    });
  });
}

function renderMushafGrid(){
  selectGrid.innerHTML = '';
  MUSHAF_STYLES.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mushaf-card' + (m.id === selectedMushaf ? ' active' : '');
    card.innerHTML = `
      <div class="mushaf-thumb">
        <img src="${m.img}" alt="${m.name}">
        <div class="check-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6L9 17l-5-5"/></svg></div>
      </div>
      <div class="label">${m.name}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.mushaf-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedMushaf = m.id;
      localStorage.setItem('selectedMushaf', m.id);
      selectView.classList.remove('show');
      loadQuranPdf();
    });
    selectGrid.appendChild(card);
  });
}

function setImmersive(on){
  mainHeader.classList.toggle('hidden-bar', on);
  mainFooter.classList.toggle('hidden-bar', on);
  pageNavBar.classList.toggle('hidden-bar', on);
}

/* ===== আয়াত সিলেক্ট করার ফিচার ===== */
const ayahToolbar = document.getElementById('ayahToolbar');
const ayahHighlight = document.getElementById('ayahHighlight');
const ESTIMATED_LINES = 17; // প্রতি পাতায় গড়ে ১৭ লাইন

function showAyahToolbar(clientY){
  if(!pdfCanvas || !pdfCanvas.offsetParent) return; // ক্যানভাস visible না হলে exit করুন
  
  const canvasRect = pdfCanvas.getBoundingClientRect();
  const frameRect = pageFrame.getBoundingClientRect();
  
  // যদি ক্লিক ক্যানভাসের বাইরে হয় তবে রিটার্ন করুন
  if(clientY < frameRect.top || clientY > frameRect.bottom) return;
  if(clientY < canvasRect.top || clientY > canvasRect.bottom) return;

  // ক্যানভাসের ভিতরে সম্পর্কিত Y পজিশন
  const relY = clientY - canvasRect.top;
  
  // ক্যানভাসের উচ্চতা
  const canvasHeight = canvasRect.height;
  
  // যদি উচ্চতা 0 হয় তবে রিটার্ন করুন
  if(canvasHeight <= 0) return;
  
  // লাইনের উচ্চতা
  const lineHeight = canvasHeight / ESTIMATED_LINES;
  
  // কোন লাইন ক্লিক করা হয়েছে
  const lineIndex = Math.min(ESTIMATED_LINES - 1, Math.max(0, Math.floor(relY / lineHeight)));
  
  // ফ্রেমের ভিতরে হাইলাইটের টপ পজিশন
  const topInFrame = (canvasRect.top - frameRect.top) + lineIndex * lineHeight;
  
  // হাইলাইট অবস্থান সেট করুন
  ayahHighlight.style.top = topInFrame + 'px';
  ayahHighlight.style.height = lineHeight + 'px';
  ayahHighlight.classList.add('show');
  
  // লাইন নম্বর দেখান
  const lineNumDisplay = document.getElementById('ayahLineNum');
  lineNumDisplay.textContent = `${lineIndex + 1}`;

  // টুলবার শো করুন
  ayahToolbar.classList.add('show');
  
  // টুলবারের উচ্চতা পান
  setTimeout(() => {
    const toolbarH = ayahToolbar.offsetHeight || 50;
    const gap = 12;
    
    // প্রথমে উপরে রাখার চেষ্টা করুন
    let toolbarTop = topInFrame - toolbarH - gap;
    
    // যদি উপরে জায়গা না থাকে তবে নিচে রাখুন
    if(toolbarTop < 0){
      toolbarTop = topInFrame + lineHeight + gap;
    }
    
    ayahToolbar.style.top = toolbarTop + 'px';
  }, 50);

  setImmersive(true);
}

function hideAyahToolbar(){
  ayahHighlight.classList.remove('show');
  ayahToolbar.classList.remove('show');
  setImmersive(false);
}

pageFrame.addEventListener('click', (e) => {
  // টুলবারে ক্লিক করলে ইগনোর করুন
  if(e.target.closest('.ayah-toolbar')) return;
  
  // হাইলাইটের উপর ক্লিক করলে লুকান
  if(e.target === ayahHighlight || e.target.closest('#ayahLineNum')){
    hideAyahToolbar();
    return;
  }
  
  // অন্য জায়গায় ক্লিক করলে নতুন আয়াত সিলেক্ট করুন
  if(ayahToolbar.classList.contains('show')){
    hideAyahToolbar();
    setTimeout(() => showAyahToolbar(e.clientY), 150);
  }else{
    showAyahToolbar(e.clientY);
  }
});

document.getElementById('atClose').addEventListener('click', (e) => {
  e.stopPropagation();
  hideAyahToolbar();
});

document.getElementById('atPlay').addEventListener('click', (e) => {
  e.stopPropagation();
  playBtn.click();
});

document.getElementById('atCopy').addEventListener('click', (e) => {
  e.stopPropagation();
  const text = `সূরা তিলাওয়াত — পাতা ${toBengaliNumeral(currentPage)}`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(
      () => alert('রেফারেন্স কপি করা হয়েছে।'),
      () => alert('কপি করা যায়নি।')
    );
  }
});

document.getElementById('atShare').addEventListener('click', (e) => {
  e.stopPropagation();
  const shareData = { title:'কুরআন তিলাওয়াত', text:`পাতা ${toBengaliNumeral(currentPage)} দেখুন`, url: location.href };
  if(navigator.share){ navigator.share(shareData).catch(()=>{}); }
  else{ alert('এই ব্রাউজারে শেয়ার সমর্থিত নয়।'); }
});

document.getElementById('atTafsir').addEventListener('click', (e) => {
  e.stopPropagation();
  alert('এটি স্ক্যান করা মুসহাফ পাতা হওয়ায় তাফসীর সমর্থিত নয়।');
});

document.getElementById('atBookmark').addEventListener('click', (e) => {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.classList.toggle('bookmarked');
  if(btn.classList.contains('bookmarked')){
    localStorage.setItem('bookmarkPage_' + selectedMushaf, currentPage);
    alert('এই পাতাটি বুকমার্ক করা হয়েছে।');
  }else{
    localStorage.removeItem('bookmarkPage_' + selectedMushaf);
  }
});

prevPageBtn.addEventListener('click', () => { if(currentPage > 1) renderPage(currentPage - 1); });
nextPageBtn.addEventListener('click', () => { if(currentPage < totalPages) renderPage(currentPage + 1); });

/* সোয়াইপ দিয়ে পাতা পরিবর্তন */
let touchStartX = null;
pageFrame.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
pageFrame.addEventListener('touchend', e => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
    else if(dx > 0 && currentPage > 1) renderPage(currentPage - 1);
  }
  touchStartX = null;
}, {passive:true});

/* অডিও প্লেয়ার */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const playStatus = document.getElementById('playStatus');
audio.src = 'https://server12.mp3quran.net/maher/001.mp3';

let isPlaying = false;
playBtn.addEventListener('click', () => {
  if(!isPlaying){
    audio.play().catch(()=>{ playStatus.textContent = 'অডিও চালু করা যায়নি।'; });
    isPlaying = true;
    playIcon.innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    playStatus.textContent = 'তিলাওয়াত চলছে…';
  }else{
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playStatus.textContent = 'তিলাওয়াত শুনতে চালু করুন';
  }
});

audio.addEventListener('ended', () => {
  isPlaying = false;
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  playStatus.textContent = 'তিলাওয়াত শুনতে চালু করুন';
});

/* হেডার বাটন */
document.getElementById('moonBtn').addEventListener('click', () => {
  document.body.classList.toggle('night');
  const on = document.body.classList.contains('night');
  document.documentElement.style.setProperty('--cream', on ? '#1c1c1c' : '#fdfaf3');
  document.querySelector('#app').style.color = on ? '#eee' : '#1b1b1b';
});

document.getElementById('translateBtn').addEventListener('click', () => {
  alert('এটি স্ক্যান করা মুসহাফ পাতা, তাই আয়াতভিত্তিক অনুবাদ সমর্থিত নয়।');
});

document.getElementById('searchBtn').addEventListener('click', () => {
  const n = prompt(`কোন পাতা নম্বরে যেতে চান? (১-${totalPages})`);
  if(!n) return;
  const target = parseInt(n.trim(), 10);
  if(!isNaN(target) && target >= 1 && target <= totalPages){
    renderPage(target);
  }
});

/* মেনু বাটন */
const menuBtn = document.getElementById('menuBtn');
const menuOverlay = document.getElementById('menuOverlay');
menuBtn.addEventListener('click', () => menuOverlay.classList.add('show'));
menuOverlay.addEventListener('click', (e) => { if(e.target === menuOverlay) menuOverlay.classList.remove('show'); });

document.getElementById('miPrint').addEventListener('click', () => {
  menuOverlay.classList.remove('show');
  renderMushafGrid();
  selectView.classList.add('show');
});

document.getElementById('miAyahSelect').addEventListener('click', () => {
  menuOverlay.classList.remove('show');
  const n = prompt(`কোন পাতা নম্বরে যেতে চান? (১-${totalPages})`);
  if(!n) return;
  const target = parseInt(n.trim(), 10);
  if(!isNaN(target) && target >= 1 && target <= totalPages){
    renderPage(target);
  }
});

/* ব্যাক বাটন */
document.getElementById('backBtn').addEventListener('click', () => {
  selectView.classList.remove('show');
});

// সংরক্ষিত মুসহাফ লোড করুন
const saved = localStorage.getItem('selectedMushaf');
if(saved) selectedMushaf = saved;

// শুরু করুন
loadQuranPdf();
renderMushafGrid();
