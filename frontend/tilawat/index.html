<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Kalpurush','Hind Siliguri','Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== AUDIO PLAYER OVERLAY ===== */
    .audio-player-overlay {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(180deg, var(--brand), var(--brand-dark));
        color: #fff;
        padding: 12px 14px;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0,0,0,.2);
        display: none;
    }

    .audio-player-overlay.active {
        display: block;
    }

    .audio-info {
        font-size: 12px;
        margin-bottom: 8px;
        text-align: center;
        min-height: 16px;
        color: rgba(255,255,255,.9);
    }

    .audio-info.loading::after {
        content: ' ⟳';
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .audio-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
    }

    .audio-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255,255,255,.2);
        border: 1px solid rgba(255,255,255,.4);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s;
    }

    .audio-btn:hover {
        background: rgba(255,255,255,.3);
    }

    .audio-btn:active {
        background: rgba(255,255,255,.4);
    }

    .audio-progress {
        flex: 1;
        max-width: 200px;
        height: 4px;
        background: rgba(255,255,255,.2);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
    }

    .audio-progress-bar {
        height: 100%;
        background: var(--gold);
        width: 0%;
        transition: width .1s linear;
    }

    .audio-time {
        font-size: 11px;
        min-width: 35px;
        text-align: right;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .page-wrap{
        position:relative;
        display:inline-block;
        max-width:100%;
        max-height:100%;
    }

    .ayah-highlight{
        position:absolute;
        pointer-events:none;
        background:rgba(139,195,74,.4);
        border-radius:3px;
        transition:opacity .2s;
        z-index:5;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== ACTION BUTTONS BAR ===== */
    .action-buttons-bar{
        position:absolute;
        left:0;
        right:0;
        background:rgba(15,69,52,.95);
        display:none;
        flex-direction:row;
        align-items:center;
        justify-content:space-evenly;
        padding:9px 8px;
        gap:2px;
        z-index:40;
        box-shadow:0 3px 12px rgba(0,0,0,.28);
    }

    .action-buttons-bar.active{
        display:flex;
    }

    .action-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1.5px solid rgba(255,255,255,.55);
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-shrink:0;
        transition:background .2s, transform .12s;
        padding:0;
        position:relative;
    }

    .action-btn:hover{
        background:rgba(255,255,255,.12);
    }

    .action-btn:active{
        transform:scale(.9);
        background:rgba(255,255,255,.2);
    }

    .action-btn svg{
        width:17px;
        height:17px;
        stroke-width:1.6;
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
        display:none;
    }

    .ayah-selection-bar.active{
        display:block;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
        box-shadow: inset 0 0 8px rgba(23,90,69,0.15);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.15) 0%, rgba(23,90,69,.08) 100%);
        font-weight:600;
        border-left: 4px solid var(--brand);
    }

    .ayah-item.now-playing {
        animation: pulse-ayah 1.5s ease-in-out infinite;
    }

    @keyframes pulse-ayah {
        0%, 100% { box-shadow: inset 0 0 8px rgba(201,151,63,0.2); }
        50% { box-shadow: inset 0 0 12px rgba(201,151,63,0.4); }
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        background:rgba(255,255,255,.15);
        border:none;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.25);
    }

    .page-indicator{
        font-size:13px;
        flex:1;
        text-align:center;
    }

    audio {
        display: none;
    }
</style>
</head>

        { num: 113, name: 'الفلق', bn: 'ফালাক', ayahs: 5 },
        { num: 114, name: 'الناس', bn: 'নাস', ayahs: 6 }
    ];

    // ===== AUDIO RECITER SOURCES =====
    const AUDIO_SOURCES = [
        { name: 'Alafasy', code: 'alafasy' },
        { name: 'Minshawi', code: 'minshawi' },
        { name: 'Sudais', code: 'sudais' }
    ];

    // PDF.js ওয়ার্কার সেটআপ
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // DOM এলিমেন্ট রেফারেন্স
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const pageDisplay = document.getElementById('pageDisplay');
    const pageWrap = document.getElementById('pageWrap');
    const audioPlayer = document.getElementById('audioPlayer');
    const quranAudio = document.getElementById('quranAudio');
    const audioInfo = document.getElementById('audioInfo');
    const audioPlayBtn = document.getElementById('audioPlayBtn');
    const audioProgressBar = document.getElementById('audioProgressBar');
    const audioTime = document.getElementById('audioTime');
    const ayahBar = document.getElementById('ayahBar');
    const actionButtonsBar = document.getElementById('actionButtonsBar');
    const pageIndicator = document.getElementById('pageIndicator');
    const playBtn = document.getElementById('playBtn');
    const copyBtn = document.getElementById('copyBtn');

    // স্টেট ভেরিয়েবল
    let pdfDoc = null;
    let totalPages = 0;
    let currentPage = 1;
    let selectedAyahId = null;
    let currentAyahList = [];
    let currentRegions = [];
    let isPlaying = false;
    let currentSurah = null;
    let currentAyah = null;

    // ===== অডিও সোর্স এবং ডাউনলোড ফাংশন =====
    
    // ইসলামিক নেটওয়ার্ক থেকে সম্পূর্ণ সূরার অডিও পান
    async function downloadFullSurahAudio(surahNum, reciterCode = 'alafasy') {
        const surahPad = String(surahNum).padStart(3, '0');
        
        const audioSources = [
            // Islamic Network API
            `https://cdn.islamic.network/quran/audio-surah/ar.${reciterCode}/${surahPad}.mp3`,
            // EveryAyah যদি ১ম ফেল হয়
            `https://everyayah.com/data/${capitalize(reciterCode)}_64kbps/${surahPad}.mp3`,
            // Backup সোর্স
            `https://www.everyayah.com/data/${capitalize(reciterCode)}_64kbps/${surahPad}.mp3`
        ];

        for (const url of audioSources) {
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'audio/mpeg' }
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    if (blob.size > 1000 && blob.type.includes('audio')) {
                        return URL.createObjectURL(blob);
                    }
                }
            } catch (error) {
                console.warn(`অডিও লোড ব্যর্থ: ${url}`, error.message);
            }
        }
        
        throw new Error('সকল সূরার অডিও সোর্স থেকে ডাউনলোড ব্যর্থ। ইন্টারনেট চেক করুন।');
    }

    // সূরার জন্য আয়াত শুরু করার সময় পান
    async function getAyahStartTime(surahNum, ayahNum) {
        try {
            // Quranic API থেকে আয়াতের সময়কাল পান
            const response = await fetch(
                `https://api.quran.com/api/v4/recitations/1/ayah_timings?surah_number=${surahNum}&recitation_id=2`,
                { 
                    headers: { 'Accept': 'application/json' }
                }
            );
            
            if (response.ok) {
                const data = await response.json();
                const timings = data.timings || [];
                
                let totalTime = 0;
                for (let i = 0; i < ayahNum - 1 && i < timings.length; i++) {
                    const timing = timings[i].time_seconds || 0;
                    totalTime += timing;
                }
                return totalTime;
            }
        } catch (error) {
            console.warn('সময় তথ্য API ব্যর্থ:', error);
        }
        
        // ফলব্যাক: প্রতিটি আয়াত গড়ে ৫-৬ সেকেন্ড
        return (ayahNum - 1) * 5.5;
    }

    // ক্যাপিটালাইজ ফাংশন
    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // ===== অডিও প্লেব্যাক কন্ট্রোল =====
    
    async function playAyah(surahNum, ayahNum) {
        try {
            currentSurah = SURAHS.find(s => s.num === surahNum);
            currentAyah = ayahNum;

            // নিজে-চলছে অ্যানিমেশন যোগ করুন
            document.querySelectorAll('.ayah-item').forEach(el => {
                el.classList.remove('now-playing');
            });
            const selectedItem = document.querySelector('.ayah-item.selected');
            if (selectedItem) {
                selectedItem.classList.add('now-playing');
            }
            
            audioPlayer.classList.add('active');
            audioInfo.textContent = `ডাউনলোড হচ্ছে: ${currentSurah.name}`;
            audioInfo.classList.add('loading');
            
            // সম্পূর্ণ সূরার অডিও ডাউনলোড করুন
            const audioUrl = await downloadFullSurahAudio(surahNum);
            
            quranAudio.src = audioUrl;
            const startTime = await getAyahStartTime(surahNum, ayahNum);
            
            quranAudio.load();
            
            quranAudio.onloadedmetadata = async () => {
                quranAudio.currentTime = startTime;
                audioInfo.textContent = `${currentSurah.name} (${currentSurah.bn}) • আয়াত ${ayahNum}`;
                audioInfo.classList.remove('loading');
                
                try {
                    await quranAudio.play();
                    isPlaying = true;
                    audioPlayBtn.textContent = '⏸';
                } catch (err) {
                    console.error('প্লেব্যাক ত্রুটি:', err);
                    alert('অডিও চালাতে সমস্যা হয়েছে।');
                }
            };
            
            // টাইমআউট ফলব্যাক
            setTimeout(() => {
                if (!quranAudio.currentTime) {
                    quranAudio.currentTime = startTime;
                    quranAudio.play().catch(() => {});
                }
            }, 3000);
            
        } catch (error) {
            console.error('অডিও ত্রুটি:', error);
            audioInfo.textContent = `ত্রুটি: ${error.message}`;
            audioInfo.classList.remove('loading');
            alert('অডিও লোড করতে সমস্যা হয়েছে। ইন্টারনেট চেক করুন।');
        }
    }

    function togglePlayPause() {
        if (isPlaying) {
            quranAudio.pause();
            isPlaying = false;
            audioPlayBtn.textContent = '▶';
        } else {
            quranAudio.play().catch(() => {});
            isPlaying = true;
            audioPlayBtn.textContent = '⏸';
        }
    }

    // অডিও ইভেন্ট লিসেনার
    quranAudio.ontimeupdate = () => {
        const progress = (quranAudio.currentTime / quranAudio.duration) * 100;
        audioProgressBar.style.width = progress + '%';
        
        const mins = Math.floor(quranAudio.currentTime / 60);
        const secs = Math.floor(quranAudio.currentTime % 60);
        audioTime.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    quranAudio.onended = () => {
        isPlaying = false;
        audioPlayBtn.textContent = '▶';
        document.querySelectorAll('.ayah-item.now-playing').forEach(el => {
            el.classList.remove('now-playing');
        });
    };

    // অডিও বাটন ইভেন্ট
    audioPlayBtn.addEventListener('click', togglePlayPause);
    audioProgressBar.parentElement.addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        quranAudio.currentTime = percent * quranAudio.duration;
    });

    // ===== অ্যাকশন বাটন =====
    
    playBtn.addEventListener('click', async () => {
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah && ayah.surahNum) {
            await playAyah(ayah.surahNum, ayah.ayahNum);
        } else {
            alert('দয়া করে একটি আয়াত নির্বাচন করুন।');
        }
    });

    copyBtn.addEventListener('click', () => {
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah && ayah.text) {
            navigator.clipboard.writeText(ayah.text).then(() => {
                alert('আয়াত কপি করা হয়েছে।');
            });
        }
    });

    // ===== PDF রেন্ডারিং =====
    
    async function renderPage(num) {
        if (!pdfDoc) return;
        currentPage = Math.max(1, Math.min(num, totalPages));
        
        const page = await pdfDoc.getPage(currentPage);
        const scale = Math.min(pageDisplay.clientWidth / page.getViewport({ scale: 1 }).width, 1.5);
        const viewport = page.getViewport({ scale });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        try {
            await page.render({ canvasContext: ctx, viewport }).promise;
        } catch (e) {
            console.error('পৃষ্ঠা রেন্ডার ত্রুটি:', e);
        }
        
        pageIndicator.textContent = `পৃষ্ঠা ${toBengaliNumeral(currentPage)} / ${toBengaliNumeral(totalPages)}`;
    }

    // পৃষ্ঠা নেভিগেশন
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
    });

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)] || digit).join('');
    }

    // স্যুইপ নেভিগেশন
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

    // ===== PDF লোডিং =====
    
    async function loadPdf() {
        const pdfUrl = '/tilawat/Emdadia-Hafezi-Quran.pdf';
        
        try {
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            await renderPage(1);
            pageIndicator.textContent = `পৃষ্ঠা ${toBengaliNumeral(1)} / ${toBengaliNumeral(totalPages)}`;
        } catch (error) {
            console.error('PDF লোড ত্রুটি:', error);
            canvas.textContent = 'PDF লোড করতে সমস্যা হয়েছে।';
        }
    }

    // প্রাথমিক লোডিং
    loadPdf();
</script>
