<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .page-wrap{
        position:relative;
        display:inline-block;
        max-width:100%;
        max-height:100%;
    }

    .ayah-highlight{
        position:absolute;
        pointer-events:none;
        background:rgba(201,151,63,.28);
        border:1px solid rgba(23,90,69,.45);
        border-radius:4px;
        transition:opacity .2s;
    }

    .region-note{
        position:absolute;
        left:0; right:0; bottom:0;
        background:rgba(23,90,69,.85);
        color:#fff;
        font-size:11px;
        text-align:center;
        padding:3px 6px;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.08) 0%, transparent 100%);
        font-weight:600;
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1px solid rgba(255,255,255,.3);
        background:transparent;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .nav-btn:disabled{
        opacity:.4;
        cursor:default;
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        flex:1;
        text-align:center;
        font-size:13px;
    }

    /* ===== ACTION TOOLBAR ===== */
    .action-toolbar{
        display:flex;
        justify-content:space-around;
        align-items:center;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        padding:8px 0;
        flex-shrink:0;
        gap:0;
    }

    .toolbar-btn{
        flex:1;
        height:44px;
        border:none;
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:2px;
        font-size:11px;
        transition:background .2s;
    }

    .toolbar-btn:active{
        background:rgba(0,0,0,.1);
    }

    .toolbar-btn svg{
        width:20px;
        height:20px;
    }

    /* ===== MODAL/OVERLAY ===== */
    .modal{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.5);
        display:none;
        z-index:100;
        align-items:center;
        justify-content:center;
    }

    .modal.show{
        display:flex;
    }

    .modal-content{
        background:#fff;
        border-radius:12px;
        padding:20px;
        max-width:90%;
        max-height:80vh;
        overflow-y:auto;
    }

    /* ===== LOADING ===== */
    .loading{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        color:#8a8370;
    }

    .spinner{
        width:20px;
        height:20px;
        border:2px solid var(--line);
        border-top-color:var(--brand);
        border-radius:50%;
        animation:spin .6s linear infinite;
    }

    @keyframes spin{
        to{transform:rotate(360deg)}
    }

</style>
</head>
<body>
<div id="app">
    <!-- HEADER -->
    <header>
        <div class="left">
            <button class="icon-btn" id="homeBtn" title="হোম">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <h1>কুরআন শরীফ</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="moonBtn" title="রাত মোড">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="searchBtn" title="সার্চ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="menuBtn" title="মেনু">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <div class="loading">
                <div class="spinner"></div>
                <span>পাতা লোড হচ্ছে...</span>
            </div>
        </div>
    </div>

    <!-- AYAH SELECTION BAR -->
    <div class="ayah-selection-bar" id="ayahBar">
        <div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>
    </div>

    <!-- PAGE CONTROLS -->
    <div class="page-controls">
        <button class="nav-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="page-info">
            <span id="pageNum">১</span> / <span id="totalPages">১</span>
        </div>
        <button class="nav-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </button>
    </div>

    <!-- ACTION TOOLBAR -->
    <div class="action-toolbar">
        <button class="toolbar-btn" id="playBtn" title="পড়ুন">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>পড়ুন</span>
        </button>
        <button class="toolbar-btn" id="bookmarkBtn" title="বুকমার্ক">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            <span>বুকমার্ক</span>
        </button>
        <button class="toolbar-btn" id="shareBtn" title="শেয়ার">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span>শেয়ার</span>
        </button>
        <button class="toolbar-btn" id="tafsirBtn" title="তাফসীর">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>তাফসীর</span>
        </button>
        <button class="toolbar-btn" id="moreBtn" title="আরও">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
            </svg>
            <span>আরও</span>
        </button>
    </div>
</div>

<audio id="audio"></audio>

<script>
    // PDF.js সেটআপ
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let selectedMushaf = 'emdadia';
    const pdfUrls = {
        emdadia: '/tilawat/Emdadia-Hafezi-Quran.pdf' // একই ডিরেক্টরিতে PDF ফাইল রাখুন
    };

    const pageDisplay = document.getElementById('pageDisplay');
    const ayahBar = document.getElementById('ayahBar');
    const pageNum = document.getElementById('pageNum');
    const totalPagesSpan = document.getElementById('totalPages');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // পিডিএফ লোড করুন
    async function loadPdf() {
        try {
            const pdfUrl = pdfUrls[selectedMushaf];
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            totalPagesSpan.textContent = toBengaliNumeral(totalPages);
            
            // সংরক্ষিত পৃষ্ঠা লোড করুন
            const savedPage = localStorage.getItem('currentPage_' + selectedMushaf);
            currentPage = savedPage ? parseInt(savedPage) : 1;
            
            await renderPage(currentPage);
        } catch (error) {
            console.error('PDF লোড করা যায়নি:', error);
            pageDisplay.innerHTML = '<div class="loading"><span>পিডিএফ লোড করা যায়নি।</span></div>';
        }
    }

    // পৃষ্ঠা রেন্ডার করুন
    async function renderPage(pageNumber) {
        if (!pdfDoc) return;
        
        try {
            const page = await pdfDoc.getPage(pageNumber);
            const scale = 1.5;
            const viewport = page.getViewport({ scale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport }).promise;
            
            // ক্যানভাস প্রদর্শন করুন
            pageDisplay.innerHTML = '';
            canvas.id = 'pdfCanvas';
            const wrap = document.createElement('div');
            wrap.className = 'page-wrap';
            wrap.appendChild(canvas);
            const highlight = document.createElement('div');
            highlight.className = 'ayah-highlight';
            highlight.style.display = 'none';
            wrap.appendChild(highlight);
            pageDisplay.appendChild(wrap);
            currentHighlight = highlight;

            // স্ক্লিক হ্যান্ডলার যোগ করুন
            setupPageClickHandlers(canvas, viewport);

            // এই পৃষ্ঠার আয়াত-অঞ্চল তৈরি/লোড করুন (সব পৃষ্ঠার জন্য স্বয়ংক্রিয়)
            ensureRegionsForPage(pageNumber, canvas);
            
            // পৃষ্ঠা নম্বর আপডেট করুন
            currentPage = pageNumber;
            pageNum.textContent = toBengaliNumeral(pageNumber);
            localStorage.setItem('currentPage_' + selectedMushaf, pageNumber);
            
            // নেভিগেশন বাটন অক্ষম/সক্ষম করুন
            prevBtn.disabled = pageNumber === 1;
            nextBtn.disabled = pageNumber === totalPages;
            
            // ডিফল্টে কোনো আয়াত দেখানো হবে না — ক্লিক করলে তবেই আয়াত-বার এ দেখাবে
            if (currentHighlight) currentHighlight.style.display = 'none';
            updateAyahBar([]);
        } catch (error) {
            console.error('পৃষ্ঠা রেন্ডার করা যায়নি:', error);
        }
    }

    // পৃষ্ঠাভিত্তিক আয়াত-অঞ্চল মানচিত্র — প্রকৃত স্ক্যান করা পিডিএফ পৃষ্ঠা পরিমাপ করে তৈরি
    // প্রতিটি অঞ্চল পৃষ্ঠার প্রস্থ/উচ্চতার ভগ্নাংশ (０ থেকে ১) হিসেবে সংজ্ঞায়িত, তাই যেকোনো স্ক্রিন সাইজে সঠিকভাবে কাজ করে
    // একই আয়াত একাধিক অঞ্চলে থাকতে পারে যদি তা একাধিক লাইনে ভাগ হয়ে থাকে
    const pageAyahRegions = {
        // পিডিএফ পৃষ্ঠা ২ = মুসহাফ পৃষ্ঠা ১ = সূরা আল-ফাতিহা (৭ আয়াত + বিসমিল্লাহ)
        2: [
            { surahNum: 1, ayahNum: 1, text: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', x0: 0,    x1: 1,    y0: 0.370, y1: 0.467 },
            { surahNum: 1, ayahNum: 2, text: 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', x0: 0,    x1: 1,    y0: 0.467, y1: 0.526 },
            { surahNum: 1, ayahNum: 3, text: 'الرَّحْمَٰنِ الرَّحِيمِ',            x0: 0.47, x1: 1,    y0: 0.526, y1: 0.585 },
            { surahNum: 1, ayahNum: 4, text: 'مَالِكِ يَوْمِ الدِّينِ',            x0: 0,    x1: 0.47, y0: 0.526, y1: 0.585 },
            { surahNum: 1, ayahNum: 4, text: 'مَالِكِ يَوْمِ الدِّينِ',            x0: 0.74, x1: 1,    y0: 0.585, y1: 0.645 },
            { surahNum: 1, ayahNum: 5, text: 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', x0: 0,    x1: 0.74, y0: 0.585, y1: 0.645 },
            { surahNum: 1, ayahNum: 5, text: 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', x0: 0.65, x1: 1,    y0: 0.645, y1: 0.704 },
            { surahNum: 1, ayahNum: 6, text: 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',      x0: 0,    x1: 0.65, y0: 0.645, y1: 0.704 },
            { surahNum: 1, ayahNum: 6, text: 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',      x0: 0.54, x1: 1,    y0: 0.704, y1: 0.764 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 0.54, y0: 0.704, y1: 0.764 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 1,    y0: 0.764, y1: 0.823 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 1,    y0: 0.823, y1: 0.896 }
        ],
        // পিডিএফ পৃষ্ঠা ৩ = মুসহাফ পৃষ্ঠা ২ = সূরা আল-বাকারা (আয়াত ১-৪, বিসমিল্লাহ এখানে আয়াত হিসেবে গণ্য নয়)
        3: [
            { surahNum: 2, ayahNum: 1, text: 'الٓمٓ',                                     x0: 0.78,  x1: 1, y0: 0.468, y1: 0.526 },
            { surahNum: 2, ayahNum: 2, text: 'ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ', x0: 0,     x1: 0.78, y0: 0.468, y1: 0.526 },

    // ==========================================================
    //  স্বয়ংক্রিয় আয়াত-অঞ্চল ইঞ্জিন (সব পৃষ্ঠার জন্য)
    //  ১. রেন্ডার করা পৃষ্ঠার পিক্সেল স্ক্যান করে প্রতিটি লাইনের অবস্থান বের করা হয়
    //  ২. quran.com API থেকে ঐ মুসহাফ পৃষ্ঠার আয়াতগুলো (শব্দ + লাইন নম্বর সহ) আনা হয়
    //  ৩. আয়াতগুলো লাইনে লাইনে (ডান থেকে বাম) ভাগ করে ক্লিকযোগ্য অঞ্চল তৈরি হয়
    //  ফলাফল localStorage-এ ক্যাশ হয়, তাই পরে অফলাইনেও কাজ করে।
    // ==========================================================

    const MUSHAF_PAGE_OFFSET = 1;      // পিডিএফ পৃষ্ঠা − ১ = মুসহাফ পৃষ্ঠা
    const autoRegions = {};            // pdfPage -> regions[]
    const regionBuildState = {};       // pdfPage -> 'loading' | 'done' | 'failed'
    let currentHighlight = null;

    function cacheKey(mushafPage) { return 'ayahRegions_v1_' + selectedMushaf + '_' + mushafPage; }

    function readCache(mushafPage) {
        try {
            const raw = localStorage.getItem(cacheKey(mushafPage));
            return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
    }

    function writeCache(mushafPage, regions) {
        try { localStorage.setItem(cacheKey(mushafPage), JSON.stringify(regions)); } catch (e) {}
    }

    // ---------- ১) পিক্সেল স্ক্যান করে লেখার লাইন সনাক্ত ----------
    function detectTextLines(canvas) {
        const w = canvas.width, h = canvas.height;
        let data;
        try {
            data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
        } catch (e) { return []; }

        const rowInk = new Int32Array(h);
        const rowMin = new Int32Array(h).fill(w);
        const rowMax = new Int32Array(h).fill(-1);

        for (let y = 0; y < h; y++) {
            let count = 0, min = w, max = -1;
            const base = y * w * 4;
            for (let x = 0; x < w; x++) {
                const i = base + x * 4;
                const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                if (lum < 150 && data[i + 3] > 40) {
                    count++;
                    if (x < min) min = x;
                    if (x > max) max = x;
                }
            }
            rowInk[y] = count; rowMin[y] = min; rowMax[y] = max;
        }

        const minInk = Math.max(3, w * 0.012);
        const bands = [];
        let startY = -1;
        const gapAllowed = Math.max(2, Math.round(h * 0.004));
        let gap = 0;

        for (let y = 0; y < h; y++) {
            const isInk = rowInk[y] >= minInk;
            if (isInk) {
                if (startY < 0) startY = y;
                gap = 0;
            } else if (startY >= 0) {
                gap++;
                if (gap > gapAllowed) {
                    bands.push([startY, y - gap]);
                    startY = -1; gap = 0;
                }
            }
        }
        if (startY >= 0) bands.push([startY, h - 1]);

        const lines = [];
        for (const [a, b] of bands) {
            const height = b - a + 1;
            if (height < h * 0.012) continue;          // খুব পাতলা — বর্ডার/দাগ
            let left = w, right = 0, ink = 0;
            for (let y = a; y <= b; y++) {
                if (rowMax[y] < 0) continue;
                ink += rowInk[y];
                if (rowMin[y] < left) left = rowMin[y];
                if (rowMax[y] > right) right = rowMax[y];
            }
            const width = right - left;
            if (width < w * 0.15) continue;             // খুব ছোট — পৃষ্ঠা নম্বর ইত্যাদি
            const density = ink / (height * Math.max(width, 1));
            if (density < 0.02) continue;               // ফাঁকা ফ্রেম লাইন
            lines.push({
                y0: a / h, y1: (b + 1) / h,
                x0: Math.max(0, (left - w * 0.01) / w),
                x1: Math.min(1, (right + w * 0.01) / w)
            });
        }

        // পাশাপাশি থাকা লাইনগুলোর মাঝের ফাঁক সমানভাবে ভাগ করে দিন (ট্যাপ সহজ হয়)
        for (let i = 0; i < lines.length - 1; i++) {
            const mid = (lines[i].y1 + lines[i + 1].y0) / 2;
            lines[i].y1 = mid;
            lines[i + 1].y0 = mid;
        }
        return lines;
    }

    // ---------- ২) আয়াত ডেটা আনুন ----------
    async function fetchPageVerses(mushafPage) {
        const url = 'https://api.quran.com/api/v4/verses/by_page/' + mushafPage +
            '?words=true&word_fields=line_number,text_uthmani&fields=text_uthmani&per_page=50';
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error ' + res.status);
        const json = await res.json();
        return (json.verses || []).map(v => {
            const key = String(v.verse_key || '').split(':');
            const words = (v.words || []).filter(wd => wd.char_type_name !== 'end');
            return {
                surahNum: parseInt(key[0], 10),
                ayahNum: parseInt(key[1], 10),
                text: v.text_uthmani || (v.words || []).map(wd => wd.text_uthmani || '').join(' '),
                wordCount: Math.max(1, words.length),
                lineNumbers: [...new Set((v.words || []).map(wd => wd.line_number).filter(Boolean))]
            };
        });
    }

    // ---------- ৩) আয়াত + লাইন মিলিয়ে অঞ্চল বানান ----------
    function buildRegions(verses, lines) {
        if (!verses.length || !lines.length) return [];

        // API-র লাইন নম্বর ব্যবহার করা যাবে কি না দেখুন
        const apiLines = [...new Set(verses.flatMap(v => v.lineNumbers))].sort((a, b) => a - b);
        const useApiLines = apiLines.length === lines.length;

        const regions = [];

        if (useApiLines) {
            apiLines.forEach((ln, idx) => {
                const line = lines[idx];
                const onLine = verses.filter(v => v.lineNumbers.includes(ln));
                const total = onLine.reduce((s, v) => s + v.wordCount / v.lineNumbers.length, 0) || 1;
                let acc = 0;
                const lw = line.x1 - line.x0;
                onLine.forEach(v => {
                    const share = (v.wordCount / v.lineNumbers.length) / total;
                    // RTL: প্রথম আয়াত ডান দিক থেকে শুরু
                    const xEnd = line.x1 - acc * lw;
                    const xStart = xEnd - share * lw;
                    acc += share;
                    regions.push({
                        surahNum: v.surahNum, ayahNum: v.ayahNum, text: v.text,
                        x0: Math.min(xStart, xEnd), x1: Math.max(xStart, xEnd),
                        y0: line.y0, y1: line.y1
                    });
                });
            });
            return regions;
        }

        // ফলব্যাক: মোট শব্দ সংখ্যা অনুপাতে লাইনে লাইনে ভাগ করুন
        const lineWidths = lines.map(l => l.x1 - l.x0);
        const totalWidth = lineWidths.reduce((a, b) => a + b, 0) || 1;
        const totalWords = verses.reduce((s, v) => s + v.wordCount, 0) || 1;
        const capacity = lineWidths.map(w => (w / totalWidth) * totalWords);

        let li = 0, used = 0;
        verses.forEach(v => {
            let remaining = v.wordCount;
            while (remaining > 0 && li < lines.length) {
                const free = Math.max(capacity[li] - used, 0);
                const take = Math.min(remaining, free > 0 ? free : remaining);
                const line = lines[li];
                const lw = line.x1 - line.x0;
                const startFrac = used / (capacity[li] || 1);
                const endFrac = Math.min((used + take) / (capacity[li] || 1), 1);
                regions.push({
                    surahNum: v.surahNum, ayahNum: v.ayahNum, text: v.text,
                    x0: line.x1 - endFrac * lw,
                    x1: line.x1 - startFrac * lw,
                    y0: line.y0, y1: line.y1
                });
                used += take;
                remaining -= take;
                if (used >= capacity[li] - 0.001) { li++; used = 0; }
            }
        });
        return regions;
    }

    async function ensureRegionsForPage(pdfPage, canvas) {
        if (pageAyahRegions[pdfPage] || autoRegions[pdfPage]) return;
        if (regionBuildState[pdfPage] === 'loading') return;
        regionBuildState[pdfPage] = 'loading';

        const mushafPage = pdfPage - MUSHAF_PAGE_OFFSET;
        if (mushafPage < 1 || mushafPage > 604) { regionBuildState[pdfPage] = 'failed'; return; }

        const lines = detectTextLines(canvas);

        try {
            let verses = readCache(mushafPage);
            if (!verses) {
                verses = await fetchPageVerses(mushafPage);
                if (verses.length) writeCache(mushafPage, verses);
            }
            const regions = buildRegions(verses, lines);
            if (regions.length) {
                autoRegions[pdfPage] = regions;
                regionBuildState[pdfPage] = 'done';
                return;
            }
        } catch (e) {
            console.warn('আয়াত ডেটা আনা যায়নি:', e);
        }

        // অফলাইন ফলব্যাক: অন্তত লাইন-ভিত্তিক নির্বাচন কাজ করবে
        autoRegions[pdfPage] = lines.map((l, i) => ({
            surahNum: 0, ayahNum: i + 1, text: 'লাইন ' + toBengaliNumeral(i + 1),
            x0: l.x0, x1: l.x1, y0: l.y0, y1: l.y1, isLine: true
        }));
        regionBuildState[pdfPage] = 'fallback';
    }

    function getRegions(pdfPage) {
        return pageAyahRegions[pdfPage] || autoRegions[pdfPage] || null;
    }

    function showHighlight(regions, hit) {
        if (!currentHighlight) return;
        const canvas = document.getElementById('pdfCanvas');
        if (!canvas) return;
        const parts = hit.isLine ? [hit] :
            regions.filter(r => r.surahNum === hit.surahNum && r.ayahNum === hit.ayahNum);
        const x0 = Math.min(...parts.map(r => r.x0));
        const x1 = Math.max(...parts.map(r => r.x1));
        const y0 = Math.min(...parts.map(r => r.y0));
        const y1 = Math.max(...parts.map(r => r.y1));
        currentHighlight.style.display = 'block';
        currentHighlight.style.left = (x0 * canvas.clientWidth) + 'px';
        currentHighlight.style.top = (y0 * canvas.clientHeight) + 'px';
        currentHighlight.style.width = ((x1 - x0) * canvas.clientWidth) + 'px';
        currentHighlight.style.height = ((y1 - y0) * canvas.clientHeight) + 'px';
    }

    // পৃষ্ঠায় ক্লিক হ্যান্ডলার — এখন প্রতিটি পৃষ্ঠাতেই আয়াত আলাদাভাবে নির্বাচন করা যায়
    function setupPageClickHandlers(canvas, viewport) {
        canvas.addEventListener('click', async (e) => {
            const rect = canvas.getBoundingClientRect();
            const xFrac = (e.clientX - rect.left) / rect.width;
            const yFrac = (e.clientY - rect.top) / rect.height;

            if (!getRegions(currentPage)) {
                await ensureRegionsForPage(currentPage, canvas);
            }
            const regions = getRegions(currentPage);
            if (!regions) return;

            let hit = regions.find(r => xFrac >= r.x0 && xFrac < r.x1 && yFrac >= r.y0 && yFrac < r.y1);
            if (!hit) {
                // একই লাইনে সবচেয়ে কাছের অঞ্চল বেছে নিন
                const sameLine = regions.filter(r => yFrac >= r.y0 && yFrac < r.y1);
                if (sameLine.length) {
                    hit = sameLine.reduce((best, r) => {
                        const d = Math.min(Math.abs(xFrac - r.x0), Math.abs(xFrac - r.x1));
                        return (!best || d < best.d) ? { ...r, d } : best;
                    }, null);
                }
            }
            if (!hit) return;

            showHighlight(regions, hit);
            selectAyah({
                id: hit.isLine ? `page_${currentPage}_line_${hit.ayahNum}` : `surah_${hit.surahNum}_ayah_${hit.ayahNum}`,
                text: hit.text,
                page: currentPage,
                surahNum: hit.surahNum,
                surahName: surahNames[hit.surahNum] || '',
                ayahNum: hit.ayahNum
            });
        });
    }

        6: ['الْحَمْدُ لِلَّهِ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ', 'وَالَّذِينَ كَفَرُوا بِرَبِّهِمْ يَعْدِلُونَ', 'هُوَ الَّذِي خَلَقَكُم مِّن طِينٍ'],
        7: ['الم', 'كِتَابٌ أُنزِلَ إِلَيْكَ فَلَا يَكُن فِي صَدْرِكَ حَرَجٌ', 'لِتُنذِرَ بِهِ وَذِكْرَىٰ لِلْمُؤْمِنِينَ'],
        8: ['يَسْأَلُونَكَ عَنِ الْأَنفَالِ', 'الَّذِينَ آمَنُوا وَجِلَتْ قُلُوبُهُمْ', 'إِنَّ اللَّهَ مَعَ الصَّابِرِينَ'],
        9: ['بَرَاءَةٌ مِّنَ اللَّهِ وَرَسُولِهِ', 'فَسِيحُوا فِي الْأَرْضِ أَرْبَعَةَ أَشْهُرٍ', 'وَأَذَانٌ مِّنَ اللَّهِ وَرَسُولِهِ'],
        10: ['الر تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ', 'أَكَانَ لِلنَّاسِ عَجَبًا', 'إِنَّ الَّذِينَ آمَنُوا'],
        11: ['الر كِتَابٌ أُحْكِمَتْ آيَاتُهُ ثُمَّ فُصِّلَتْ', 'مِن لَّدُنْ حَكِيمٍ خَبِيرٍ', 'أَلَّا تَعْبُدُوا إِلَّا اللَّهَ'],
        12: ['الر تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ', 'إِنَّا أَنزَلْنَاهُ قُرْآنًا عَرَبِيًّا', 'نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ الْقَصَصِ'],
        13: ['الم تِلْكَ آيَاتُ الْكِتَابِ ۗ وَالَّذِي أُنزِلَ إِلَيْكَ', 'اللَّهُ الَّذِي رَفَعَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ', 'وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ'],
        14: ['الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ', 'لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ', 'إِلَىٰ صِرَاطِ الْعَزِيزِ الْحَمِيدِ'],
        15: ['الر تِلْكَ آيَاتُ الْكِتَابِ وَقُرْآنٍ مُّبِينٍ', 'رُبَّمَا يَوَدُّ الَّذِينَ كَفَرُوا', 'فَذَرْهُمْ يَأْكُلُوا وَيَتَمَتَّعُوا'],
        16: ['بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَتَىٰ أَمْرُ اللَّهِ', 'فَلَا تَسْتَعْجِلُوهُ سُبْحَانَهُ وَتَعَالَىٰ', 'يَنزِلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا']
    };

    // ডেটাবেস জনপ্রিয় করুন - প্রতিটি সূরার জন্য নমুনা ডেটা
    function getDefaultAyahs(surahNum) {
        const defaults = [
            ['بسم الله الرحمن الرحيم', 'الحمد لله رب العالمين'],
            ['قل هو الله أحد', 'الله الصمد'],
            ['لم يلد ولم يولد', 'ولم يكن له كفوا أحد']
        ];
        return defaults[surahNum % defaults.length];
    }

    for (let i = 1; i <= 114; i++) {
        quranData[i] = {
            name: surahNames[i] || 'سورة غير معروفة',
            ayahs: ayahSamples[i] || getDefaultAyahs(i)
        };
    }

    // পৃষ্ঠা নম্বর থেকে সূরা এবং আয়াত খুঁজে পান
    // (নোট: এই ফাংশনটি বর্তমানে সরাসরি ট্যাপ-সনাক্তকরণে ব্যবহৃত হয় না —
    // তার বদলে উপরের pageAyahRegions ব্যবহার করা হয়, যা প্রকৃত পৃষ্ঠা পরিমাপ করে তৈরি।
    // এটি রাখা হয়েছে সম্ভাব্য ভবিষ্যৎ ব্যবহারের জন্য, যেমন অনুসন্ধান বা তালিকা view)

    // আয়াত নির্বাচন করুন
    function selectAyah(ayah) {
        // ক্লিক করা আয়াতটিই শুধু আয়াত-বার এ দেখান (ডিফল্টে বার খালি থাকে)
        updateAyahBar([ayah]);

        // নির্বাচিত আয়াত হাইলাইট করুন
        const selectedItem = ayahBar.querySelector(`[data-id="${CSS.escape(ayah.id)}"]`);
        if (selectedItem) {
            selectedItem.classList.add('selected');
            selectedItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    // আয়াত বার আপডেট করুন
    function updateAyahBar(ayahs) {
        if (ayahs.length === 0) {
            ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>';
            return;
        }
        
        ayahBar.innerHTML = ayahs.map(ayah => {
            const surahNameAr = quranData[ayah.surahNum] ? quranData[ayah.surahNum].name : 'سورة غير معروفة';
            return `<div class="ayah-item" data-id="${ayah.id}" onclick="selectAyah({id: '${ayah.id}', text: '${ayah.text.replace(/'/g, "\\'")}', page: ${ayah.page}, surahNum: ${ayah.surahNum}, surahName: '${ayah.surahName}', ayahNum: ${ayah.ayahNum}})">
                <div>${ayah.text}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:rtl; font-family:serif;">سورة ${surahNameAr} • آية ${ayah.ayahNum}</div>
            </div>`;
        }).join('');
    }

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)]).join('');
    }

    // নেভিগেশন
    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
    });

    // টুলবার বাটন
    document.getElementById('playBtn').addEventListener('click', () => {
        alert('অডিও বৈশিষ্ট্য শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.style.opacity = btn.style.opacity === '0.6' ? '1' : '0.6';
        alert('এই পৃষ্ঠাটি বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        const shareData = {
            title: 'কুরআন শরীফ',
            text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} দেখুন`,
            url: location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            alert('এই ব্রাউজারে শেয়ার সমর্থিত নয়।');
        }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    // শুরু করুন
    loadPdf();

    // স্পর্শ সোয়াইপ
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

</script>

</body>
</html>
