<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Kalpurush','Hind Siliguri','Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .page-wrap{
        position:relative;
        display:inline-block;
        max-width:100%;
        max-height:100%;
    }

    .ayah-highlight{
        position:absolute;
        pointer-events:none;
        background:rgba(139,195,74,.4);
        border-radius:3px;
        transition:opacity .2s;
        z-index:5;
    }

    .region-note{
        position:absolute;
        left:0; right:0; bottom:0;
        background:rgba(23,90,69,.85);
        color:#fff;
        font-size:11px;
        text-align:center;
        padding:3px 6px;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== ACTION BUTTONS BAR (হাইলাইট করা আয়াতের ঠিক নিচে ওভারলে হিসেবে দেখাবে) ===== */
    .action-buttons-bar{
        position:absolute;
        left:0;
        right:0;
        background:rgba(15,69,52,.95);
        display:none;
        flex-direction:row;
        align-items:center;
        justify-content:space-evenly;
        padding:9px 8px;
        gap:2px;
        z-index:40;
        box-shadow:0 3px 12px rgba(0,0,0,.28);
    }

    .action-buttons-bar.active{
        display:flex;
    }

    .action-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1.5px solid rgba(255,255,255,.55);
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-shrink:0;
        transition:background .2s, transform .12s;
        padding:0;
        position:relative;
    }

    .action-btn:hover{
        background:rgba(255,255,255,.12);
    }

    .action-btn:active{
        transform:scale(.9);
        background:rgba(255,255,255,.2);
    }

    .action-btn svg{
        width:17px;
        height:17px;
        stroke-width:1.6;
    }

    .action-btn.active{
        background:rgba(255,255,255,.25);
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
        display:none;
    }

    .ayah-selection-bar.active{
        display:block;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
        box-shadow: inset 0 0 8px rgba(23,90,69,0.15);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.15) 0%, rgba(23,90,69,.08) 100%);
        font-weight:600;
        border-left: 4px solid var(--brand);
    }

    .ayah-item.now-playing {
        animation: pulse-ayah 1.5s ease-in-out infinite;
    }

    @keyframes pulse-ayah {
        0%, 100% { box-shadow: inset 0 0 8px rgba(201,151,63,0.2); }
        50% { box-shadow: inset 0 0 12px rgba(201,151,63,0.4); }
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1px solid rgba(255,255,255,.3);
        background:transparent;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .nav-btn:disabled{
        opacity:0.5;
        cursor:not-allowed;
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        font-size:13px;
        min-width:60px;
        text-align:center;
    }

    /* ===== CUSTOM TOOLBAR ===== */
    .custom-toolbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:8px 12px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:8px;
    }

    .toolbar-left{
        display:flex;
        align-items:center;
        gap:8px;
    }

    .toolbar-play-btn{
        width:36px;
        height:36px;
        border-radius:4px;
        background:transparent;
        border:1px solid rgba(255,255,255,.3);
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .toolbar-play-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .toolbar-play-btn svg{
        width:18px;
        height:18px;
    }

    .toolbar-title{
        font-size:14px;
        font-weight:500;
        direction:rtl;
        display:flex;
        flex-direction:column;
        gap:2px;
    }

    .toolbar-dropdown{
        background:transparent;
        border:none;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        gap:4px;
        font-size:12px;
        padding:4px 6px;
        transition:background .2s;
    }

    .toolbar-dropdown:hover{
        background:rgba(255,255,255,.1);
        border-radius:4px;
    }

    .toolbar-dropdown svg{
        width:14px;
        height:14px;
    }

    .toolbar-right{
        display:flex;
        align-items:center;
        gap:4px;
    }

    .toolbar-icon-btn{
        width:32px;
        height:32px;
        border-radius:4px;
        background:transparent;
        border:none;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .toolbar-icon-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .toolbar-icon-btn svg{
        width:18px;
        height:18px;
        stroke-width:1.5;
    }

    /* Night mode */
    body.night{
        background:#1b1b1b;
    }

    body.night #app{
        background:#2d2d2d;
        color:#e0e0e0;
    }

    body.night .page-display{
        background:#1a1a1a;
    }

    body.night .ayah-item{
        color:#e0e0e0;
    }

    body.night .ayah-selection-bar{
        background:#2d2d2d;
        border-top-color:#444;
    }

    body.night .ayah-item.selected{
        background:rgba(23,90,69,.15);
        color:#6be59d;
    }

    /* ===== IMAGE MODAL ===== */
    .image-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
    }

    .image-modal.active {
        display: flex;
    }

    .image-modal-content {
        max-width: 95%;
        max-height: 95vh;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .image-modal-close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        line-height: 1;
    }

    .image-modal-close:hover {
        color: #bbb;
    }

    /* ===== SURAH MODAL ===== */
    .surah-modal {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
    }

    .surah-modal.active {
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }

    .surah-modal-content {
        background: var(--cream);
        width: 100%;
        max-height: 85vh;
        border-radius: 16px 16px 0 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
        from {
            transform: translateY(100%);
        }
        to {
            transform: translateY(0);
        }
    }

    .surah-modal-header {
        background: linear-gradient(180deg, var(--brand), var(--brand-dark));
        color: #fff;
        padding: 16px;
        text-align: center;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .surah-modal-header h2 {
        font-size: 18px;
        flex: 1;
    }

    .surah-modal-close-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .surah-list {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        background: #fff;
    }

    .surah-item {
        padding: 16px 16px;
        border-bottom: 1px solid #e0e0e0;
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }

    .surah-item:hover {
        background: #f5f5f5;
    }

    .surah-item.selected {
        background: rgba(23, 90, 69, 0.1);
        border-left: 4px solid var(--brand);
        padding-left: 12px;
        box-shadow: inset 0 0 8px rgba(23, 90, 69, 0.08);
    }

    .surah-item-left {
        flex: 1;
    }

    .surah-item-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
        direction: rtl;
        text-align: right;
        font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    }

    .surah-item-info {
        font-size: 13px;
        color: #666;
        margin-top: 4px;
        direction: rtl;
        text-align: right;
    }

    .surah-item-num {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-light));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        margin-left: 16px;
        box-shadow: 0 2px 6px rgba(23, 90, 69, 0.25);
    }

    /* ===== SURAH AYAHS VIEW ===== */
    .surah-ayahs-section {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 0;
        background: #fff;
        flex-direction: column;
    }

    .surah-ayahs-section.active {
        display: flex;
    }

    .surah-ayah-item {
        padding: 12px 16px;
        border-bottom: 1px solid #e0e0e0;
        cursor: pointer;
        transition: background 0.2s;
        text-align: right;
        direction: rtl;
        font-family: 'Amiri', 'Noto Naskh Arabic', serif;
        font-size: 16px;
        line-height: 1.8;
        color: var(--ink);
        position: relative;
    }

    .surah-ayah-item:hover {
        background: #f9f9f9;
    }

    .surah-ayah-item.selected {
        background: rgba(23, 90, 69, 0.12);
        border-left: 4px solid var(--brand);
        padding-left: 12px;
        color: var(--brand-dark);
        font-weight: 600;
    }

    .surah-back-btn {
        padding: 14px 16px;
        border-bottom: 1px solid #e0e0e0;
        background: #f5f5f5;
        border: none;
        color: var(--brand);
        font-weight: 600;
        cursor: pointer;
        text-align: right;
        direction: rtl;
        font-family: 'Kalpurush', 'Hind Siliguri', sans-serif;
        font-size: 14px;
        width: 100%;
        display: none;
    }

    .surah-back-btn.active {
        display: block;
    }

    /* ===== FULLSCREEN AUDIO DOWNLOAD SCREEN ===== */
    .fullscreen-download {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #3f6f52;
        z-index: 200;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.25s ease-in-out;
    }

    .fullscreen-download.active {
        display: flex;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .fs-download-title {
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 22px;
        text-align: center;
        padding: 0 30px;
        font-family: 'Kalpurush', 'Hind Siliguri', sans-serif;
        opacity: .92;
    }

    .download-circle-wrap {
        position: relative;
        width: 160px;
        height: 160px;
    }

    .download-circle-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }

    .download-circle-bg {
        fill: none;
        stroke: rgba(255,255,255,.28);
        stroke-width: 6;
    }

    .download-circle-fg {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 326.7256;
        stroke-dashoffset: 326.7256;
        transition: stroke-dashoffset .15s linear;
    }

    .download-percent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        font-family: 'Kalpurush', 'Hind Siliguri', sans-serif;
    }

    .download-cancel-btn {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 40px;
        background: rgba(0,0,0,.35);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        font-family: 'Kalpurush', 'Hind Siliguri', sans-serif;
        transition: background .2s ease;
    }

    .download-cancel-btn:active {
        background: rgba(0,0,0,.5);
    }

    .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid var(--brand);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 6px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<div id="app">
    <!-- HEADER -->
    <header>
        <div class="left">
            <button class="icon-btn" id="homeBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <h1>কুরআন</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="moonBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="searchBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="menuBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <div class="page-wrap" id="pageWrap">
                <canvas id="pdfCanvas"></canvas>

                <!-- ACTION BUTTONS BAR (আয়াত সিলেক্ট হলে হাইলাইটের ঠিক নিচে ওভারলে হয়ে দেখাবে) -->
                <div class="action-buttons-bar" id="actionButtonsBar">
                    <button class="action-btn" id="playBtn" title="অডিও চালান">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="copyBtn" title="অনুলিপি করুন">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="shareBtn" title="শেয়ার করুন">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="tafsirBtn" title="তাফসীর / অনুবাদ">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="bookmarkBtn" title="বুকমার্ক করুন">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="expandBtn" title="ফুলস্ক্রিন">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                            <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>

    // Get average duration for surahs without complete data
    function getAyahDuration(surahNum, ayahNum) {
        const surahKey = String(surahNum);
        if (QURAN_COMPLETE_DATA[surahKey] && QURAN_COMPLETE_DATA[surahKey].durations) {
            const duration = QURAN_COMPLETE_DATA[surahKey].durations[String(ayahNum)];
            if (duration) return duration;
        }
        // Return average if specific duration not found
        return 5.5;
    }

    // ===== FULLSCREEN ডাউনলোড স্ক্রিন - এলিমেন্ট =====
    const fullscreenDownload = document.getElementById('fullscreenDownload');
    const fsDownloadTitle = document.getElementById('fsDownloadTitle');
    const downloadCircleFg = document.getElementById('downloadCircleFg');
    const downloadPercent = document.getElementById('downloadPercent');
    const downloadCancelBtn = document.getElementById('downloadCancelBtn');
    const DOWNLOAD_CIRCLE_CIRCUMFERENCE = 326.7256; // 2 * π * 52 (SVG circle radius)
    let downloadAbortController = null;

    // পূর্ণ সূরার অডিও লিংক তৈরি করুন (mp3quran.net - মিশারী আলাফাসি)
    // প্রয়োজনে রিসাইটার/সার্ভার পরিবর্তন করতে শুধু এই ফাংশনটি বদলান
    function getSurahAudioUrl(surahNum) {
        const padded = String(surahNum).padStart(3, '0');
        return `https://server8.mp3quran.net/afs/${padded}.mp3`;
    }

    function setDownloadProgress(percent) {
        const clamped = Math.max(0, Math.min(100, percent));
        const offset = DOWNLOAD_CIRCLE_CIRCUMFERENCE - (DOWNLOAD_CIRCLE_CIRCUMFERENCE * clamped / 100);
        downloadCircleFg.style.strokeDashoffset = offset;
        downloadPercent.textContent = Math.round(clamped) + '%';
    }

    // পূর্ণ সূরাটি ডাউনলোড করুন এবং ফুলস্ক্রিন প্রগ্রেস স্ক্রিন দেখান
    async function downloadFullSurah(surahNum) {
        const surah = SURAHS.find(s => s.num === surahNum);
        fsDownloadTitle.textContent = surah
            ? `সূরা ${surah.name} (${surah.bn}) ডাউনলোড হচ্ছে...`
            : 'সূরা ডাউনলোড হচ্ছে...';

        setDownloadProgress(0);
        fullscreenDownload.classList.add('active');

        downloadAbortController = new AbortController();
        const url = getSurahAudioUrl(surahNum);

        try {
            const response = await fetch(url, { signal: downloadAbortController.signal });
            if (!response.ok || !response.body) throw new Error('ডাউনলোড ব্যর্থ হয়েছে');

            const totalStr = response.headers.get('Content-Length');
            const total = totalStr ? parseInt(totalStr, 10) : 0;
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total) {
                    setDownloadProgress((loaded / total) * 100);
                } else {
                    // মোট সাইজ জানা না থাকলে একটি অনুমানভিত্তিক প্রগ্রেস দেখান
                    setDownloadProgress(Math.min(95, (loaded / (1024 * 1024)) * 10));
                }
            }

            setDownloadProgress(100);

            const blob = new Blob(chunks, { type: 'audio/mpeg' });
            const objectUrl = URL.createObjectURL(blob);

            setTimeout(() => {
                fullscreenDownload.classList.remove('active');
                quranAudio.src = objectUrl;
                quranAudio.play().catch(() => {});
            }, 350);

        } catch (error) {
            if (error.name === 'AbortError') {
                console.log('ডাউনলোড বাতিল করা হয়েছে।');
            } else {
                console.error('ডাউনলোড ত্রুটি:', error);
                fullscreenDownload.classList.remove('active');
                alert('ডাউনলোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
            }
        } finally {
            downloadAbortController = null;
        }
    }

    // =====================================================================
    // স্বয়ংক্রিয় আয়াত-ম্যাপিং ইঞ্জিন
    // পুরো কুরআনের প্রতিটি পৃষ্ঠার প্রতিটি আয়াত স্বয়ংক্রিয়ভাবে শনাক্ত হবে,
    // ঠিক যেমনভাবে সূরা ফাতিহা (পৃষ্ঠা ২) হাতে ম্যাপ করা আছে।
    //  ১) manual regions.json / BUILTIN_REGIONS সর্বোচ্চ অগ্রাধিকার পায়
    //  ২) না থাকলে PDF-এর টেক্সট লেয়ার থেকে আয়াত-শেষের নম্বর চিহ্ন ধরে বিভাজন
    //  ৩) টেক্সট লেয়ার না থাকলে (স্ক্যান করা পিডিএফ) ক্যানভাস পিক্সেল বিশ্লেষণ করে
    //     লাইন শনাক্ত করে প্রতিটি লাইন ক্লিকযোগ্য/সিলেক্টযোগ্য করা হয়
    // =====================================================================
    let AUTO_REGIONS = {};                 // pageNum -> regions[]
    const PAGE_CTX = {};                   // pageNum -> {surahNum, ayahNum} (পৃষ্ঠার শুরুর অবস্থা)
    const CACHE_KEY = 'tilawat_auto_regions_v5'; // v5: লাইন-বিভাজনের স্থিতিশীল থ্রেশহোল্ড, অজানা মার্কার-গ্লিফ (AUTO) হ্যান্ডলিং, ও বহু-লাইন pending সুরক্ষা যোগ করার পর পুরনো ভুল ক্যাশ বাতিল করতে সংস্করণ বাড়ানো হয়েছে

    let scanRunning = false;

    // আরবি-হিন্দি সংখ্যা → ইংরেজি সংখ্যা
    function arabicToInt(str) {
        let out = '';
        for (const ch of String(str)) {
            const c = ch.charCodeAt(0);
            if (c >= 0x0660 && c <= 0x0669) out += String(c - 0x0660);
            else if (c >= 0x06F0 && c <= 0x06F9) out += String(c - 0x06F0);
            else if (ch >= '0' && ch <= '9') out += ch;
        }
        return out ? parseInt(out, 10) : null;
    }

    // এই টোকেনটা সাধারণ আরবি লেখার (হরফ/হরকত) না হয়ে, খুব ছোট ও অস্বাভাবিক
    // কোনো কোডপয়েন্ট (যেমন Private Use Area — অনেক কাস্টম মুসহাফ-ফন্টে
    // আয়াত-নম্বরের বৃত্ত-চিহ্ন এভাবেই এনকোড করা থাকে) দিয়ে তৈরি কি না তা
    // যাচাই করুন — হলে এটা সম্ভবত এই ফন্টের নিজস্ব আয়াত-মার্কার গ্লিফ
    function isLikelyMarkerGlyph(str) {
        if (!str || str.length > 4) return false;
        for (const ch of str) {
            const c = ch.codePointAt(0);
            // স্বাভাবিক আরবি হরফ/হরকত/মুকাত্তাআত-চিহ্ন রেঞ্জ হলে এটা সাধারণ লেখা, মার্কার না
            const isNormalArabic = (c >= 0x0621 && c <= 0x065F) || (c >= 0x0670 && c <= 0x06D5) || (c >= 0x0600 && c <= 0x0605);
            if (isNormalArabic) return false;
        }
        return true;
    }

    // আয়াত-শেষের চিহ্ন কি না (۝ ، ﴿١﴾ ، বা শুধু সংখ্যা)
    // এখানে আরও কিছু সাধারণ সাজাসজ্জা/ফাঁকা-চিহ্ন চরিত্র যোগ করা হয়েছে, যাতে
    // বিভিন্ন মুসহাফ ফন্টে ব্যবহৃত আয়াত-নম্বর মার্কার গ্লিফ মিস না হয়ে যায়।
    // রিটার্ন ভ্যালু তিন রকম হতে পারে:
    //   • একটা সংখ্যা (১-২৮৬)         → নিশ্চিতভাবে চেনা আয়াত-নম্বর
    //   • 'AUTO' (স্ট্রিং)              → এটা যে আয়াত-বিভাজন চিহ্ন তা প্রায় নিশ্চিত,
    //                                     কিন্তু এই মুসহাফ-ফন্টে ঠিক সংখ্যাটা বোঝা যায়নি —
    //                                     এক্ষেত্রে ধারাবাহিকভাবে (lastAyah+1) গণনা করা হবে
    //   • null                        → এটা আয়াত-মার্কার নয়, সাধারণ লেখা
    function markerValue(str) {
        const s = String(str).trim();
        if (!s) return null;
        // চিহ্ন ছাড়া বাকি সব অক্ষর সরিয়ে দেখুন কেবল সংখ্যা/বিরাম-চিহ্ন আছে কি না
        const cleaned = s.replace(/[\u06D6-\u06ED\u08E2\uFD3E\uFD3F()﴾﴿\[\]{}<>\s\u06E9\u0640\.\-–—,،:؛'"*٭۞]/g, '');
        if (cleaned) {
            if (/^[\u0660-\u0669\u06F0-\u06F90-9]+$/.test(cleaned)) {
                const v = arabicToInt(cleaned);
                if (v !== null && v >= 1 && v <= 286) return v;
            }
            // সংখ্যা হিসেবে মেলেনি — সাধারণ ডেকোরেশন বাদ দেওয়ার পরও যা বাকি
            // আছে সেটা যদি স্বাভাবিক আরবি লেখা না হয়ে অস্বাভাবিক/কাস্টম গ্লিফ
            // হয়, তাহলে সেটাকেও একটা মার্কার বিভাজন-বিন্দু হিসেবে ধরা হবে
            if (isLikelyMarkerGlyph(cleaned)) return 'AUTO';
            return null;
        }
        // ডেকোরেশন বাদ দেওয়ার পর কিছুই বাকি নেই — টোকেনটা পুরোপুরি আয়াত-শেষ
        // চিহ্নের ডেকোরেশন ক্যারেক্টার (যেমন শুধু ۝ বা ۞) দিয়ে তৈরি, যা প্রায়
        // নিশ্চিতভাবেই একটি আয়াত-বিভাজন চিহ্ন, শুধু সংখ্যাটা আলাদা এনকোড না
        if (s.length <= 3) return 'AUTO';
        return null;
    }

    function surahAyahCount(n) {
        const s = SURAHS.find(x => x.num === n);
        return s ? s.ayahs : 0;
    }

    // পিডিএফ টেক্সট লেয়ার থেকে এই পৃষ্ঠার আয়াত-খণ্ড (segment) বের করুন
    async function extractSegments(page) {
        let tc;
        try { tc = await page.getTextContent(); } catch (e) { return null; }
        const items = (tc.items || []).filter(it => it.str && it.str.trim());
        if (items.length < 3) return null;

        const vp = page.getViewport({ scale: 1 });
        const W = vp.width, H = vp.height;

        const boxes = items.map(it => {
            const tr = it.transform;
            const x = tr[4];
            const y = tr[5];
            const w = it.width || Math.abs(tr[0]) * it.str.length * 0.5;
            const h = it.height || Math.abs(tr[3]) || 12;
            return { str: it.str, x0: x, x1: x + w, yTop: H - (y + h), yBot: H - y + h * 0.25, h };
        }).filter(b => isFinite(b.x0) && isFinite(b.yTop));

        if (!boxes.length) return null;

        // লাইনে গ্রুপ করুন (y অনুযায়ী)
        boxes.sort((a, b) => a.yTop - b.yTop);

        // লাইন শনাক্তকরণের জন্য একটি স্থিতিশীল (stable) থ্রেশহোল্ড দরকার।
        // আগে এটি প্রতিটি অক্ষরের নিজের উচ্চতা (b.h/line.h) থেকে গতিশীলভাবে
        // হিসাব হতো — কিন্তু সূরা আল-বাকারার প্রথম পৃষ্ঠার মতো যেখানে
        // "الٓمٓ" (মুকাত্তাআত) সাধারণ লেখার চেয়ে অনেক বড়/লম্বা ছাপা হয়,
        // সেই একটি বড় অক্ষরের কারণে থ্রেশহোল্ড অস্বাভাবিক বেড়ে গিয়ে
        // পরের কয়েকটি লাইনকেও ভুলবশত একই লাইনে (এবং ফলে একই আয়াতে)
        // মিশিয়ে ফেলত — এতে বিসমিল্লাহ + আয়াত ১ + আয়াত ২ + আয়াত ৩-এর
        // কিছু অংশ একসাথে একটি বড় ব্লক হিসেবে সিলেক্ট হয়ে যেত।
        // এর বদলে পুরো পৃষ্ঠার সাধারণ (median) অক্ষর-উচ্চতা ধরে একটি
        // স্থির থ্রেশহোল্ড ব্যবহার করা হচ্ছে, যাতে দুই-একটি অস্বাভাবিক
        // বড়/ছোট অক্ষর সামগ্রিক লাইন-বিভাজনকে নষ্ট করতে না পারে।
        const sortedHeights = boxes.map(b => b.h).slice().sort((a, b) => a - b);
        const medianH = sortedHeights[Math.floor(sortedHeights.length / 2)] || 12;
        const lineGapThreshold = medianH * 0.65;

        const lines = [];
        for (const b of boxes) {
            const line = lines[lines.length - 1];
            if (line && Math.abs(b.yTop - line.yTop) < lineGapThreshold) {
                line.items.push(b);
                line.yTop = Math.min(line.yTop, b.yTop);
                line.yBot = Math.max(line.yBot, b.yBot);
            } else {
                lines.push({ yTop: b.yTop, yBot: b.yBot, h: b.h, items: [b] });
            }
        }

        // প্রতিটি লাইনকে ডান→বাম ক্রমে সাজিয়ে আয়াত-চিহ্ন ধরে ভাগ করুন
        const segs = [];   // {ayahNum|null, text, x0,x1,y0,y1}
        for (const line of lines) {
            line.items.sort((a, b) => b.x0 - a.x0); // RTL
            let cur = null;
            const flush = (num) => {
                if (!cur) return;
                segs.push({
                    ayahNum: num,
                    text: cur.text.trim(),
                    x0: cur.minX / W, x1: cur.maxX / W,
                    y0: line.yTop / H, y1: line.yBot / H
                });
                cur = null;
            };
            for (const it of line.items) {
                const mv = markerValue(it.str);
                if (!cur) cur = { text: '', minX: it.x0, maxX: it.x1 };
                cur.minX = Math.min(cur.minX, it.x0);
                cur.maxX = Math.max(cur.maxX, it.x1);
                if (mv !== null) {
                    flush(mv);            // এই খণ্ডটি এখানেই শেষ
                } else {
                    cur.text += it.str;
                }
            }
            flush(null);                   // লাইনের বাকি অংশ (পরের আয়াতের অংশ)
        }
        return segs.filter(s => (s.x1 - s.x0) > 0.005);
    }

    // খণ্ডগুলোকে সূরা/আয়াত নম্বর দিন এবং region বানান
    function segmentsToRegions(segs, ctx) {
        // ctx = {surahNum, ayahNum}  → পৃষ্ঠার শুরুতে চলমান অবস্থা (ayahNum = সর্বশেষ সম্পূর্ণ আয়াত)
        const out = [];
        let surah = ctx.surahNum, lastAyah = ctx.ayahNum;
        let pending = [];

        // pending-এ জমে থাকা খণ্ডগুলো একটি আয়াত নম্বরে ফ্লাশ করুন।
        // যদি কোনো পৃষ্ঠায়/অংশে আয়াত-শেষের চিহ্ন একেবারেই শনাক্ত করা না যায়
        // (যেমন এই মুসহাফের বিশেষ মার্কার গ্লিফ চেনা যায়নি), তাহলে একগাদা ভিন্ন
        // ভিন্ন আয়াত ভুলবশত একই আইডিতে মিশে গিয়ে "সব একসাথে সিলেক্ট হওয়া" সমস্যা
        // তৈরি করে। এটা ঠেকাতে অস্বাভাবিক রকম বড় pending (৪+ লাইন) পেলে প্রতিটি
        // লাইনকে আলাদা লাইন-ভিত্তিক আইডি দেওয়া হয়, যাতে অন্তত প্রতিটি লাইন
        // আলাদাভাবে ট্যাপ করে সিলেক্ট করা যায়।
        function flushPending(ayahNum) {
            if (!pending.length) return;
            let forceLine = pending.length > 4;
            // দ্বিতীয় সুরক্ষা-স্তর: আইটেম সংখ্যা কম (≤৪) হলেও যদি সেগুলো
            // পৃষ্ঠার একাধিক লাইন জুড়ে বিস্তৃত হয় (অর্থাৎ উল্লম্ব ব্যবধান
            // একটা সাধারণ লাইনের উচ্চতার প্রায় দ্বিগুণের বেশি), তাহলেও ধরে
            // নিতে হবে মাঝে একটা আয়াত-শেষ চিহ্ন মিস হয়ে গেছে — তাই এক্ষেত্রেও
            // প্রতিটি লাইন আলাদাভাবে ট্যাপযোগ্য করে দেওয়া হচ্ছে, যাতে একাধিক
            // ভিন্ন আয়াত ভুলবশত একই ব্লকে সিলেক্ট না হয়ে যায়
            if (!forceLine && pending.length > 1) {
                const heights = pending.map(p => p.y1 - p.y0).slice().sort((a, b) => a - b);
                const typicalH = heights[Math.floor(heights.length / 2)] || 0;
                const span = Math.max(...pending.map(p => p.y1)) - Math.min(...pending.map(p => p.y0));
                if (typicalH > 0 && span > typicalH * 1.8) forceLine = true;
            }
            for (const p of pending) {
                out.push({
                    surahNum: surah, ayahNum: ayahNum, text: p.text,
                    x0: p.x0, x1: p.x1, y0: p.y0, y1: p.y1,
                    isLine: forceLine
                });
            }
            pending = [];
        }

        for (const s of segs) {
            pending.push(s);
            if (s.ayahNum === null) continue;

            if (s.ayahNum === 'AUTO') {
                // এই মুসহাফ-ফন্টে ঠিক সংখ্যাটা বোঝা যায়নি, কিন্তু এটা যে একটা
                // আয়াত-বিভাজন চিহ্ন তা প্রায় নিশ্চিত — তাই ধারাবাহিকভাবে
                // পরের আয়াত ধরে নেওয়া হচ্ছে। এতে "নতুন সূরা শুরু হলো কি না"
                // এই অনুমান করার দরকার নেই — নিচের surahAyahCount চেক-টাই
                // স্বয়ংক্রিয়ভাবে সূরা পরিবর্তন সামলে নেবে।
                const num = lastAyah + 1;
                flushPending(num);
                lastAyah = num;
                if (lastAyah >= surahAyahCount(surah)) {
                    surah = Math.min(114, surah + 1);
                    lastAyah = 0;
                }
                continue;
            }

            let num = s.ayahNum;
            // নতুন সূরা শুরু হয়েছে কি না
            if (num === 1 && lastAyah !== 0) {
                if (lastAyah >= surahAyahCount(surah) - 1 || lastAyah > 1) {
                    surah = Math.min(114, surah + 1);
                }
            } else if (num !== lastAyah + 1 && num === 1) {
                surah = Math.min(114, surah + 1);
            }
            flushPending(num);
            lastAyah = num;
            if (lastAyah >= surahAyahCount(surah)) {
                // সূরা শেষ — পরের আয়াত নতুন সূরার
                surah = Math.min(114, surah + 1);
                lastAyah = 0;
            }
        }
        // শেষের অসম্পূর্ণ অংশ = পরের আয়াতের শুরু
        flushPending(lastAyah + 1);
        return { regions: out, next: { surahNum: surah, ayahNum: lastAyah } };
    }

    // স্ক্যান করা পিডিএফের জন্য: রেন্ডার করা ক্যানভাস বিশ্লেষণ করে লেখার লাইন শনাক্ত করুন
    function detectLinesFromCanvas() {
        try {
            const w = canvas.width, h = canvas.height;
            if (!w || !h) return [];
            const data = ctx.getImageData(0, 0, w, h).data;
            const rowDark = new Array(h).fill(0);
            const step = 2;
            for (let y = 0; y < h; y++) {
                let count = 0;
                for (let x = 0; x < w; x += step) {
                    const i = (y * w + x) * 4;
                    const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                    if (lum < 140) count++;
                }
                rowDark[y] = count;
            }
            const maxDark = Math.max(...rowDark);
            if (maxDark < 3) return [];
            const th = Math.max(2, maxDark * 0.06);
            const bands = [];
            let start = -1;
            for (let y = 0; y < h; y++) {
                if (rowDark[y] > th) { if (start < 0) start = y; }
                else if (start >= 0) {
                    if (y - start > h * 0.008) bands.push([start, y]);
                    start = -1;
                }
            }
            if (start >= 0) bands.push([start, h - 1]);

            return bands.map(([y0, y1]) => {
                // এই ব্যান্ডের অনুভূমিক বিস্তার বের করুন
                let minX = w, maxX = 0;
                for (let y = y0; y <= y1; y += 2) {
                    for (let x = 0; x < w; x += step) {
                        const i = (y * w + x) * 4;
                        const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        if (lum < 140) { if (x < minX) minX = x; if (x > maxX) maxX = x; }
                    }
                }
                if (maxX <= minX) { minX = 0; maxX = w; }
                const padY = (y1 - y0) * 0.15;
                return {
                    x0: Math.max(0, (minX - 4) / w),
                    x1: Math.min(1, (maxX + 4) / w),
                    y0: Math.max(0, (y0 - padY) / h),
                    y1: Math.min(1, (y1 + padY) / h)
                };
            }).filter(r => (r.y1 - r.y0) > 0.004 && (r.x1 - r.x0) > 0.05);
        } catch (e) {
            console.warn('লাইন শনাক্তকরণ ব্যর্থ:', e);
            return [];
        }
    }

    // ম্যানুয়াল ডেটা লোড (built-in ফাতিহা + regions.json) এবং ক্যাশ
    async function loadRegions() {
        ALL_REGIONS = JSON.parse(JSON.stringify(BUILTIN_REGIONS));
        try {
            const res = await fetch('regions.json', { cache: 'no-store' });
            if (res.ok) Object.assign(ALL_REGIONS, await res.json());
        } catch (e) {
            console.warn('regions.json নেই — স্বয়ংক্রিয় ম্যাপিং ব্যবহার হবে।');
        }
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const obj = JSON.parse(cached);
                if (obj && obj.regions) {
                    AUTO_REGIONS = obj.regions;
                    Object.assign(PAGE_CTX, obj.ctx || {});
                }
            }
        } catch (e) { /* ক্যাশ না থাকলে সমস্যা নেই */ }
    }

    function saveCache() {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ regions: AUTO_REGIONS, ctx: PAGE_CTX }));
        } catch (e) { /* কোটা পূর্ণ হলে উপেক্ষা করুন */ }
    }

    // একটি পৃষ্ঠার জন্য অবস্থা (কোন সূরা/আয়াত চলছে) অনুমান করুন
    function ctxForPage(pageNum) {
        if (PAGE_CTX[pageNum]) return PAGE_CTX[pageNum];
        for (let p = pageNum - 1; p >= 1; p--) {
            if (PAGE_CTX[p + 1]) return PAGE_CTX[p + 1];
        }
        return { surahNum: 1, ayahNum: 0 };
    }

    // এই পৃষ্ঠার আয়াত অঞ্চল নিশ্চিত করুন (দরকার হলে এখনই বের করুন)
    async function ensureRegions(pageNum, page) {
        if (ALL_REGIONS[String(pageNum)]) {
            const regions = ALL_REGIONS[String(pageNum)];
            // ম্যানুয়াল (হাতে ম্যাপ করা) পৃষ্ঠার পরের পৃষ্ঠাগুলো যেন স্বয়ংক্রিয়
            // ম্যাপিং-এ ভুল সূরা/আয়াত থেকে শুরু না হয়, তাই এখানেও পরবর্তী
            // পৃষ্ঠার প্রেক্ষাপট (context) সংরক্ষণ করা হয়
            if (!PAGE_CTX[String(pageNum + 1)] && regions.length) {
                const last = regions[regions.length - 1];
                PAGE_CTX[String(pageNum + 1)] = { surahNum: last.surahNum, ayahNum: last.ayahNum };
            }
            return regions;
        }
        if (AUTO_REGIONS[String(pageNum)]) return AUTO_REGIONS[String(pageNum)];

        const segs = await extractSegments(page);
        if (segs && segs.length) {
            const { regions, next } = segmentsToRegions(segs, ctxForPage(pageNum));
            AUTO_REGIONS[String(pageNum)] = regions;
            PAGE_CTX[String(pageNum + 1)] = next;
            saveCache();
            return regions;
        }
        return null; // পিক্সেল-ফলব্যাক renderPage-এ চলবে
    }

    // পটভূমিতে পুরো কুরআন স্ক্যান করুন — একবার হলে সব পৃষ্ঠা তাৎক্ষণিক কাজ করবে
    async function backgroundScan() {
        if (scanRunning || !pdfDoc) return;
        scanRunning = true;
        let ctx0 = { surahNum: 1, ayahNum: 0 };
        for (let p = 1; p <= totalPages; p++) {
            // ম্যানুয়ালি (হাতে) ম্যাপ করা পৃষ্ঠা (যেমন ফাতিহা) থাকলে সেটা
            // স্বয়ংক্রিয়ভাবে পুনরায় স্ক্যান/ওভাররাইট না করে সেই সঠিক ডেটা
            // থেকেই পরের পৃষ্ঠার প্রেক্ষাপট বের করুন
            if (ALL_REGIONS[String(p)]) {
                const manualRegions = ALL_REGIONS[String(p)];
                if (manualRegions.length) {
                    const last = manualRegions[manualRegions.length - 1];
                    ctx0 = { surahNum: last.surahNum, ayahNum: last.ayahNum };
                    PAGE_CTX[String(p + 1)] = ctx0;
                }
                continue;
            }
            if (AUTO_REGIONS[String(p)] && PAGE_CTX[String(p + 1)]) {
                ctx0 = PAGE_CTX[String(p + 1)];
                continue;
            }
            try {
                const pg = await pdfDoc.getPage(p);
                const segs = await extractSegments(pg);
                if (segs && segs.length) {
                    const { regions, next } = segmentsToRegions(segs, ctx0);
                    AUTO_REGIONS[String(p)] = regions;
                    PAGE_CTX[String(p + 1)] = next;
                    ctx0 = next;
                    if (p === currentPage && !ALL_REGIONS[String(p)]) {
                        applyRegions(regions);
                    }
                }
                pg.cleanup && pg.cleanup();
            } catch (e) { /* একটি পৃষ্ঠা ব্যর্থ হলে চালিয়ে যান */ }
            if (p % 20 === 0) {
                saveCache();
                await new Promise(r => setTimeout(r, 0));
            }
        }
        saveCache();
        scanRunning = false;
    }

    // পিডিএফ লোড করুন
    async function loadPdf() {
        await loadRegions();
        const candidatePaths = [
            '/tilawat/Emdadia-Hafezi-Quran.pdf',
            '/tilawat/Emdadia-Hafezi-Quran.pdf',
            '/tilawat/Emdadia-Hafezi-Quran.pdf'
        ];
        let lastError = null;
        for (const pdfUrl of candidatePaths) {
            try {
                pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdfDoc.numPages;
                await renderPage(1);
                setTimeout(backgroundScan, 1200);
                return;
            } catch (e) {
                lastError = e;
            }
        }
        console.error('পিডিএফ লোড করতে ত্রুটি:', lastError);
        canvas.textContent = 'পিডিএফ লোড করতে ত্রুটি';
    }

    // অঞ্চলগুলো বর্তমান পৃষ্ঠায় প্রয়োগ করুন
    function applyRegions(regions) {
        currentAyahList = (regions || []).map((r, i) => {
            const surah = SURAHS.find(s => s.num === r.surahNum);
            return {
                id: 'ayah-' + (r.surahNum || 0) + '-' + (r.ayahNum || 0) + (r.isLine ? '-l' + i : ''),
                surahNum: r.surahNum,
                ayahNum: r.ayahNum,
                text: r.text || '',
                surahName: surah ? surah.name : '',
                x0: r.x0, y0: r.y0, x1: r.x1, y1: r.y1,
                isLine: !!r.isLine
            };
        });
        currentRegions = currentAyahList.map(a => ({
            id: a.id, x0: a.x0, y0: a.y0, x1: a.x1, y1: a.y1, text: a.text
        }));
        selectedAyahId = null;
        clearHighlight();
        hideActionButtons();
        renderAyahBar();
    }

    // পৃষ্ঠা রেন্ডার করুন
    async function renderPage(num) {
        if (!pdfDoc) return;
        currentPage = Math.max(1, Math.min(num, totalPages));

        const page = await pdfDoc.getPage(currentPage);
        const scale = Math.min(pageDisplay.clientWidth / page.getViewport({ scale: 1 }).width, 1.5);
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        try {
            await page.render({ canvasContext: ctx, viewport }).promise;
        } catch (e) {
            console.error('পৃষ্ঠা রেন্ডার করতে ত্রুটি:', e);
        }

        let regions = await ensureRegions(currentPage, page);

        // টেক্সট লেয়ার নেই (স্ক্যান করা পৃষ্ঠা) → পিক্সেল বিশ্লেষণে লাইন শনাক্ত করুন
        if (!regions || !regions.length) {
            const c = ctxForPage(currentPage);
            let a = c.ayahNum;
            regions = detectLinesFromCanvas().map(r => {
                a += 1;
                return { surahNum: c.surahNum, ayahNum: a, text: '', isLine: true, ...r };
            });
            if (regions.length) AUTO_REGIONS[String(currentPage)] = regions;
        }

        applyRegions(regions);
        updatePageIndicator();

        // ক্লিক লিসেনার একবার যোগ করুন, সর্বদা সক্রিয় থাকবে
        if (!canvas.hasClickListener) {
            canvas.addEventListener('click', handleCanvasClick);
            canvas.hasClickListener = true;
        }
    }

    function updatePageIndicator() {
        try {
            if (pageDisplay && typeof toBengaliNumeral === 'function') {
                const el = document.getElementById('pageNumber');
                if (el) el.textContent = toBengaliNumeral(currentPage);
            }
        } catch (e) { /* ঐচ্ছিক */ }
    }

    // পুরনো নামের সঙ্গে সামঞ্জস্য
    function buildAyahListForPage(pageNum) {
        const regions = ALL_REGIONS[String(pageNum)] || AUTO_REGIONS[String(pageNum)] || [];
        return regions;
    }

    // ক্যানভাস ক্লিক হ্যান্ডলার
    function handleCanvasClick(e) {
        if (!selectionModeEnabled) {
            return;
        }

        const rect = canvas.getBoundingClientRect();
        const xFrac = (e.clientX - rect.left) / rect.width;
        const yFrac = (e.clientY - rect.top) / rect.height;

        let hit = currentRegions.find(r =>
            xFrac >= r.x0 && xFrac < r.x1 &&
            yFrac >= r.y0 && yFrac < r.y1
        );

        // ঠিক ভেতরে না পড়লে সবচেয়ে কাছের আয়াত ধরুন (আঙুলের ট্যাপ সহনশীল)
        if (!hit) {
            let best = null, bestD = Infinity;
            for (const r of currentRegions) {
                const dx = xFrac < r.x0 ? r.x0 - xFrac : (xFrac > r.x1 ? xFrac - r.x1 : 0);
                const dy = yFrac < r.y0 ? r.y0 - yFrac : (yFrac > r.y1 ? yFrac - r.y1 : 0);
                const d = Math.hypot(dx, dy);
                if (d < bestD) { bestD = d; best = r; }
            }
            if (best && bestD < 0.02) hit = best;
        }

        if (hit) {
            if (hit.id === selectedAyahId) deselectAyah();
            else selectAyah(hit.id);
        } else {
            deselectAyah();
        }
    }

    // আয়াত নির্বাচন করুন (একই আয়াতের সব অংশ একসাথে হাইলাইট হবে)
    function selectAyah(id) {
        const ayah = currentAyahList.find(a => a.id === id);
        const regions = currentRegions.filter(r => r.id === id);
        if (!ayah || !regions.length) return;

        selectedAyahId = id;
        lastHit = { surahNum: ayah.surahNum, ayahNum: ayah.ayahNum };

        showHighlight(regions);
        const lowest = regions.reduce((m, r) => (r.y1 > m.y1 ? r : m), regions[0]);
        showActionButtons(lowest);
        renderAyahBar();
    }

    // নির্বাচন বাতিল করুন
    function deselectAyah() {
        if (!selectedAyahId) return;
        selectedAyahId = null;
        clearHighlight();
        hideActionButtons();
        renderAyahBar();
    }

    // নির্বাচিত আয়াতের উপর সবুজ হাইলাইট বসান
    function showHighlight(regions) {
        clearHighlight();
        const list = Array.isArray(regions) ? regions : [regions];
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        list.forEach(region => {
            const div = document.createElement('div');
            div.className = 'ayah-highlight current-highlight';
            div.style.left = (region.x0 * w) + 'px';
            div.style.top = (region.y0 * h) + 'px';
            div.style.width = ((region.x1 - region.x0) * w) + 'px';
            div.style.height = ((region.y1 - region.y0) * h) + 'px';
            pageWrap.appendChild(div);
        });
    }

    // হাইলাইট মুছে ফেলুন
    function clearHighlight() {
        document.querySelectorAll('.current-highlight').forEach(el => el.remove());
        const legacy = document.getElementById('currentHighlight');
        if (legacy) legacy.remove();
    }

    // অ্যাকশন বোতাম দেখান — হাইলাইট করা আয়াতের ঠিক নিচে বসবে
    function showActionButtons(region) {
        if (region) {
            const h = canvas.offsetHeight;
            actionButtonsBar.style.top = (region.y1 * h + 4) + 'px';
        }
        actionButtonsBar.classList.add('active');
    }

    // অ্যাকশন বোতাম লুকান
    function hideActionButtons() {
        actionButtonsBar.classList.remove('active');
    }

    // আয়াত বার রেন্ডার করুন
    function renderAyahBar() {
        if (!selectedAyahId) {
            if (currentAyahList.length === 0) {
                ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999; direction:ltr; font-family:\'Kalpurush\',\'Hind Siliguri\',sans-serif; font-size:13px;">এই পৃষ্ঠায় আয়াত শনাক্ত করা যায়নি।</div>';
            } else {
                ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াতের উপর ট্যাপ করুন</div>';
            }
            return;
        }

        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (!ayah) return;

        const meta = `سورة ${ayah.surahName} • آية ${ayah.ayahNum}`;
        const body = ayah.text
            ? escapeHtml(ayah.text)
            : `<span style="font-family:'Kalpurush','Hind Siliguri',sans-serif; direction:ltr; display:inline-block; color:#777;">নির্বাচিত অংশ — সূরা ${escapeHtml(ayah.surahName)}, আয়াত ${toBengaliNumeral(ayah.ayahNum)}</span>`;
        ayahBar.innerHTML = `
            <div class="ayah-item selected" data-id="${escapeHtml(ayah.id)}">
                <div>${body}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:rtl; font-family:serif;">${meta}</div>
            </div>
        `;
    }

    // HTML এস্কেপ
    function escapeHtml(str) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)] || digit).join('');
    }

    // অ্যাকশন বোতাম ইভেন্ট
    document.getElementById('playBtn').addEventListener('click', async () => {
        if (!lastHit) {
            alert('দয়া করে প্রথমে একটি আয়াত নির্বাচন করুন।');
            return;
        }
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah) {
            // পূর্ণ সূরার অডিও ডাউনলোড শুধু সূরা নম্বরের উপর নির্ভর করে (আয়াত নম্বর নয়),
            // তাই লাইন-শনাক্তকরণ (isLine) নির্ভুল না হলেও ডাউনলোড স্বাভাবিকভাবে কাজ করবে।
            try {
                await playAyah(ayah.surahNum, ayah.ayahNum);
            } catch (error) {
                console.error('আয়াত চালাতে ত্রুটি:', error);
            }
        }
    });

    document.getElementById('tafsirBtn').addEventListener('click', () => {
        alert('তাফসীর/অনুবাদ ফিচার শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({
                title: 'কুরআন শরীফ',
                text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} শেয়ার করুন`
            }).catch(() => {});
        } else {
            alert('শেয়ার করার ফিচার এই ব্রাউজারে সমর্থিত নয়।');
        }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah) {
            navigator.clipboard.writeText(ayah.text).then(() => {
                alert('আয়াত অনুলিপি করা হয়েছে।');
            });
        }
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.classList.toggle('active');
        alert('পৃষ্ঠা বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('expandBtn').addEventListener('click', () => {
        alert('ফুলস্ক্রিন মোড শীঘ্রই আসছে।');
    });

    // আয়াত নির্বাচন মোড টগল
    const selectionModeBtn = document.getElementById('selectionModeBtn');
    if (selectionModeBtn) {
        selectionModeBtn.addEventListener('click', () => {
            selectionModeEnabled = !selectionModeEnabled;
            selectionModeBtn.classList.toggle('active');
            if (selectionModeEnabled) {
                alert('আয়াত নির্বাচন সক্রিয় করা হয়েছে।');
            } else {
                alert('আয়াত নির্বাচন নিষ্ক্রিয় করা হয়েছে।');
            }
        });
    }

    // অন্যান্য বোতাম
    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    document.getElementById('homeBtn').addEventListener('click', () => {
        alert('হোম পৃষ্ঠা শীঘ্রই আসছে।');
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
        alert('মেনু শীঘ্রই আসছে।');
    });

    // স্পর্শ সোয়াইপ
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

    // ===== CUSTOM TOOLBAR EVENTS =====
    document.querySelectorAll('.toolbar-play-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('অডিও বাচন শীঘ্রই উপলব্ধ হবে।');
        });
    });

    document.querySelectorAll('.toolbar-dropdown').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('ড্রপডাউন মেনু শীঘ্রই আসছে।');
        });
    });

    // ===== IMAGE MODAL FUNCTIONALITY =====
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeImageModal = document.getElementById('closeImageModal');

    // ইমেজ মডাল খোলার ফাংশন
    function openImageModal() {
        modalImage.src = 'image.png';
        imageModal.classList.add('active');
    }

    // ইমেজ মডাল বন্ধ করার ফাংশন
    function closeModal() {
        imageModal.classList.remove('active');
    }

    // মডাল ক্লোজ বোতাম ক্লিক ইভেন্ট
    closeImageModal.addEventListener('click', closeModal);

    // মডাল পটভূমি ক্লিক করলে বন্ধ হবে
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) {
            closeModal();
        }
    });

    // ESC কী দিয়ে মডাল বন্ধ করা যাবে
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && imageModal.classList.contains('active')) {
            closeModal();
        }
    });

    // অন্যান্য toolbar বোতাম ইভেন্ট
    const toolbarIconBtns = document.querySelectorAll('.toolbar-icon-btn:not(#selectionModeBtn)');
    if (toolbarIconBtns.length >= 3) {
        // প্রথম বোতাম - সূরা নির্বাচন
        toolbarIconBtns[0].addEventListener('click', () => {
            openSurahModal();
        });

        // দ্বিতীয় বোতাম - বুকমার্ক
        toolbarIconBtns[1].addEventListener('click', () => {
            const btn = toolbarIconBtns[1];
            btn.classList.toggle('active');
            alert('পৃষ্ঠা বুকমার্ক করা হয়েছে।');
        });

        // তৃতীয় বোতাম - ইমেজ দেখান (সূরা তালিকা)
        toolbarIconBtns[2].addEventListener('click', () => {
            openImageModal();
        });
    }

    // শুরু করুন
    loadPdf();
</script>

</body>
</html>
