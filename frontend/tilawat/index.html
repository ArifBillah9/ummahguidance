<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Kalpurush','Hind Siliguri','Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .page-wrap{
        position:relative;
        display:inline-block;
        max-width:100%;
        max-height:100%;
    }

    .ayah-highlight{
        position:absolute;
        pointer-events:none;
        background:rgba(139,195,74,.4);
        border-radius:3px;
        transition:opacity .2s;
        z-index:5;
    }

    .region-note{
        position:absolute;
        left:0; right:0; bottom:0;
        background:rgba(23,90,69,.85);
        color:#fff;
        font-size:11px;
        text-align:center;
        padding:3px 6px;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== ACTION BUTTONS BAR ===== */
    .action-buttons-bar{
        position:absolute;
        left:0;
        right:0;
        background:rgba(15,69,52,.95);
        display:none;
        flex-direction:row;
        align-items:center;
        justify-content:space-evenly;
        padding:9px 8px;
        gap:2px;
        z-index:40;
        box-shadow:0 3px 12px rgba(0,0,0,.28);
    }

    .action-buttons-bar.active{
        display:flex;
    }

    .action-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1.5px solid rgba(255,255,255,.55);
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-shrink:0;
        transition:background .2s, transform .12s;
        padding:0;
        position:relative;
    }

    .action-btn:hover{
        background:rgba(255,255,255,.12);
    }

    .action-btn:active{
        transform:scale(.9);
        background:rgba(255,255,255,.2);
    }

    .action-btn svg{
        width:17px;
        height:17px;
        stroke-width:1.6;
    }

    .action-btn.active{
        background:rgba(255,255,255,.25);
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
        display:none;
    }

    .ayah-selection-bar.active{
        display:block;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
        box-shadow: inset 0 0 8px rgba(23,90,69,0.15);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.15) 0%, rgba(23,90,69,.08) 100%);
        font-weight:600;
        border-left: 4px solid var(--brand);
    }

    .ayah-item.now-playing {
        animation: pulse-ayah 1.5s ease-in-out infinite;
    }

    @keyframes pulse-ayah {
        0%, 100% { box-shadow: inset 0 0 8px rgba(201,151,63,0.2); }
        50% { box-shadow: inset 0 0 12px rgba(201,151,63,0.4); }
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        background:rgba(255,255,255,.15);
        border:none;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.25);
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        text-align:center;
        font-size:13px;
        flex-shrink:0;
    }

    /* ===== NIGHT MODE ===== */
    body.night{
        background:#1a1a1a;
    }

    body.night #app{
        background:#2a2a2a;
    }

    body.night header{
        background:linear-gradient(180deg,#0a3a2a,#051c15);
    }

    body.night .page-display{
        background:#3a3a3a;
    }

    body.night .page-controls{
        background:linear-gradient(180deg,#0a3a2a,#051c15);
    }

    body.night .ayah-selection-bar{
        background:#2a2a2a;
        border-top-color:#444;
    }

    body.night .ayah-item{
        color:#e0e0e0;
    }

    body.night .page-info{
        color:#e0e0e0;
    }

    /* ===== IMAGE MODAL ===== */
    .image-modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,.7);
        z-index:100;
        align-items:center;
        justify-content:center;
    }

    .image-modal.active{
        display:flex;
    }

    .modal-content{
        background:#fff;
        border-radius:8px;
        max-width:90%;
        max-height:80%;
        overflow:auto;
        position:relative;
    }

    .modal-close{
        position:absolute;
        top:10px;
        right:10px;
        background:#fff;
        border:none;
        width:30px;
        height:30px;
        border-radius:50%;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .modal-image{
        display:block;
        max-width:100%;
        height:auto;
    }

    @media (max-width: 600px) {
        .modal-content{
            max-width:95%;
            max-height:90%;
        }
    }
</style>
</head>
<body>

<div id="app">
    <header>
        <div class="left">
            <h1>তিলাওয়াত</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="searchBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <div class="page-wrap" id="pageWrap">
                <canvas id="pdfCanvas"></canvas>
            </div>
            <div class="action-buttons-bar" id="actionButtonsBar">
                <button class="action-btn" id="playBtn" title="বাচন শুনুন">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="action-btn" id="copyBtn" title="অনুলিপি">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                </button>
                <button class="action-btn" id="shareBtn" title="শেয়ার">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <button class="action-btn" id="tafsirBtn" title="তাফসীর">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </button>
                <button class="action-btn" id="bookmarkBtn" title="বুকমার্ক">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="ayah-selection-bar" id="ayahBar"></div>
    </div>

    <div class="page-controls">
        <button class="nav-btn" id="prevBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <div class="page-info">
            পৃষ্ঠা <span id="pageNum">১</span> / <span id="totalPages">604</span>
        </div>
        <button class="nav-btn" id="nextBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"></path>
            </svg>
        </button>
    </div>
</div>

<div class="image-modal" id="imageModal">
    <div class="modal-content">
        <button class="modal-close" id="closeImageModal">✕</button>
        <img class="modal-image" id="modalImage" alt="Modal Content">
    </div>
</div>

<script>
    // ===== PDF পরিচালনা =====
    const pdfjsLib = window.pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentAyahList = [];
    let selectedAyahId = null;
    let lastHit = null;
    let selectionModeEnabled = false;

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const pageDisplay = document.getElementById('pageDisplay');
    const pageWrap = document.getElementById('pageWrap');
    const pageNum = document.getElementById('pageNum');
    const totalPagesSpan = document.getElementById('totalPages');
    const ayahBar = document.getElementById('ayahBar');
    const actionButtonsBar = document.getElementById('actionButtonsBar');

    // ===== PDF লোড করুন =====
    async function loadPdf() {
        try {
            const pdfUrl = 'quran.pdf';
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            totalPagesSpan.textContent = totalPages;
            renderPage(currentPage);
        } catch (error) {
            console.error('PDF লোড করা ব্যর্থ:', error);
            pageDisplay.innerHTML = '<div style="color:#999; text-align:center;">PDF লোড করা যায়নি। অনুগ্রহ করে পৃষ্ঠা রিফ্রেশ করুন।</div>';
        }
    }

    // ===== পৃষ্ঠা রেন্ডার করুন =====
    async function renderPage(pageNumber) {
        try {
            const page = await pdfDoc.getPage(pageNumber);
            const viewport = page.getViewport({ scale: 2 });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
            
            currentPage = pageNumber;
            pageNum.textContent = toBengaliNumeral(currentPage);
            
            clearHighlight();
            renderAyahBar();
            
            // ডেমো: তথ্য লোড করুন
            loadDemoAyahs();
        } catch (error) {
            console.error('পৃষ্ঠা রেন্ডার করা ব্যর্থ:', error);
        }
    }

    // ===== ডেমো আয়াত লোড করুন (সাধারণত regions.json থেকে আসবে) =====
    function loadDemoAyahs() {
        currentAyahList = [
            { id: '1:1', surahNum: 1, ayahNum: 1, surahName: 'ফাতিহা', text: 'الحمد لله رب العالمين', isLine: false },
            { id: '1:2', surahNum: 1, ayahNum: 2, surahName: 'ফাতিহা', text: 'الرحمن الرحيم', isLine: false }
        ];
        selectedAyahId = null;
    }

    // ===== হাইলাইট করুন =====
    function highlightAyah(regions) {
        if (!regions || regions.length === 0) return;
        
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        
        regions.forEach(region => {
            const div = document.createElement('div');
            div.className = 'ayah-highlight current-highlight';
            div.style.left = (region.x0 * w) + 'px';
            div.style.top = (region.y0 * h) + 'px';
            div.style.width = ((region.x1 - region.x0) * w) + 'px';
            div.style.height = ((region.y1 - region.y0) * h) + 'px';
            pageWrap.appendChild(div);
        });
    }

    // ===== হাইলাইট মুছে ফেলুন =====
    function clearHighlight() {
        document.querySelectorAll('.current-highlight').forEach(el => el.remove());
    }

    // ===== অ্যাকশন বোতাম দেখান =====
    function showActionButtons(region) {
        if (region) {
            const h = canvas.offsetHeight;
            actionButtonsBar.style.top = (region.y1 * h + 4) + 'px';
        }
        actionButtonsBar.classList.add('active');
    }

    // ===== অ্যাকশন বোতাম লুকান =====
    function hideActionButtons() {
        actionButtonsBar.classList.remove('active');
    }

    // ===== আয়াত বার রেন্ডার করুন =====
    function renderAyahBar() {
        if (!selectedAyahId) {
            if (currentAyahList.length === 0) {
                ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999; direction:ltr; font-family:\'Kalpurush\',\'Hind Siliguri\',sans-serif; font-size:13px;">এই পৃষ্ঠায় আয়াত শনাক্ত করা যায়নি।</div>';
            } else {
                ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াতের উপর ট্যাপ করুন</div>';
            }
            return;
        }

        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (!ayah) return;

        const meta = `سورة ${ayah.surahName} • آية ${ayah.ayahNum}`;
        const body = ayah.text
            ? escapeHtml(ayah.text)
            : `<span style="font-family:'Kalpurush','Hind Siliguri',sans-serif; direction:ltr; display:inline-block; color:#777;">নির্বাচিত অংশ — সূরা ${escapeHtml(ayah.surahName)}, আয়াত ${toBengaliNumeral(ayah.ayahNum)}</span>`;
        ayahBar.innerHTML = `
            <div class="ayah-item selected" data-id="${escapeHtml(ayah.id)}">
                <div>${body}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:rtl; font-family:serif;">${meta}</div>
            </div>
        `;
    }

    // ===== HTML এস্কেপ =====
    function escapeHtml(str) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    // ===== বাংলা সংখ্যা রূপান্তর =====
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)] || digit).join('');
    }

    // ===== অডিও বাচন চালান =====
    function playAyah(surahNum, ayahNum) {
        const url = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${surahNum}_${ayahNum}.mp3`;
        const audio = new Audio(url);
        audio.play().catch(() => {
            alert('অডিও চালানো সম্ভব হয়নি। ইন্টারনেট সংযোগ চেক করুন।');
        });
    }

    // ===== ইভেন্ট: পরবর্তী পৃষ্ঠা =====
    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
    });

    // ===== ইভেন্ট: পূর্ববর্তী পৃষ্ঠা =====
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });

    // ===== অ্যাকশন বোতাম ইভেন্ট =====
    document.getElementById('playBtn').addEventListener('click', () => {
        if (!selectedAyahId) {
            alert('দয়া করে প্রথমে একটি আয়াত নির্বাচন করুন।');
            return;
        }
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah) {
            playAyah(ayah.surahNum, ayah.ayahNum);
        }
    });

    document.getElementById('tafsirBtn').addEventListener('click', () => {
        alert('তাফসীর/অনুবাদ ফিচার শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({
                title: 'কুরআন শরীফ',
                text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} শেয়ার করুন`
            }).catch(() => {});
        } else {
            alert('শেয়ার করার ফিচার এই ব্রাউজারে সমর্থিত নয়।');
        }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah) {
            navigator.clipboard.writeText(ayah.text).then(() => {
                alert('আয়াত অনুলিপি করা হয়েছে।');
            });
        }
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.classList.toggle('active');
        alert('পৃষ্ঠা বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    // ===== ইমেজ মডাল =====
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeImageModal = document.getElementById('closeImageModal');

    function closeModal() {
        imageModal.classList.remove('active');
    }

    closeImageModal.addEventListener('click', closeModal);
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && imageModal.classList.contains('active')) {
            closeModal();
        }
    });

    // ===== স্পর্শ সোয়াইপ =====
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

    // ===== শুরু করুন =====
    loadPdf();
</script>

</body>
</html>
