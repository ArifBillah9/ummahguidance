<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .page-wrap{
        position:relative;
        display:inline-block;
        max-width:100%;
        max-height:100%;
    }

    .ayah-highlight{
        position:absolute;
        pointer-events:none;
        background:rgba(201,151,63,.28);
        border:1px solid rgba(23,90,69,.45);
        border-radius:4px;
        transition:opacity .2s;
    }

    .region-note{
        position:absolute;
        left:0; right:0; bottom:0;
        background:rgba(23,90,69,.85);
        color:#fff;
        font-size:11px;
        text-align:center;
        padding:3px 6px;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== ACTION BUTTONS BAR ===== */
    .action-buttons-bar{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        border-bottom:1px solid var(--line);
        display:none;
        flex-shrink:0;
        padding:8px 0;
        flex-direction:row;
        align-items:center;
        justify-content:center;
        gap:0;
        z-index:25;
    }

    .action-buttons-bar.active{
        display:flex;
    }

    .action-btn{
        width:50px;
        height:50px;
        border:none;
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        gap:2px;
        font-size:10px;
        transition:background .2s;
        flex-shrink:0;
        position:relative;
    }

    .action-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .action-btn svg{
        width:22px;
        height:22px;
        stroke-width:1.5;
    }

    .action-btn.active{
        background:rgba(255,255,255,.2);
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
        display:none;
    }

    .ayah-selection-bar.active{
        display:block;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.08) 0%, transparent 100%);
        font-weight:600;
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1px solid rgba(255,255,255,.3);
        background:transparent;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .nav-btn:disabled{
        opacity:0.5;
        cursor:not-allowed;
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        font-size:13px;
        min-width:60px;
        text-align:center;
    }

    /* ===== CUSTOM TOOLBAR ===== */
    .custom-toolbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:8px 12px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:8px;
    }

    .toolbar-left{
        display:flex;
        align-items:center;
        gap:8px;
    }

    .toolbar-play-btn{
        width:36px;
        height:36px;
        border-radius:4px;
        background:transparent;
        border:1px solid rgba(255,255,255,.3);
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .toolbar-play-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .toolbar-play-btn svg{
        width:18px;
        height:18px;
    }

    .toolbar-title{
        font-size:14px;
        font-weight:500;
        direction:rtl;
        display:flex;
        flex-direction:column;
        gap:2px;
    }

    .toolbar-dropdown{
        background:transparent;
        border:none;
        color:#fff;
        cursor:pointer;
        display:flex;
        align-items:center;
        gap:4px;
        font-size:12px;
        padding:4px 6px;
        transition:background .2s;
    }

    .toolbar-dropdown:hover{
        background:rgba(255,255,255,.1);
        border-radius:4px;
    }

    .toolbar-dropdown svg{
        width:14px;
        height:14px;
    }

    .toolbar-right{
        display:flex;
        align-items:center;
        gap:4px;
    }

    .toolbar-icon-btn{
        width:32px;
        height:32px;
        border-radius:4px;
        background:transparent;
        border:none;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .toolbar-icon-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .toolbar-icon-btn svg{
        width:18px;
        height:18px;
        stroke-width:1.5;
    }

    /* Night mode */
    body.night{
        background:#1b1b1b;
    }

    body.night #app{
        background:#2d2d2d;
        color:#e0e0e0;
    }

    body.night .page-display{
        background:#1a1a1a;
    }

    body.night .ayah-item{
        color:#e0e0e0;
    }

    body.night .ayah-selection-bar{
        background:#2d2d2d;
        border-top-color:#444;
    }

    body.night .ayah-item.selected{
        background:rgba(23,90,69,.15);
        color:#6be59d;
    }
</style>
</head>
<body>

<div id="app">
    <!-- HEADER -->
    <header>
        <div class="left">
            <button class="icon-btn" id="homeBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <h1>কুরআন</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="moonBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="searchBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="menuBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <canvas id="pdfCanvas"></canvas>
        </div>

        <!-- ACTION BUTTONS BAR (শুধু আয়াত সিলেক্ট হলে দেখাবে) -->
        <div class="action-buttons-bar" id="actionButtonsBar">
            <button class="action-btn" id="playBtn" title="অডিও চালান">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span>বাচন</span>
            </button>
            <button class="action-btn" id="docBtn" title="নথি">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
                </svg>
                <span>নথি</span>
            </button>
            <button class="action-btn" id="shareBtn" title="শেয়ার করুন">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                <span>শেয়ার</span>
            </button>
            <button class="action-btn" id="copyBtn" title="অনুলিপি করুন">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
                <span>অনুলিপি</span>
            </button>
            <button class="action-btn" id="bookmarkBtn" title="বুকমার্ক করুন">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
                <span>বুকমার্ক</span>
            </button>
            <button class="action-btn" id="closeSelectionBtn" title="বন্ধ করুন">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
                <span>বন্ধ</span>
            </button>
        </div>

        <!-- AYAH SELECTION BAR (হিডেন থাকবে) -->
        <div class="ayah-selection-bar" id="ayahBar"></div>
    </div>

    <!-- Custom Toolbar -->
    <div class="custom-toolbar">
        <div class="toolbar-left">
            <button class="toolbar-play-btn" title="প্লে">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21"/>
                </svg>
            </button>
            <div class="toolbar-title">
                <span style="font-size:12px; opacity:0.9;">মুসাইকিন</span>
                <span style="font-size:11px; opacity:0.8;">কুরআন</span>
            </div>
            <button class="toolbar-dropdown">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-right">
            <button class="toolbar-icon-btn" id="selectionModeBtn" title="আয়াত নির্বাচন">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 3l7 7M3 3h6v6M21 3l-7 7M21 3h-6v6M3 21l7-7M3 21v-6h6M21 21l-7-7M21 21v-6h-6"/>
                </svg>
            </button>
            <button class="toolbar-icon-btn" title="সুরক্ষা">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </button>
            <button class="toolbar-icon-btn" title="বুকমার্ক">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
            </button>
            <button class="toolbar-icon-btn" title="শেয়ার">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    // ডিএস এবং রেফারেন্সেস
    const pageDisplay = document.getElementById('pageDisplay');
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const ayahBar = document.getElementById('ayahBar');
    const actionButtonsBar = document.getElementById('actionButtonsBar');

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentAyahList = [];
    let currentRegions = [];
    let selectedAyahId = null;
    let lastHit = null;
    let selectionModeEnabled = true;

    // পিডিএফ লোড করুন
    async function loadPdf() {
        try {
            // উদাহরণ Quran পিডিএফ URL
            const pdfUrl = 'https://data.qurancdn.com/asanfuqaha/Tanzil_ver_1_0.pdf';
            
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            renderPage(1);
        } catch (e) {
            console.error('পিডিএফ লোড করতে ত্রুটি:', e);
            canvas.textContent = 'পিডিএফ লোড করতে ত্রুটি';
        }
    }

    // পৃষ্ঠা রেন্ডার করুন
    async function renderPage(num) {
        if (!pdfDoc) return;
        currentPage = Math.max(1, Math.min(num, totalPages));

        const page = await pdfDoc.getPage(currentPage);
        const scale = Math.min(pageDisplay.clientWidth / page.getViewport({ scale: 1 }).width, 1.5);
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        try {
            await page.render({ canvasContext: ctx, viewport }).promise;
        } catch (e) {
            console.error('পৃষ্ঠা রেন্ডার করতে ত্রুটি:', e);
        }

        // নমুনা আয়াত ডেটা তৈরি করুন
        currentAyahList = generateSampleAyahs();
        currentRegions = currentAyahList.map(a => ({
            id: a.id,
            x0: Math.random() * 0.5,
            y0: Math.random() * 0.8,
            x1: Math.random() * 0.5 + 0.5,
            y1: Math.random() * 0.8 + 0.05,
            text: a.text
        }));

        selectedAyahId = null;
        hideActionButtons();
        renderAyahBar();

        // ক্লিক ইভেন্ট যুক্ত করুন
        canvas.addEventListener('click', handleCanvasClick, { once: true });
    }

    // নমুনা আয়াত ডেটা তৈরি করুন
    function generateSampleAyahs() {
        const ayahs = [
            { surahNum: 1, ayahNum: 1, text: 'بسم الله الرحمن الرحيم' },
            { surahNum: 1, ayahNum: 2, text: 'الحمد لله رب العالمين' },
            { surahNum: 1, ayahNum: 3, text: 'الرحمن الرحيم' },
            { surahNum: 1, ayahNum: 4, text: 'مالك يوم الدين' },
            { surahNum: 2, ayahNum: 1, text: 'الم' }
        ];
        return ayahs.map((a, i) => ({
            id: 'ayah-' + currentPage + '-' + i,
            surahNum: a.surahNum,
            ayahNum: a.ayahNum,
            text: a.text,
            surahName: 'السورة',
            isLine: false
        }));
    }

    // ক্যানভাস ক্লিক হ্যান্ডলার
    function handleCanvasClick(e) {
        if (!selectionModeEnabled) {
            canvas.addEventListener('click', handleCanvasClick, { once: true });
            return;
        }

        const rect = canvas.getBoundingClientRect();
        const xFrac = (e.clientX - rect.left) / rect.width;
        const yFrac = (e.clientY - rect.top) / rect.height;

        const hit = currentRegions.find(r => 
            xFrac >= r.x0 && xFrac < r.x1 && 
            yFrac >= r.y0 && yFrac < r.y1
        );

        if (hit) {
            selectAyah(hit.id);
        }
        
        canvas.addEventListener('click', handleCanvasClick, { once: true });
    }

    // আয়াত নির্বাচন করুন
    function selectAyah(id) {
        const ayah = currentAyahList.find(a => a.id === id);
        if (!ayah) return;

        selectedAyahId = id;
        lastHit = { surahNum: ayah.surahNum, ayahNum: ayah.ayahNum };
        
        showActionButtons();
        renderAyahBar();
    }

    // অ্যাকশন বোতাম দেখান
    function showActionButtons() {
        actionButtonsBar.classList.add('active');
    }

    // অ্যাকশন বোতাম লুকান
    function hideActionButtons() {
        actionButtonsBar.classList.remove('active');
    }

    // আয়াত বার রেন্ডার করুন
    function renderAyahBar() {
        if (!selectedAyahId) {
            ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াতের উপর ট্যাপ করুন</div>';
            return;
        }

        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (!ayah) return;

        const meta = `سورة ${ayah.surahName} • آية ${ayah.ayahNum}`;
        ayahBar.innerHTML = `
            <div class="ayah-item selected" data-id="${escapeHtml(ayah.id)}">
                <div>${escapeHtml(ayah.text)}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:rtl; font-family:serif;">${meta}</div>
            </div>
        `;
    }

    // HTML এস্কেপ
    function escapeHtml(str) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)] || digit).join('');
    }

    // অ্যাকশন বোতাম ইভেন্ট
    document.getElementById('playBtn').addEventListener('click', () => {
        alert('অডিও বাচন শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('docBtn').addEventListener('click', () => {
        alert('নথি ফিচার শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({
                title: 'কুরআন শরীফ',
                text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} শেয়ার করুন`
            }).catch(() => {});
        } else {
            alert('শেয়ার করার ফিচার এই ব্রাউজারে সমর্থিত নয়।');
        }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const ayah = currentAyahList.find(a => a.id === selectedAyahId);
        if (ayah) {
            navigator.clipboard.writeText(ayah.text).then(() => {
                alert('আয়াত অনুলিপি করা হয়েছে।');
            });
        }
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.classList.toggle('active');
        alert('পৃষ্ঠা বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('closeSelectionBtn').addEventListener('click', () => {
        selectedAyahId = null;
        hideActionButtons();
        renderAyahBar();
    });

    // আয়াত নির্বাচন মোড টগল
    const selectionModeBtn = document.getElementById('selectionModeBtn');
    if (selectionModeBtn) {
        selectionModeBtn.addEventListener('click', () => {
            selectionModeEnabled = !selectionModeEnabled;
            selectionModeBtn.classList.toggle('active');
            if (selectionModeEnabled) {
                alert('আয়াত নির্বাচন সক্রিয় করা হয়েছে।');
            } else {
                alert('আয়াত নির্বাচন নিষ্ক্রিয় করা হয়েছে।');
            }
        });
    }

    // অন্যান্য বোতাম
    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    document.getElementById('homeBtn').addEventListener('click', () => {
        alert('হোম পৃষ্ঠা শীঘ্রই আসছে।');
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
        alert('মেনু শীঘ্রই আসছে।');
    });

    // স্পর্শ সোয়াইপ
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

    // ===== CUSTOM TOOLBAR EVENTS =====
    document.querySelectorAll('.toolbar-play-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('অডিও বাচন শীঘ্রই উপলব্ধ হবে।');
        });
    });

    document.querySelectorAll('.toolbar-dropdown').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('ড্রপডাউন মেনু শীঘ্রই আসছে।');
        });
    });

    // অন্যান্য toolbar বোতাম ইভেন্ট
    const toolbarIconBtns = document.querySelectorAll('.toolbar-icon-btn:not(#selectionModeBtn)');
    if (toolbarIconBtns.length >= 3) {
        toolbarIconBtns[0].addEventListener('click', () => {
            alert('সুরক্ষা সেটিংস শীঘ্রই আসছে।');
        });

        toolbarIconBtns[1].addEventListener('click', () => {
            const btn = toolbarIconBtns[1];
            btn.classList.toggle('active');
            alert('পৃষ্ঠা বুকমার্ক করা হয়েছে।');
        });

        toolbarIconBtns[2].addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'কুরআন শরীফ',
                    text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} শেয়ার করুন`
                }).catch(() => {});
            } else {
                alert('শেয়ার করার ফিচার এই ব্রাউজারে সমর্থিত নয়।');
            }
        });
    }

    // শুরু করুন
    loadPdf();
</script>

</body>
</html>
