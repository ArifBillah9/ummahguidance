<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.08) 0%, transparent 100%);
        font-weight:600;
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1px solid rgba(255,255,255,.3);
        background:transparent;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .nav-btn:disabled{
        opacity:.4;
        cursor:default;
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        flex:1;
        text-align:center;
        font-size:13px;
    }

    /* ===== ACTION TOOLBAR ===== */
    .action-toolbar{
        display:flex;
        justify-content:space-around;
        align-items:center;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        padding:8px 0;
        flex-shrink:0;
        gap:0;
    }

    .toolbar-btn{
        flex:1;
        height:44px;
        border:none;
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:2px;
        font-size:11px;
        transition:background .2s;
    }

    .toolbar-btn:active{
        background:rgba(0,0,0,.1);
    }

    .toolbar-btn svg{
        width:20px;
        height:20px;
    }

    /* ===== MODAL/OVERLAY ===== */
    .modal{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.5);
        display:none;
        z-index:100;
        align-items:center;
        justify-content:center;
    }

    .modal.show{
        display:flex;
    }

    .modal-content{
        background:#fff;
        border-radius:12px;
        padding:20px;
        max-width:90%;
        max-height:80vh;
        overflow-y:auto;
    }

    /* ===== LOADING ===== */
    .loading{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        color:#8a8370;
    }

    .spinner{
        width:20px;
        height:20px;
        border:2px solid var(--line);
        border-top-color:var(--brand);
        border-radius:50%;
        animation:spin .6s linear infinite;
    }

    @keyframes spin{
        to{transform:rotate(360deg)}
    }

</style>
</head>
<body>
<div id="app">
    <!-- HEADER -->
    <header>
        <div class="left">
            <button class="icon-btn" id="homeBtn" title="হোম">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <h1>কুরআন শরীফ</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="moonBtn" title="রাত মোড">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="searchBtn" title="সার্চ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="menuBtn" title="মেনু">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <div class="loading">
                <div class="spinner"></div>
                <span>পাতা লোড হচ্ছে...</span>
            </div>
        </div>
    </div>

    <!-- AYAH SELECTION BAR -->
    <div class="ayah-selection-bar" id="ayahBar">
        <div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>
    </div>

    <!-- PAGE CONTROLS -->
    <div class="page-controls">
        <button class="nav-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="page-info">
            <span id="pageNum">১</span> / <span id="totalPages">১</span>
        </div>
        <button class="nav-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </button>
    </div>

    <!-- ACTION TOOLBAR -->
    <div class="action-toolbar">
        <button class="toolbar-btn" id="playBtn" title="পড়ুন">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>পড়ুন</span>
        </button>
        <button class="toolbar-btn" id="bookmarkBtn" title="বুকমার্ক">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            <span>বুকমার্ক</span>
        </button>
        <button class="toolbar-btn" id="shareBtn" title="শেয়ার">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span>শেয়ার</span>
        </button>
        <button class="toolbar-btn" id="tafsirBtn" title="তাফসীর">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>তাফসীর</span>
        </button>
        <button class="toolbar-btn" id="moreBtn" title="আরও">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
            </svg>
            <span>আরও</span>
        </button>
    </div>
</div>

<audio id="audio"></audio>

<script>
    // PDF.js সেটআপ
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let selectedMushaf = 'emdadia';
    const pdfUrls = {
        emdadia: '/tilawat/Emdadia-Hafezi-Quran.pdf' // একই ডিরেক্টরিতে PDF ফাইল রাখুন
    };

    const pageDisplay = document.getElementById('pageDisplay');
    const ayahBar = document.getElementById('ayahBar');
    const pageNum = document.getElementById('pageNum');
    const totalPagesSpan = document.getElementById('totalPages');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // পিডিএফ লোড করুন
    async function loadPdf() {
        try {
            const pdfUrl = pdfUrls[selectedMushaf];
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            totalPagesSpan.textContent = toBengaliNumeral(totalPages);
            
            // সংরক্ষিত পৃষ্ঠা লোড করুন
            const savedPage = localStorage.getItem('currentPage_' + selectedMushaf);
            currentPage = savedPage ? parseInt(savedPage) : 1;
            
            await renderPage(currentPage);
        } catch (error) {
            console.error('PDF লোড করা যায়নি:', error);
            pageDisplay.innerHTML = '<div class="loading"><span>পিডিএফ লোড করা যায়নি।</span></div>';
        }
    }

    // পৃষ্ঠা রেন্ডার করুন
    async function renderPage(pageNumber) {
        if (!pdfDoc) return;
        
        try {
            const page = await pdfDoc.getPage(pageNumber);
            const scale = 1.5;
            const viewport = page.getViewport({ scale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport }).promise;
            
            // ক্যানভাস প্রদর্শন করুন
            pageDisplay.innerHTML = '';
            canvas.id = 'pdfCanvas';
            pageDisplay.appendChild(canvas);
            
            // স্ক্লিক হ্যান্ডলার যোগ করুন
            setupPageClickHandlers(canvas, viewport);
            
            // পৃষ্ঠা নম্বর আপডেট করুন
            currentPage = pageNumber;
            pageNum.textContent = toBengaliNumeral(pageNumber);
            localStorage.setItem('currentPage_' + selectedMushaf, pageNumber);
            
            // নেভিগেশন বাটন অক্ষম/সক্ষম করুন
            prevBtn.disabled = pageNumber === 1;
            nextBtn.disabled = pageNumber === totalPages;
            
            // ডিফল্টে কোনো আয়াত দেখানো হবে না — ক্লিক করলে তবেই আয়াত-বার এ দেখাবে
            updateAyahBar([]);
        } catch (error) {
            console.error('পৃষ্ঠা রেন্ডার করা যায়নি:', error);
        }
    }

    // পৃষ্ঠাভিত্তিক আয়াত-অঞ্চল মানচিত্র — প্রকৃত স্ক্যান করা পিডিএফ পৃষ্ঠা পরিমাপ করে তৈরি
    // প্রতিটি অঞ্চল পৃষ্ঠার প্রস্থ/উচ্চতার ভগ্নাংশ (０ থেকে ১) হিসেবে সংজ্ঞায়িত, তাই যেকোনো স্ক্রিন সাইজে সঠিকভাবে কাজ করে
    // একই আয়াত একাধিক অঞ্চলে থাকতে পারে যদি তা একাধিক লাইনে ভাগ হয়ে থাকে
    const pageAyahRegions = {
        // পিডিএফ পৃষ্ঠা ২ = মুসহাফ পৃষ্ঠা ১ = সূরা আল-ফাতিহা (৭ আয়াত + বিসমিল্লাহ)
        2: [
            { surahNum: 1, ayahNum: 1, text: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', x0: 0,    x1: 1,    y0: 0.370, y1: 0.467 },
            { surahNum: 1, ayahNum: 2, text: 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', x0: 0,    x1: 1,    y0: 0.467, y1: 0.526 },
            { surahNum: 1, ayahNum: 3, text: 'الرَّحْمَٰنِ الرَّحِيمِ',            x0: 0.47, x1: 1,    y0: 0.526, y1: 0.585 },
            { surahNum: 1, ayahNum: 4, text: 'مَالِكِ يَوْمِ الدِّينِ',            x0: 0,    x1: 0.47, y0: 0.526, y1: 0.585 },
            { surahNum: 1, ayahNum: 4, text: 'مَالِكِ يَوْمِ الدِّينِ',            x0: 0.74, x1: 1,    y0: 0.585, y1: 0.645 },
            { surahNum: 1, ayahNum: 5, text: 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', x0: 0,    x1: 0.74, y0: 0.585, y1: 0.645 },
            { surahNum: 1, ayahNum: 5, text: 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', x0: 0.65, x1: 1,    y0: 0.645, y1: 0.704 },
            { surahNum: 1, ayahNum: 6, text: 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',      x0: 0,    x1: 0.65, y0: 0.645, y1: 0.704 },
            { surahNum: 1, ayahNum: 6, text: 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',      x0: 0.54, x1: 1,    y0: 0.704, y1: 0.764 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 0.54, y0: 0.704, y1: 0.764 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 1,    y0: 0.764, y1: 0.823 },
            { surahNum: 1, ayahNum: 7, text: 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', x0: 0, x1: 1,    y0: 0.823, y1: 0.896 }
        ],
        // পিডিএফ পৃষ্ঠা ৩ = মুসহাফ পৃষ্ঠা ২ = সূরা আল-বাকারা (আয়াত ১-৪, বিসমিল্লাহ এখানে আয়াত হিসেবে গণ্য নয়)
        3: [
            { surahNum: 2, ayahNum: 1, text: 'الٓمٓ',                                     x0: 0.78,  x1: 1, y0: 0.468, y1: 0.526 },
            { surahNum: 2, ayahNum: 2, text: 'ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ', x0: 0,     x1: 0.78, y0: 0.468, y1: 0.526 },
            { surahNum: 2, ayahNum: 2, text: 'ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ', x0: 0.463, x1: 1,    y0: 0.526, y1: 0.585 },
            { surahNum: 2, ayahNum: 3, text: 'الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ', x0: 0, x1: 0.463, y0: 0.526, y1: 0.585 },
            { surahNum: 2, ayahNum: 3, text: 'الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ', x0: 0, x1: 1, y0: 0.585, y1: 0.645 },
            { surahNum: 2, ayahNum: 3, text: 'الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ', x0: 0, x1: 1, y0: 0.645, y1: 0.705 },
            { surahNum: 2, ayahNum: 4, text: 'وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ', x0: 0, x1: 1, y0: 0.705, y1: 0.764 },
            { surahNum: 2, ayahNum: 4, text: 'وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ', x0: 0, x1: 1, y0: 0.764, y1: 0.824 },
            { surahNum: 2, ayahNum: 4, text: 'وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ', x0: 0, x1: 1, y0: 0.824, y1: 0.897 }
        ]
    };

    // পৃষ্ঠায় ক্লিক হ্যান্ডলার সেটআপ করুন (প্রকৃত পৃষ্ঠার উপর ভিত্তি করে নির্ভুল আয়াত-অঞ্চল সনাক্তকরণ)
    function setupPageClickHandlers(canvas, viewport) {
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const xFrac = (e.clientX - rect.left) / rect.width;
            const yFrac = (e.clientY - rect.top) / rect.height;

            const regions = pageAyahRegions[currentPage];
            if (!regions) {
                // এই পৃষ্ঠার জন্য এখনো নির্ভুল আয়াত-ম্যাপিং যুক্ত করা হয়নি
                return;
            }

            const hit = regions.find(r => xFrac >= r.x0 && xFrac < r.x1 && yFrac >= r.y0 && yFrac < r.y1);
            if (hit) {
                selectAyah({
                    id: `surah_${hit.surahNum}_ayah_${hit.ayahNum}`,
                    text: hit.text,
                    page: currentPage,
                    surahNum: hit.surahNum,
                    surahName: surahNames[hit.surahNum],
                    ayahNum: hit.ayahNum
                });
            }
        });
    }

    // سم سوری کے ناموں کی فہرست
    const surahNames = ['', 'الفاتحة', 'البقرة', 'آل عمران', 'النساء', 'المائدة', 'الأنعام', 'الأعراف', 'الأنفال', 'التوبة', 'يونس', 'هود', 'يوسف', 'الرعد', 'إبراهيم', 'الحجر', 'النحل', 'الإسراء', 'الكهف', 'مريم', 'طه', 'الأنبياء', 'الحج', 'المؤمنون', 'النور', 'الفرقان', 'الشعراء', 'النمل', 'القصص', 'العنكبوت', 'الروم', 'لقمان', 'السجدة', 'الأحزاب', 'سبأ', 'فاطر', 'يس', 'الصافات', 'ص', 'الزمر', 'غافر', 'فصلت', 'الشورى', 'الزخرف', 'الدخان', 'الجاثية', 'الأحقاف', 'محمد', 'الفتح', 'الحجرات', 'ق', 'الذاريات', 'الطور', 'النجم', 'القمر', 'الرحمن', 'الواقعة', 'الحديد', 'المجادلة', 'الحشر', 'الممتحنة', 'الصف', 'الجمعة', 'المنافقون', 'التغابن', 'الطلاق', 'التحريم', 'الملك', 'القلم', 'الحاقة', 'المعارج', 'نوح', 'الجن', 'المزمل', 'المدثر', 'القيامة', 'الإنسان', 'المرسلات', 'النبأ', 'النازعات', 'عبس', 'التكوير', 'الإنفطار', 'المطففين', 'الانشقاق', 'البروج', 'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'القمر', 'الرحيل', 'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 'التكاثر', 'الوقت', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'];

    // সম্পূর্ণ কুরআনের নমুনা ডেটাবেস (প্রতিটি সূরার প্রথম কয়েকটি আয়াত)
    const quranData = {};
    
    // প্রতিটি সূরার জন্য নমুনা আয়াত তৈরি করুন
    const ayahSamples = {
        1: ['بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', 'الرَّحْمَٰنِ الرَّحِيمِ', 'مَالِكِ يَوْمِ الدِّينِ', 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ', 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ'],
        2: ['الٓمٓ', 'ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ', 'الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ', 'وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ'],
        3: ['الم', 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ', 'نَزَّلَ عَلَيْكَ الْكِتَابَ بِالْحَقِّ'],
        4: ['يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم', 'وَخَلَقَ مِنْهَا زَوْجَهَا', 'وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ'],
        5: ['يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ', 'أُحِلَّتْ لَكُم بَهِيمَةُ الْأَنْعَامِ', 'غَيْرَ مُحِلِّي الصَّيْدِ'],
        6: ['الْحَمْدُ لِلَّهِ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ', 'وَالَّذِينَ كَفَرُوا بِرَبِّهِمْ يَعْدِلُونَ', 'هُوَ الَّذِي خَلَقَكُم مِّن طِينٍ'],
        7: ['الم', 'كِتَابٌ أُنزِلَ إِلَيْكَ فَلَا يَكُن فِي صَدْرِكَ حَرَجٌ', 'لِتُنذِرَ بِهِ وَذِكْرَىٰ لِلْمُؤْمِنِينَ'],
        8: ['يَسْأَلُونَكَ عَنِ الْأَنفَالِ', 'الَّذِينَ آمَنُوا وَجِلَتْ قُلُوبُهُمْ', 'إِنَّ اللَّهَ مَعَ الصَّابِرِينَ'],
        9: ['بَرَاءَةٌ مِّنَ اللَّهِ وَرَسُولِهِ', 'فَسِيحُوا فِي الْأَرْضِ أَرْبَعَةَ أَشْهُرٍ', 'وَأَذَانٌ مِّنَ اللَّهِ وَرَسُولِهِ'],
        10: ['الر تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ', 'أَكَانَ لِلنَّاسِ عَجَبًا', 'إِنَّ الَّذِينَ آمَنُوا'],
        11: ['الر كِتَابٌ أُحْكِمَتْ آيَاتُهُ ثُمَّ فُصِّلَتْ', 'مِن لَّدُنْ حَكِيمٍ خَبِيرٍ', 'أَلَّا تَعْبُدُوا إِلَّا اللَّهَ'],
        12: ['الر تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ', 'إِنَّا أَنزَلْنَاهُ قُرْآنًا عَرَبِيًّا', 'نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ الْقَصَصِ'],
        13: ['الم تِلْكَ آيَاتُ الْكِتَابِ ۗ وَالَّذِي أُنزِلَ إِلَيْكَ', 'اللَّهُ الَّذِي رَفَعَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ', 'وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ'],
        14: ['الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ', 'لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ', 'إِلَىٰ صِرَاطِ الْعَزِيزِ الْحَمِيدِ'],
        15: ['الر تِلْكَ آيَاتُ الْكِتَابِ وَقُرْآنٍ مُّبِينٍ', 'رُبَّمَا يَوَدُّ الَّذِينَ كَفَرُوا', 'فَذَرْهُمْ يَأْكُلُوا وَيَتَمَتَّعُوا'],
        16: ['بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَتَىٰ أَمْرُ اللَّهِ', 'فَلَا تَسْتَعْجِلُوهُ سُبْحَانَهُ وَتَعَالَىٰ', 'يَنزِلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا']
    };

    // ডেটাবেস জনপ্রিয় করুন - প্রতিটি সূরার জন্য নমুনা ডেটা
    function getDefaultAyahs(surahNum) {
        const defaults = [
            ['بسم الله الرحمن الرحيم', 'الحمد لله رب العالمين'],
            ['قل هو الله أحد', 'الله الصمد'],
            ['لم يلد ولم يولد', 'ولم يكن له كفوا أحد']
        ];
        return defaults[surahNum % defaults.length];
    }

    for (let i = 1; i <= 114; i++) {
        quranData[i] = {
            name: surahNames[i] || 'سورة غير معروفة',
            ayahs: ayahSamples[i] || getDefaultAyahs(i)
        };
    }

    // পৃষ্ঠা নম্বর থেকে সূরা এবং আয়াত খুঁজে পান
    // (নোট: এই ফাংশনটি বর্তমানে সরাসরি ট্যাপ-সনাক্তকরণে ব্যবহৃত হয় না —
    // তার বদলে উপরের pageAyahRegions ব্যবহার করা হয়, যা প্রকৃত পৃষ্ঠা পরিমাপ করে তৈরি।
    // এটি রাখা হয়েছে সম্ভাব্য ভবিষ্যৎ ব্যবহারের জন্য, যেমন অনুসন্ধান বা তালিকা view)

    // আয়াত নির্বাচন করুন
    function selectAyah(ayah) {
        // ক্লিক করা আয়াতটিই শুধু আয়াত-বার এ দেখান (ডিফল্টে বার খালি থাকে)
        updateAyahBar([ayah]);

        // নির্বাচিত আয়াত হাইলাইট করুন
        const selectedItem = ayahBar.querySelector(`[data-id="${CSS.escape(ayah.id)}"]`);
        if (selectedItem) {
            selectedItem.classList.add('selected');
            selectedItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    // আয়াত বার আপডেট করুন
    function updateAyahBar(ayahs) {
        if (ayahs.length === 0) {
            ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>';
            return;
        }
        
        ayahBar.innerHTML = ayahs.map(ayah => {
            const surahNameAr = quranData[ayah.surahNum] ? quranData[ayah.surahNum].name : 'سورة غير معروفة';
            return `<div class="ayah-item" data-id="${ayah.id}" onclick="selectAyah({id: '${ayah.id}', text: '${ayah.text.replace(/'/g, "\\'")}', page: ${ayah.page}, surahNum: ${ayah.surahNum}, surahName: '${ayah.surahName}', ayahNum: ${ayah.ayahNum}})">
                <div>${ayah.text}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:rtl; font-family:serif;">سورة ${surahNameAr} • آية ${ayah.ayahNum}</div>
            </div>`;
        }).join('');
    }

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)]).join('');
    }

    // নেভিগেশন
    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
    });

    // টুলবার বাটন
    document.getElementById('playBtn').addEventListener('click', () => {
        alert('অডিও বৈশিষ্ট্য শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.style.opacity = btn.style.opacity === '0.6' ? '1' : '0.6';
        alert('এই পৃষ্ঠাটি বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        const shareData = {
            title: 'কুরআন শরীফ',
            text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} দেখুন`,
            url: location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            alert('এই ব্রাউজারে শেয়ার সমর্থিত নয়।');
        }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    // শুরু করুন
    loadPdf();

    // স্পর্শ সোয়াইপ
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

</script>
