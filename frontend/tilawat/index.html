<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>তিলাওয়াত | কুরআন শরীফ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
    @font-face{   
        font-family:'Kalpurush';
        src:url('tilawat/fonts/Kalpurush.woff2') format('woff2');
        font-weight:normal;
        font-style:normal;
        font-display:swap;
    }

    :root{
        --brand:#175a45;
        --brand-dark:#0f4534;
        --brand-light:#1f6f55;
        --cream:#fdfaf3;
        --ink:#1b1b1b;
        --gold:#c9973f;
        --line:#d8d2c2;
        --radius:14px;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%;}
    
    body{
        font-family:'Noto Sans Bengali','Noto Naskh Arabic',sans-serif;
        background:#e9e5da;
        color:var(--ink);
        display:flex;
        justify-content:center;
        -webkit-tap-highlight-color:transparent;
    }

    #app{
        width:100%;
        max-width:480px;
        min-height:100vh;
        background:var(--cream);
        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:0 0 30px rgba(0,0,0,.15);
        overflow:hidden;
    }

    /* ===== HEADER ===== */
    header{
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:10px 12px;
        position:relative;
        z-index:30;
        flex-shrink:0;
        height:56px;
    }

    header .left{display:flex; align-items:center; gap:10px;}
    header h1{font-size:18px; font-weight:600;}
    header .right{display:flex; align-items:center; gap:2px;}

    .icon-btn{
        width:36px; height:36px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; color:#fff; cursor:pointer;
        flex-shrink:0;
    }

    .icon-btn svg{width:20px; height:20px;}
    .icon-btn.filled{background:#fff; color:var(--brand);}

    /* ===== MAIN CONTENT ===== */
    .content-area{
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
        position:relative;
    }

    .page-display{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        position:relative;
        padding:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    #pdfCanvas{
        display:block;
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        user-select:none;
    }

    /* ===== AYAH SELECTION AREA ===== */
    .ayah-selection-bar{
        background:#fff;
        border-top:1px solid var(--line);
        max-height:180px;
        overflow-y:auto;
        flex-shrink:0;
        padding:8px 0;
    }

    .ayah-item{
        padding:8px 14px;
        cursor:pointer;
        border-left:3px solid transparent;
        transition:background .2s, border-color .2s;
        text-align:right;
        direction:rtl;
        font-family:'Amiri','Noto Naskh Arabic',serif;
        font-size:16px;
        line-height:1.8;
        color:var(--ink);
    }

    .ayah-item:active,
    .ayah-item.selected{
        background:#e8f5e9;
        border-left-color:var(--brand);
        color:var(--brand-dark);
    }

    .ayah-item.selected{
        background:linear-gradient(90deg, rgba(23,90,69,.08) 0%, transparent 100%);
        font-weight:600;
    }

    /* ===== PAGE CONTROLS ===== */
    .page-controls{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 14px;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        flex-shrink:0;
        gap:10px;
    }

    .nav-btn{
        width:38px;
        height:38px;
        border-radius:50%;
        border:1px solid rgba(255,255,255,.3);
        background:transparent;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        flex-shrink:0;
        transition:background .2s;
    }

    .nav-btn:hover{
        background:rgba(255,255,255,.1);
    }

    .nav-btn:disabled{
        opacity:.4;
        cursor:default;
    }

    .nav-btn svg{
        width:18px;
        height:18px;
    }

    .page-info{
        flex:1;
        text-align:center;
        font-size:13px;
    }

    /* ===== ACTION TOOLBAR ===== */
    .action-toolbar{
        display:flex;
        justify-content:space-around;
        align-items:center;
        background:linear-gradient(180deg,var(--brand),var(--brand-dark));
        color:#fff;
        padding:8px 0;
        flex-shrink:0;
        gap:0;
    }

    .toolbar-btn{
        flex:1;
        height:44px;
        border:none;
        background:transparent;
        color:#fff;
        cursor:pointer;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:2px;
        font-size:11px;
        transition:background .2s;
    }

    .toolbar-btn:active{
        background:rgba(0,0,0,.1);
    }

    .toolbar-btn svg{
        width:20px;
        height:20px;
    }

    /* ===== MODAL/OVERLAY ===== */
    .modal{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.5);
        display:none;
        z-index:100;
        align-items:center;
        justify-content:center;
    }

    .modal.show{
        display:flex;
    }

    .modal-content{
        background:#fff;
        border-radius:12px;
        padding:20px;
        max-width:90%;
        max-height:80vh;
        overflow-y:auto;
    }

    /* ===== LOADING ===== */
    .loading{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        color:#8a8370;
    }

    .spinner{
        width:20px;
        height:20px;
        border:2px solid var(--line);
        border-top-color:var(--brand);
        border-radius:50%;
        animation:spin .6s linear infinite;
    }

    @keyframes spin{
        to{transform:rotate(360deg)}
    }

</style>
</head>
<body>
<div id="app">
    <!-- HEADER -->
    <header>
        <div class="left">
            <button class="icon-btn" id="homeBtn" title="হোম">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <h1>কুরআন শরীফ</h1>
        </div>
        <div class="right">
            <button class="icon-btn" id="moonBtn" title="রাত মোড">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="searchBtn" title="সার্চ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="menuBtn" title="মেনু">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content-area">
        <div class="page-display" id="pageDisplay">
            <div class="loading">
                <div class="spinner"></div>
                <span>পাতা লোড হচ্ছে...</span>
            </div>
        </div>
    </div>

    <!-- AYAH SELECTION BAR -->
    <div class="ayah-selection-bar" id="ayahBar">
        <div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>
    </div>

    <!-- PAGE CONTROLS -->
    <div class="page-controls">
        <button class="nav-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="page-info">
            <span id="pageNum">১</span> / <span id="totalPages">১</span>
        </div>
        <button class="nav-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </button>
    </div>

    <!-- ACTION TOOLBAR -->
    <div class="action-toolbar">
        <button class="toolbar-btn" id="playBtn" title="পড়ুন">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>পড়ুন</span>
        </button>
        <button class="toolbar-btn" id="bookmarkBtn" title="বুকমার্ক">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            <span>বুকমার্ক</span>
        </button>
        <button class="toolbar-btn" id="shareBtn" title="শেয়ার">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span>শেয়ার</span>
        </button>
        <button class="toolbar-btn" id="tafsirBtn" title="তাফসীর">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>তাফসীর</span>
        </button>
        <button class="toolbar-btn" id="moreBtn" title="আরও">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
            </svg>
            <span>আরও</span>
        </button>
    </div>
</div>

<audio id="audio"></audio>

<script>
    // PDF.js সেটআপ
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let selectedMushaf = 'emdadia';
    const pdfUrls = {
        emdadia: '/mnt/user-data/uploads/Emdadia-Hafezi-Quran.pdf'
    };

    const pageDisplay = document.getElementById('pageDisplay');
    const ayahBar = document.getElementById('ayahBar');
    const pageNum = document.getElementById('pageNum');
    const totalPagesSpan = document.getElementById('totalPages');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // পিডিএফ লোড করুন
    async function loadPdf() {
        try {
            const pdfUrl = pdfUrls[selectedMushaf];
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            totalPages = pdfDoc.numPages;
            totalPagesSpan.textContent = toBengaliNumeral(totalPages);
            
            // সংরক্ষিত পৃষ্ঠা লোড করুন
            const savedPage = localStorage.getItem('currentPage_' + selectedMushaf);
            currentPage = savedPage ? parseInt(savedPage) : 1;
            
            await renderPage(currentPage);
        } catch (error) {
            console.error('PDF লোড করা যায়নি:', error);
            pageDisplay.innerHTML = '<div class="loading"><span>পিডিএফ লোড করা যায়নি।</span></div>';
        }
    }

    // পৃষ্ঠা রেন্ডার করুন
    async function renderPage(pageNum) {
        if (!pdfDoc) return;
        
        try {
            const page = await pdfDoc.getPage(pageNum);
            const scale = 1.5;
            const viewport = page.getViewport({ scale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport }).promise;
            
            // ক্যানভাস প্রদর্শন করুন
            pageDisplay.innerHTML = '';
            canvas.id = 'pdfCanvas';
            pageDisplay.appendChild(canvas);
            
            // স্ক্লিক হ্যান্ডলার যোগ করুন
            setupPageClickHandlers(canvas, viewport);
            
            // পৃষ্ঠা নম্বর আপডেট করুন
            currentPage = pageNum;
            pageNum.textContent = toBengaliNumeral(pageNum);
            localStorage.setItem('currentPage_' + selectedMushaf, pageNum);
            
            // নেভিগেশন বাটন অক্ষম/সক্ষম করুন
            prevBtn.disabled = pageNum === 1;
            nextBtn.disabled = pageNum === totalPages;
            
            // আয়াত বার সাফ করুন
            updateAyahBar([]);
        } catch (error) {
            console.error('পৃষ্ঠা রেন্ডার করা যায়নি:', error);
        }
    }

    // পৃষ্ঠায় ক্লিক হ্যান্ডলার সেটআপ করুন
    function setupPageClickHandlers(canvas, viewport) {
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // ক্লিক করা লাইন সনাক্ত করুন এবং হাইলাইট করুন
            const lineHeight = viewport.height / 15; // আনুমানিক লাইন সংখ্যা
            const lineIndex = Math.floor(y / lineHeight);
            
            // নমুনা আয়াত তৈরি করুন (বাস্তব বাস্তবায়নে, এটি OCR বা রেখা সনাক্তকরণ থেকে আসবে)
            const sampleAyahs = generateSampleAyahs(currentPage);
            if (sampleAyahs[lineIndex]) {
                selectAyah(sampleAyahs[lineIndex]);
            }
        });
    }

    // নমুনা আয়াত তৈরি করুন
    function generateSampleAyahs(page) {
        const ayahs = [];
        const ayahTexts = [
            'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',
            'الرَّحْمَٰنِ الرَّحِيمِ',
            'مَالِكِ يَوْمِ الدِّينِ',
            'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ',
            'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',
            'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ',
            'غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ'
        ];
        
        ayahTexts.forEach((text, idx) => {
            ayahs.push({
                id: `page_${page}_ayah_${idx}`,
                text: text,
                page: page,
                lineIndex: idx
            });
        });
        
        return ayahs;
    }

    // আয়াত নির্বাচন করুন
    function selectAyah(ayah) {
        // পূর্ববর্তী নির্বাচন সরান
        document.querySelectorAll('.ayah-item').forEach(item => {
            item.classList.remove('selected');
        });
        
        // নতুন আয়াত নির্বাচন করুন
        updateAyahBar([ayah]);
        
        // নির্বাচিত আয়াত হাইলাইট করুন
        const selectedItem = ayahBar.querySelector(`[data-id="${ayah.id}"]`);
        if (selectedItem) {
            selectedItem.classList.add('selected');
            selectedItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    // আয়াত বার আপডেট করুন
    function updateAyahBar(ayahs) {
        if (ayahs.length === 0) {
            ayahBar.innerHTML = '<div class="ayah-item" style="text-align:center; color:#999;">আয়াত নির্বাচন করতে পড়ুন</div>';
            return;
        }
        
        ayahBar.innerHTML = ayahs.map(ayah => 
            `<div class="ayah-item" data-id="${ayah.id}" onclick="selectAyah({id: '${ayah.id}', text: '${ayah.text}', page: ${ayah.page}})">
                <div>${ayah.text}</div>
                <div style="font-size:11px; color:#999; margin-top:4px; direction:ltr; font-family:serif;">سورة الفاتحة</div>
            </div>`
        ).join('');
    }

    // বাংলা সংখ্যা রূপান্তর
    function toBengaliNumeral(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).split('').map(digit => bengaliDigits[parseInt(digit)]).join('');
    }

    // নেভিগেশন
    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) renderPage(currentPage + 1);
    });

    // টুলবার বাটন
    document.getElementById('playBtn').addEventListener('click', () => {
        alert('অডিও বৈশিষ্ট্য শীঘ্রই উপলব্ধ হবে।');
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
        const btn = document.getElementById('bookmarkBtn');
        btn.style.opacity = btn.style.opacity === '0.6' ? '1' : '0.6';
        alert('এই পৃষ্ঠাটি বুকমার্ক করা হয়েছে।');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        const shareData = {
            title: 'কুরআন শরীফ',
            text: `পৃষ্ঠা ${toBengaliNumeral(currentPage)} দেখুন`,
            url: location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            alert('এই ব্রাউজারে শেয়ার সমর্থিত নয়।');
        }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const n = prompt(`কোন পৃষ্ঠায় যেতে চান? (১-${totalPages})`);
        if (n) {
            const pageNum = parseInt(n);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            }
        }
    });

    document.getElementById('moonBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
    });

    // শুরু করুন
    loadPdf();

    // স্পর্শ সোয়াইপ
    let touchStartX = null;
    pageDisplay.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    pageDisplay.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            if (dx < 0 && currentPage < totalPages) renderPage(currentPage + 1);
            else if (dx > 0 && currentPage > 1) renderPage(currentPage - 1);
        }
        touchStartX = null;
    }, { passive: true });

</script>

</body>
</html>
