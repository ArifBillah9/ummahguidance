<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাসআলা তালিকা</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&subset=arabic&display=swap" rel="stylesheet">
    <style>
               @font-face{
    font-family:'Kalpurush';
    src:url('masayel/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            background: linear-gradient(135deg, #F8F7F4 0%, #EFF5F8 100%);
            color: #2C3E50;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
        }

        /* ========== HEADER SECTION ========== */
        .header {
            background: linear-gradient(135deg, #1B3A5C 0%, #2C5282 100%);
            position: relative;
            padding: 36px 20px 24px;
            text-align: center;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,30 Q300,0 600,30 T1200,30 L1200,120 L0,120 Z" fill="rgba(212,165,116,0.1)"/></svg>') repeat-x;
            background-size: 600px 100%;
            opacity: 0.5;
        }

        .header-text {
            position: relative;
            z-index: 2;
            color: white;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: white;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(27, 58, 92, 0.08);
            border: 1px solid #E8F0F4;
            border-radius: 10px;
            position: relative;
            z-index: 3;
            margin: 0 auto;
            width: 90%;
            max-width: 500px;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            box-shadow: 0 4px 16px rgba(27, 58, 92, 0.15);
            border-color: #1B8A4A;
            background: linear-gradient(135deg, #FFFFFF 0%, #F4F8F5 100%);
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            color: #2C3E50;
            background: transparent;
            cursor: text;
            padding: 4px 0;
        }

        .search-bar input::placeholder {
            color: #95A5A6;
            font-weight: 500;
        }

        .search-bar input:focus::placeholder {
            color: #BDC3C7;
        }

        /* সার্চ আইকন */
        .search-icon {
            color: #95A5A6;
            font-size: 16px;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .search-bar:focus-within .search-icon {
            color: #1B8A4A;
        }

        /* মাইক বাটন */
        .search-bar .mic-btn {
            background: transparent;
            color: #7F8C8D;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0;
            padding: 0;
        }

        .search-bar .mic-btn:hover {
            background: #F4F8F5;
            color: #1B8A4A;
        }

        .search-bar .mic-btn.listening {
            animation: pulseMic 1s infinite;
            color: #E74C3C;
            background: #FADBD8;
        }

        @keyframes pulseMic {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* ক্লিয়ার বাটন */
        .search-bar .clear-btn {
            background: transparent;
            color: #95A5A6;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
        }

        .search-bar .clear-btn:hover {
            background: #F4F8F5;
            color: #34495E;
        }

        .search-bar .clear-btn:active {
            transform: scale(0.95);
        }

        /* ========== MASAIL LIST ========== */
        .masail-list {
            list-style: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .masail-item {
            padding: 16px 18px;
            background: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .masail-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .masail-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(27, 58, 92, 0.12);
            border-left-color: #2ECC71;
        }

        .masail-item:hover::before {
            opacity: 1;
        }

        .masail-number {
            font-size: 11px;
            color: #95A5A6;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-block;
            padding: 4px 8px;
            background: #FFFFFF;
            border-radius: 3px;
            width: fit-content;
        }

        .masail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .masail-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B3A5C;
            line-height: 1.45;
            flex: 1;
            margin: 2px 0 0 0;
        }

        .masail-description {
            font-size: 13px;
            color: #7F8C8D;
            line-height: 1.5;
            margin: 2px 0 0 0;
        }

        .masail-meta-row {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #7F8C8D;
            flex-wrap: nowrap;
            padding-top: 8px;
            border-top: 1px solid #F0F0F0;
            margin-top: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .masail-meta-row::-webkit-scrollbar { display: none; }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .meta-item i {
            color: #2ECC71;
            font-size: 12px;
            width: 14px;
            text-align: center;
        }

        .masail-actions {
            display: flex;
            gap: 6px;
            justify-content: space-between;
            padding-top: 4px;
            flex-wrap: nowrap;
        }

        .action-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #95A5A6;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 500;
            padding: 4px 6px;
            border-radius: 4px;
            white-space: nowrap;
            flex: 1;
            justify-content: center;
            min-width: 0;
        }

        .action-btn:hover {
            color: #2ECC71;
            background: rgba(46, 204, 113, 0.08);
            transform: translateX(2px);
        }

        .action-btn i {
            font-size: 13px;
        }

        @media (max-width: 360px) {
            .masail-actions { gap: 2px; }
            .action-btn { font-size: 11px; padding: 4px 3px; gap: 4px; }
            .masail-meta-row { gap: 10px; }
        }

        /* ========== DETAIL VIEW (ANSWER PAGE) ========== */
        .detail-view {
            display: none;
            background: linear-gradient(135deg, #F8F7F4 0%, #EFF5F8 100%);
            padding: 20px 16px 40px;
            animation: slideIn 0.3s ease;
        }

        .detail-view.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            background: #FFFFFF;
            color: #1B3A5C;
            border: 1px solid #E4EEE6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            margin-bottom: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(27, 58, 92, 0.06);
        }

        .back-btn:hover {
            transform: translateX(-4px);
            box-shadow: 0 4px 12px rgba(27, 58, 92, 0.12);
        }

        .card {
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(27, 58, 92, 0.08);
            padding: 22px 20px;
            margin-bottom: 18px;
        }

        .masail-title-main {
            font-size: 21px;
            font-weight: 800;
            color: #1B8A4A;
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .question-label { font-weight: 700; color: #1B3A5C; }
        .question-number { color: #D4A574; font-weight: 700; }

        .question-text {
            font-size: 15px;
            line-height: 1.85;
            color: #2C3E50;
            text-align: justify;
        }

        .meta-row {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            margin: 18px 0 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .meta-row::-webkit-scrollbar { display: none; }

        .meta-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #34495E;
            background: #F4F8F5;
            border: 1px solid #E4EEE6;
            padding: 8px 14px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .meta-pill i { color: #2ECC71; font-size: 13px; }

        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid #F0F0F0;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .action-row::-webkit-scrollbar { display: none; }

        .pill-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #1B8A4A;
            background: #F4F8F5;
            border: 1px solid #DCEEE0;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .pill-btn:hover { background: #E6F5EA; }

        .icon-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #F4F8F5;
            border: 1px solid #DCEEE0;
            color: #1B8A4A;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: #E6F5EA; }

        .bookmark-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #7F8C8D;
            background: transparent;
            border: 1px solid #EAEAEA;
            cursor: pointer;
            font-family: inherit;
            padding: 9px 12px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bookmark-btn:hover { color: #D4A574; border-color: #D4A574; }

        @media (max-width: 380px) {
            .header {
                padding: 28px 16px 18px;
            }

            .header-title {
                font-size: 26px;
            }

            .header-subtitle {
                font-size: 12px;
            }

            .header-text {
                margin-bottom: 16px;
            }

            .search-bar {
                width: 95%;
                padding: 10px 14px;
                gap: 6px;
            }

            .search-bar input {
                font-size: 13px;
            }

            .search-icon, .search-bar .mic-btn, .search-bar .clear-btn {
                font-size: 13px;
            }

            .search-bar .mic-btn, .search-bar .clear-btn {
                width: 30px;
                height: 30px;
            }

            .action-row { gap: 5px; }
            .pill-btn, .bookmark-btn { font-size: 12px; padding: 8px 9px; }
            .pill-btn span, .bookmark-btn span { display: inline; }
            .meta-row { gap: 8px; }
            .meta-pill { font-size: 12px; padding: 7px 10px; }
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #1B8A4A;
            margin-bottom: 16px;
        }

        .arabic-box {
            background: linear-gradient(135deg, rgba(27, 58, 92, 0.04) 0%, rgba(46, 204, 113, 0.06) 100%);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .arabic-box p {
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
            font-size: 18px;
            line-height: 1.55;
            color: #1B3A5C;
            direction: rtl;
        }

        .ref-button-row {
            display: flex;
            justify-content: center;
            margin: 18px 0 16px;
        }

        .ref-main-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #1B8A4A 0%, #27AE60 100%);
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 138, 74, 0.2);
        }

        .ref-main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(27, 138, 74, 0.3);
            background: linear-gradient(135deg, #16733E 0%, #229954 100%);
        }

        .ref-main-btn i {
            font-size: 15px;
        }

        .answer-text {
            position: relative;
            display: flow-root;
        }

        .answer-text p {
            font-size: 15px;
            line-height: 1.9;
            color: #2C3E50;
            text-align: justify;
            margin-bottom: 16px;
        }

        /* ========== ARABIC QUOTE LINE ========== */
        .arabic-line {
            display: inline-block;
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
            font-size: 19px;
            line-height: 2;
            color: #1B3A5C;
            direction: rtl;
        }

        /* ========== REFERENCE ICON (কোনো ব্যাকগ্রাউন্ড ছাড়া প্লেইন আইকন) ========== */
        .ref-line-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            vertical-align: middle;
        }

        .ref-icon {
            cursor: pointer;
            color: #1B8A4A;
            margin: 0 4px;
            font-size: 14px;
            background: none;
            border: none;
            vertical-align: middle;
        }

        /* ========== রেফারেন্স টুলটিপ (আইকনে ক্লিক করলে পাশে শুধু আরবি টেক্সট দেখাবে) ========== */
        .ref-tooltip-popup {
            position: absolute;
            z-index: 2000;
            width: 280px;
            max-width: calc(100vw - 24px);
            background: #FFFFFF;
            border-radius: 0;
            box-shadow: 0 16px 40px rgba(27, 58, 92, 0.22), 0 0 0 1px rgba(27, 58, 92, 0.06);
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px) scale(0.96);
            transition: opacity 0.16s ease, transform 0.16s ease;
            pointer-events: none;
        }

        .ref-tooltip-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .ref-tooltip-popup::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #FFFFFF;
            transform: rotate(45deg);
            left: var(--ref-arrow-left, 24px);
        }

        .ref-tooltip-popup.ref-arrow-top::after {
            top: -7px;
            box-shadow: -2px -2px 4px rgba(27, 58, 92, 0.05);
        }

        .ref-tooltip-popup.ref-arrow-bottom::after {
            bottom: -7px;
            box-shadow: 2px 2px 4px rgba(27, 58, 92, 0.05);
        }

        .ref-tooltip-arabic {
            direction: rtl;
            font-size: 16px;
            line-height: 1.9;
            color: #1B3A5C;
            background: #FFFFFF;
            padding: 14px 16px;
            border-radius: 0;
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        }

        .ref-tooltip-arabic + .ref-tooltip-arabic {
            margin-top: 6px;
        }

        .ref-tooltip-source-ar {
            direction: rtl;
            font-size: 12.5px;
            font-weight: 600;
            color: #1B8A4A;
            background: #FFFFFF;
            padding: 0 16px 12px;
            margin-top: -6px;
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        }

        .ref-tooltip-empty {
            direction: rtl;
            font-size: 13px;
            color: #95A5A6;
            background: #FFFFFF;
            padding: 14px 16px;
            text-align: center;
        }

        .ref-modal {
            background: linear-gradient(135deg, #E8D4F8 0%, #F0E8F8 50%, #FFFFFF 100%);
            border-radius: 28px;
            max-width: 420px;
            width: 95%;
            padding: 50px 30px 35px;
            box-shadow: 
                0 30px 60px rgba(147, 51, 234, 0.25),
                0 0 0 1px rgba(147, 51, 234, 0.15);
            animation: slideUpModal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(147, 51, 234, 0.2);
            text-align: center;
            position: relative;
            overflow: visible;
            max-height: none;
        }
        
        .ref-modal::before {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 22px solid rgba(240, 232, 248, 1);
            filter: drop-shadow(0 3px 6px rgba(147, 51, 234, 0.2));
        }

        @keyframes slideUpModal {
            from { 
                transform: translateY(40px) scale(0.95);
                opacity: 0;
            }
            to { 
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .ref-modal-header {
            padding: 0;
            border-bottom: none;
            display: none;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .ref-modal-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="15" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="50" r="25" fill="rgba(255,255,255,0.03)"/><circle cx="50" cy="80" r="20" fill="rgba(255,255,255,0.04)"/></svg>');
            background-size: 200px 200px;
        }

        .ref-modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }

        .ref-modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .ref-line-wrap {
            display: block;
            text-align: right;
            margin: 2px 0 6px;
        }

        .ref-line-btn {
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(27, 58, 92, 0.06);
            color: #1B3A5C;
            font-size: 12px;
            font-weight: 700;
        }

        .ref-line-btn:hover {
            background: #1B3A5C;
            color: #fff;
        }


        .ref-modal {
            background: #fff;
            width: 100%;
            max-width: 360px;
            max-height: 75vh;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .ref-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;

<body>
    <div class="container">
        <!-- List View -->
        <div class="list-view" id="listView">
            <!-- Header Section -->
            <div class="header">
                <div class="header-text">
                    <div class="header-title">আপনার জিজ্ঞাসা/মাসায়েল</div>
                    <div class="header-subtitle">সকল মাসায়েল একত্রে দেখুন</div>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="মাসায়েল অনুসন্ধান">
                    <button class="mic-btn" id="micBtn" type="button"><i class="fas fa-microphone"></i></button>
                    <button class="clear-btn" id="clearBtn" type="button">✕</button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons-row">
                <a href="tel:+8801923130565" class="action-btn">
                    <i class="fas fa-phone"></i>
                    <span>সরাসরি কল করুন</span>
                </a>
                <a href="#ask-question" class="action-btn">
                    <i class="fas fa-pen-fancy"></i>
                    <span>লিখিত প্রশ্ন করুন</span>
                </a>
            </div>

            <!-- Masail Tabs -->
            <div class="masail-tabs-container" id="masailTabsContainer">
                <button class="masail-tab active" data-tab="recent" onclick="switchMasailTab('recent')">
                    <i class="fas fa-clock"></i>
                    <span>সাম্প্রতিক</span>
                </button>
                <button class="masail-tab" data-tab="topic" onclick="switchMasailTab('topic')">
                    <i class="fas fa-bookmark"></i>
                    <span>বিষয়ভিত্তিক</span>
                </button>
                <button class="masail-tab" data-tab="saved" onclick="switchMasailTab('saved')">
                    <i class="fas fa-heart"></i>
                    <span>সংরক্ষিত</span>
                </button>
            </div>

            <!-- Masail List -->
            <ul class="masail-list" id="masailList">
            </ul>
        </div>

        <!-- Detail View (Answer Page - no navbar / footer / banner) -->
        <div class="detail-view" id="detailView">
            <button class="back-btn" onclick="backToList()">
                <i class="fas fa-arrow-left"></i> প্রশ্ন তালিকায় ফিরে যান
            </button>

            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // ========== VIEW STATE ==========
        let currentView = 'masail'; // 'masail', 'topics', 'topic-questions'
        let currentTopicData = null;
        let allTopics = [];

        // ========== MASAIL TABS HANDLER ==========
        let currentMasailTab = 'recent'; // ডিফল্ট ট্যাব

        function switchMasailTab(tabName) {
            currentMasailTab = tabName;
            
            // সকল ট্যাব থেকে active ক্লাস সরাই
            document.querySelectorAll('.masail-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // নির্বাচিত ট্যাবে active ক্লাস যোগ করি
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            
            // বিষয়ভিত্তিক ট্যাবে ক্লিক করলে বিষয়গুলি দেখাবে
            if (tabName === 'topic') {
                showTopicsListView();
            } else if (tabName === 'recent') {
                showMasailListView();
            } else if (tabName === 'saved') {
                showSavedMasailView();
            }
        }

        // ========== MASAIL LIST VIEW ==========
        function showMasailListView() {
            currentView = 'masail';
            createMasailList();
        }

        // ========== TOPICS LIST VIEW ==========
        function showTopicsListView() {
            currentView = 'topics';
            loadTopicsData();
            displayTopicsInMasailList();
        }

        function loadTopicsData() {
            // সব প্রশ্ন থেকে বিষয়গুলি সংগ্রহ করি এবং গ্রুপ করি
            const topicsMap = {};
            
            masailsData.forEach(masail => {
                masail.tags.forEach(tag => {
                    if (!topicsMap[tag]) {
                        topicsMap[tag] = [];
                    }
                    topicsMap[tag].push(masail);
                });
            });

            allTopics = Object.keys(topicsMap).map(topicName => ({
                name: topicName,
                count: topicsMap[topicName].length,
                questions: topicsMap[topicName]
            })).sort((a, b) => b.count - a.count); // সবচেয়ে বেশি প্রশ্ন প্রথমে
        }

        function displayTopicsInMasailList() {
            const masailList = document.getElementById('masailList');
            masailList.innerHTML = '';

            const topicIcons = {
                'মিরাস ও উত্তরাধিকার': 'fa-briefcase',
                'ফরায়েজ': 'fa-scales',
                'বিক্রয় ও ক্রয়': 'fa-shopping-cart',
                'জায়েয । নাজায়েয': 'fa-check-circle',
                'প্রচলিত ভুল': 'fa-exclamation-circle'
            };

            allTopics.forEach(topic => {
                const icon = topicIcons[topic.name] || 'fa-folder';
                const li = document.createElement('li');
                li.className = 'topic-item';
                li.onclick = () => showTopicQuestions(topic);
                li.innerHTML = `
                    <div class="topic-item-left">
                        <div class="topic-icon">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="topic-info">
                            <h4>${topic.name}</h4>
                            <p class="topic-count">${topic.count}টি প্রশ্ন</p>
                        </div>
                    </div>
                    <div class="topic-badge">${topic.count}</div>
                `;
                masailList.appendChild(li);
            });
        }

        // ========== SHOW TOPIC QUESTIONS ==========
        function showTopicQuestions(topic) {
            currentView = 'topic-questions';
            currentTopicData = topic;

            const masailList = document.getElementById('masailList');
            masailList.innerHTML = '';

            // ব্যাক বাটন যোগ করি (li এর মধ্যে)
            const backLi = document.createElement('li');
            backLi.style.cssText = 'padding: 16px 20px; list-style: none; background: transparent;';
            backLi.innerHTML = `
                <button class="topic-back-btn" onclick="backToTopicsList()" style="width: 100%;">
                    <i class="fas fa-arrow-left"></i>
                    <span>সব বিষয়ে ফিরুন</span>
                </button>
            `;
            masailList.appendChild(backLi);

            // বিষয়ের শিরোনাম
            const heading = document.createElement('li');
            heading.style.cssText = 'padding: 16px 20px; list-style: none; background: transparent;';
            heading.innerHTML = `
                <div style="font-size: 18px; font-weight: 800; color: #1B8A4A; margin-bottom: 8px;">
                    <i class="fas fa-bookmark" style="margin-right: 8px;"></i>${topic.name}
                </div>
                <div style="font-size: 13px; color: #7F8C8D;">মোট ${topic.count}টি প্রশ্ন</div>
            `;
            masailList.appendChild(heading);

            // সব প্রশ্ন যোগ করি
            topic.questions.forEach((masail, index) => {
                const li = createMasailElement(masail, index + 1);
                masailList.appendChild(li);
            });
        }

        function backToTopicsList() {
            showTopicsListView();
        }

        // ========== SAVED MASAIL VIEW ==========
        function showSavedMasailView() {
            const masailList = document.getElementById('masailList');
            masailList.innerHTML = '';

                fullAnswer: 'এটি একটি অত্যন্ত গুরুত্বপূর্ণ ইসলামী প্রশ্ন যা বহু মানুষ জানতে চান। সংক্ষিপ্ত উত্তর হল: মুসলিম সন্তান অমুসলিম পিতামাতার মিরাস পাবে না, এবং অমুসলিম পিতামাতাও মুসলিম সন্তানের মিরাস পাবে না।\n\nইসলামী শরীয়তে মিরাস বণ্টনের একটি মৌলিক নীতি রয়েছে যা দীনের পার্থক্যের উপর ভিত্তি করে। আল্লাহ তায়ালা কুরআনে বলেছেন: \"এবং যারা বিশ্বাস করে এবং দেশ ত্যাগ করেছে এবং আমাদের রাস্তায় জিহাদ করেছে, আর যারা আশ্রয় দিয়েছে এবং সাহায্য করেছে - এরা পরস্পর বন্ধু।\" (সুরা আনফাল: 72)\n\nহাদীসে রাসুল (স.) স্পষ্টভাবে বলেছেন: মুসলিম অমুসলিমের উত্তরাধিকারী হয় না এবং অমুসলিম মুসলিমের উত্তরাধিকারী হয় না।\n\nতবে একজন মুসলিম পিতা বা মাতা তাদের অমুসলিম সন্তানদের জন্য উইল বা উপহার দিয়ে সম্পদ প্রদান করতে পারে। এটি শরীয়তসম্মত এবং বৈধ পদ্ধতি।\n\nকিন্তু মিরাস আইন অনুযায়ী, ইসলাম এবং অমুসলিমের মধ্যে কোনো উত্তরাধিকার সম্পর্ক থাকে না। এটি ইসলামী আইনের একটি স্পষ্ট এবং দৃঢ় নীতি।'
            }
        ];
        // শুধুমাত্র সাধারণ সংখ্যা প্রদর্শন - Devanagari সংখ্যা নেই
        function convertToBangla(num) {
            return num.toString();
        }

        // ================== প্রতিটি প্রশ্ন-উত্তরের জন্য আলাদা URL (SEO) ==================
        const originalTitle = document.title;
        const originalMetaDescription = (document.querySelector('meta[name="description"]') || {}).content || '';

        // পেজ লোড হওয়ার সময় বর্তমান URL দেখে "লিস্টিং পেজ"-এর বেস পাথ বের করা।
        // যদি সরাসরি কোনো মাসআলার পার্মালিংকে (যেমন /frontend/masayel/163239/স্লাগ) লোড হয়,
        // তাহলে সংখ্যা ও স্লাগ অংশ বাদ দিয়ে বেস পাথ ঠিক করা হয়, যাতে "masail" নামের কোনো
        // অতিরিক্ত অংশ URL-এ যোগ না হয়।
        function computeBasePath() {
            const segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length >= 2 && /^[0-9]+$/.test(segments[segments.length - 2])) {
                segments.pop(); // স্লাগ
                segments.pop(); // সংখ্যা
            } else if (segments.length >= 1 && /^[0-9]+$/.test(segments[segments.length - 1])) {
                segments.pop(); // শুধু সংখ্যা (স্লাগ ছাড়া)
            }
            return '/' + segments.join('/') + (segments.length ? '/' : '');
        }

        const basePath = computeBasePath();

        // শিরোনাম থেকে URL-friendly স্লাগ তৈরি, যেমন "কনের বাড়ীর দাওয়াত প্রসঙ্গ" -> "কনের-বাড়ীর-দাওয়াত-প্রসঙ্গ"
        function slugify(text) {
            return String(text)
                .trim()
                .replace(/[?,।:;!"'’‘""()]/g, '')
                .replace(/\s+/g, '-');
        }

        function setMetaDescription(content) {
            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) {
                metaDesc = document.createElement('meta');
                metaDesc.setAttribute('name', 'description');
                document.head.appendChild(metaDesc);
            }
            metaDesc.setAttribute('content', content || '');
        }

        // ================== রেফারেন্স (আয়াত/হাদিস/কিতাব) গোপন রেখে আইকনে দেখানোর সিস্টেম ==================
        // বর্তমানে প্রদর্শিত উত্তরের রেফারেন্সগুলো এখানে জমা থাকে; প্রতিটি আইটেম একটি আইকনের সাথে যুক্ত
        let currentRefs = [];

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // একটি রেফারেন্স গ্রুপ যোগ করে তার ইনডেক্স রিটার্ন করে (গ্রুপে একাধিক আইটেম থাকতে পারে, যেমন একাধিক কিতাবের রেফারেন্স একসাথে)
        function pushRefGroup(items) {
            currentRefs.push(items);
            return currentRefs.length - 1;
        }

        // fullAnswer টেক্সট প্রসেস করে আয়াত/হাদিস/কিতাবের সকল দলিল ও হাওলা উত্তরের ভেতর থেকে
        // সম্পূর্ণ সরিয়ে ফেলে (কোনো আইকন/বাটনও রাখা হয় না) এবং আলাদাভাবে currentRefs-এ জমা রাখে,
        // যা পুরো পেজের একদম শেষে একটিমাত্র "রেফারেন্স" আইকনে ক্লিক করলে পপআপে দেখানো হয়।
        function renderAnswerWithHiddenReferences(text) {
            currentRefs = [];

            const ayatLineRegex = /^স[ূু]রা[^\n]*আয়াত\s*[:：]?\s*[০-৯0-9]+\.?$/;
            const hadithLineRegex = /হাদী[সছ][^০-৯0-9]*[:：]?\s*[০-৯0-9]+\.?$/;
            const inlineRefRegex = /\(([^()]*(?:স[ূু]রা|আয়াত|হাদীস|হাদিস|বুখারী|মুসলিম|তিরমিযি|আবু দাউদ|ইবনে মাজাহ|মুসনাদ)[^()]*)\)/g;

            const paragraphs = text.split('\n\n').map(paragraph => {
                const lines = paragraph.split('\n');
                const outLines = [];
                let pendingArabic = null; // ঠিক আগের লাইনে পাওয়া আরবি আয়াত/হাদিসের মূল উদ্ধৃতি, রেফারেন্স লাইনের অপেক্ষায়

                lines.forEach(rawLine => {
                    const trimmed = rawLine.trim();

                    // ০) আরবি উদ্ধৃতি লাইন (আয়াত/হাদিসের মূল আরবি টেক্সট) - উত্তরে দেখানো হবে না,
                    //    পরের লাইনের রেফারেন্সের সাথে একত্রে জমা রাখা হলো
                    const arabicLineMatch = trimmed.match(/^<span class=["']arabic-line["']>([\s\S]*)<\/span>$/);
                    if (arabicLineMatch) {
                        pendingArabic = arabicLineMatch[1];
                        return;
                    }

                    // ১) আয়াত বা হাদিসের রেফারেন্স লাইন - ঠিক আগের আরবি উদ্ধৃতির সাথে মিলিয়ে
                    //    একটি সম্পূর্ণ দলিল (আরবি + উৎস) হিসেবে জমা রাখা হলো, উত্তরে দেখানো হবে না
                    const isAyatLine = ayatLineRegex.test(trimmed);
                    const isHadithLine = /হাদী[সছ]/.test(trimmed) && /নম্বর/.test(trimmed);

                    if (isAyatLine || isHadithLine || pendingArabic !== null) {
                        pushRefGroup([{
                            type: isAyatLine ? 'আয়াত রেফারেন্স' : (isHadithLine ? 'হাদিস রেফারেন্স' : 'রেফারেন্স'),
                            arabic: pendingArabic || null,
                            source: trimmed
                        }]);
                        pendingArabic = null;
                        return;
                    }

                    // ২) সম্পূর্ণ লাইন জুড়ে বন্ধনীতে থাকা কিতাব/সূত্র রেফারেন্স, যেমন: (কিতাব ১: ৮/৫৪৮; কিতাব ২: ৯/৪৬৫৮) - সংগ্রহ করে রাখা হলো, উত্তরে দেখানো হবে না
                    const fullParenMatch = trimmed.match(/^\((.+)\)$/);
                    if (fullParenMatch && /[:：]/.test(fullParenMatch[1])) {
                        const items = fullParenMatch[1]
                            .split(';')
                            .map(s => s.trim())
                            .filter(Boolean)
                            .map(s => ({ type: 'কিতাব রেফারেন্স', source: s }));
                        pushRefGroup(items);
                        return;
                    }

                    // ৩) স্বাভাবিক বাক্যের ভেতরে ইনলাইন বন্ধনীযুক্ত রেফারেন্স, যেমন: (সূরা আনফাল: ৭২) - সংগ্রহ করে বাক্য থেকে সরিয়ে ফেলা হলো
                    const processedLine = rawLine
                        .replace(inlineRefRegex, (match, inner) => {
                            pushRefGroup([{ type: 'রেফারেন্স', source: inner.trim() }]);
                            return '';
                        })
                        .replace(/\s+([।,.!?])/g, '$1')
                        .replace(/[ \t]{2,}/g, ' ')
                        .trimEnd();

                    if (processedLine.trim()) {
                        outLines.push(processedLine);
                    }
                });

                if (!outLines.length) return ''; // যে প্যারাগ্রাফে শুধু আরবি উদ্ধৃতি/রেফারেন্স ছিল, উত্তরে তার জন্য ফাঁকা প্যারাগ্রাফ দেখানো হবে না

                return `<p>${outLines.join('<br>')}</p>`;
            });

            return paragraphs.filter(Boolean).join('');
        }

        // পুরো উত্তরের সকল দলিল/হাওলা আইকনের পাশে টুলটিপ আকারে দেখানো (একদম শেষের একটিমাত্র রেফারেন্স আইকনে ক্লিক করলে)
        function openRefPopup() {
            const iconEl = (window.event && window.event.currentTarget) || null;
            if (!iconEl) return;

            if (currentRefTooltipIcon === iconEl && currentRefTooltipEl) {
                closeRefTooltip();
                return;
            }
            closeRefTooltip();

            let html;
            if (!currentRefs.length) {
                html = '<div class="ref-tooltip-empty">এই উত্তরের জন্য কোনো রেফারেন্স যোগ করা হয়নি।</div>';
            } else {
                html = currentRefs.map(group => group.map(item => {
                    const text = item.arabic || item.source;
                    return `<div class="ref-tooltip-arabic">${escapeHtml(text)}</div>`;
                }).join('')).join('');
            }

            const tooltip = document.createElement('div');
            tooltip.className = 'ref-tooltip-popup';
            tooltip.innerHTML = html;
            document.body.appendChild(tooltip);

            currentRefTooltipEl = tooltip;
            currentRefTooltipIcon = iconEl;

            positionRefTooltip(tooltip, iconEl);
            requestAnimationFrame(() => tooltip.classList.add('active'));

            setTimeout(() => {
                document.addEventListener('click', handleOutsideRefTooltipClick, true);
            }, 0);
            document.addEventListener('keydown', handleRefTooltipEscape);
            window.addEventListener('scroll', repositionRefTooltip, true);
            window.addEventListener('resize', repositionRefTooltip);
        }

        // সব রেফারেন্স একসাথে কপি করুন
        function copyAllReferences() {
            if (!currentRefs.length) return;
            
            let allText = [];
            currentRefs.forEach(group => {
                group.forEach(item => {
                    if (item.arabic) {
                        allText.push(`${item.arabic}\n(${item.source})`);
                    } else {
                        allText.push(item.source);
                    }
                });
            });
            
            const fullText = allText.join('\n\n');
            const btn = document.querySelector('.ref-copy-all-btn');

            const finishCopy = () => {
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i><span>কপি হয়েছে</span>';
                setTimeout(() => { btn.innerHTML = original; }, 1500);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(finishCopy).catch(() => {
                    fallbackCopy(fullText);
                    finishCopy();
                });
            } else {
                fallbackCopy(fullText);
                finishCopy();
            }
        }

        // পুরনো ব্রাউজারের জন্য কপি করার বিকল্প পদ্ধতি
        function fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(temp);
        }

        // লিস্ট তৈরি করুন
        function createMasailList(dataToRender = masailsData) {
            const listContainer = document.getElementById('masailList');
            listContainer.innerHTML = '';

            if (dataToRender.length === 0) {
                listContainer.innerHTML = '<li style="text-align:center; padding:16px 10px; color:#95A5A6;">কোনো ফলাফল পাওয়া যায়নি</li>';

            }

            dataToRender.forEach(masail => {
                const li = document.createElement('li');
                li.className = 'masail-item';

                li.innerHTML = `
                    <div class="masail-number">প্রশ্ন নম্বর: ${convertToBangla(masail.number)}</div>

                        <div>
                            <div class="masail-title">${masail.title}</div>
                            <div class="masail-description">${masail.description}</div>
                        </div>
                    </div>
                    
                    <div class="masail-meta-row">
                        <div class="meta-item">
                            <i class="far fa-calendar"></i>
                            <span>${convertToBangla(masail.date.split(' ')[0])} ${masail.date.split(' ').slice(1).join(' ')}</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${masail.location}</span>
                        </div>
                    </div>

                    <div class="masail-actions">

                            <i class="far fa-eye"></i>
                            <span>দেখেছেন ${convertToBangla(masail.views)}</span>
                        </button>
                        <button class="action-btn">
                            <i class="far fa-comment"></i>
                            <span>মন্তব্য ${convertToBangla(masail.comments)}</span>
                        </button>
                        <button class="action-btn">
                            <i class="far fa-heart"></i>
                            <span>পছন্দ ${convertToBangla(masail.likes)}</span>
                        </button>
                    </div>
                `;

                listContainer.appendChild(li);
            });
        }

        // বিস্তারিত (উত্তর) ভিউ দেখান — নেভবার, ফুটার ও ব্যানার ছাড়া
        function showDetail(id, skipUrlUpdate = false) {
            const masail = masailsData.find(m => m.id === id);
            if (!masail) return;

            const dateParts = masail.date.split(' ');
            const dateStr = `${convertToBangla(dateParts[0])} ${dateParts.slice(1).join(' ')}`;

            const answerParagraphs = renderAnswerWithHiddenReferences(masail.fullAnswer);

            const tags = masail.tags || ['সাধারণ মাসআলা'];
            const tagsHtml = tags.map(t => `<span class="tag-pill">${t}</span>`).join('');

            // সম্পর্কিত প্রশ্ন (একই বিষয়ের ট্যাগ মিললে অগ্রাধিকার, নাহলে সাম্প্রতিক অন্য প্রশ্ন)
            const others = masailsData.filter(m => m.id !== masail.id);
            const related = others
                .sort((a, b) => {
                    const aMatch = (a.tags || []).some(t => tags.includes(t)) ? 1 : 0;
                    const bMatch = (b.tags || []).some(t => tags.includes(t)) ? 1 : 0;
                    return bMatch - aMatch;
                })
                .slice(0, 4);

            const relatedHtml = related.map(m => {
                const dParts = m.date.split(' ');
                const dStr = `${convertToBangla(dParts[0])} ${dParts.slice(1).join(' ')}`;
                return `
                <li class="related-item" onclick="showDetail(${m.id})">
                    <div class="related-top-row">
                        <span class="related-number">${convertToBangla(m.number)}</span>
                        <i class="fas fa-chevron-right related-arrow"></i>
                    </div>
                    <div class="related-title">${m.title}</div>
                    <div class="related-answerer"><i class="far fa-user"></i><span>উত্তর দিয়েছেন: ${m.answerer}</span></div>
                    <div class="related-meta-row">
                        <div class="meta-item"><i class="far fa-calendar"></i><span>${dStr}</span></div>
                        <div class="meta-item"><i class="fas fa-map-marker-alt"></i><span>${m.location}</span></div>
                    </div>
                </li>`;
            }).join('');

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="card">
                    <div class="masail-title-main">${masail.title}</div>
                    <div class="question-text">
                        <span class="question-label">প্রশ্নঃ</span>
                        <span class="question-number">${convertToBangla(masail.number)}.</span>
                        ${masail.question}
                    </div>
                </div>

                <div class="card">
                    <div class="section-heading"><i class="far fa-comment-dots"></i><span>উত্তর</span></div>
                    <div class="arabic-box">
                        <p>وَ عَلَيْكُـمُ السَّلَام وَرَحْمَةُ اللَّٰهِ وَبَرَكَاتُهُ<br>بِسْمِ اللَّٰهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
                    </div>
                    <div class="answer-text">
                        ${answerParagraphs}
                        <i class="fa-solid fa-book-bookmark ref-icon" title="রেফারেন্স দেখুন" onclick="openRefPopup()"></i>
                    </div>

                    <div class="info-footer">
                        <div class="footer-item answerer-info">
                            <strong>${masail.answerer}</strong>
                            <span>${masail.answererTitle}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <div class="footer-item">
                            <i class="far fa-calendar"></i> <span>${dateStr}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <div class="footer-item">
                            <i class="fas fa-map-marker-alt"></i> <span>${masail.location}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <button class="footer-btn" title="শেয়ার করুন" onclick="shareMasail(${masail.id})"><i class="fas fa-share-alt"></i></button>
                        <button class="footer-btn" title="প্রিন্ট করুন" onclick="window.print()"><i class="fas fa-print"></i></button>
                        <button class="footer-btn" title="বুকমার্ক করুন"><i class="far fa-bookmark"></i></button>
                    </div>
                </div>

                <div class="card">
                    <div class="comments-header"><i class="far fa-comment"></i><span>মন্তব্য (০)</span></div>
                    <div class="comments-empty">কোনো মন্তব্য নেই। প্রথম মন্তব্য করুন!</div>
                    <div class="login-prompt">
                        <i class="far fa-comment-dots"></i>
                        <p>মন্তব্য করতে লগইন করুন</p>
                        <button class="login-btn">লগইন করুন</button>
                    </div>
                </div>

                <div class="related-heading">এ সম্পর্কিত আরও জিজ্ঞাসা/প্রশ্ন-উত্তর</div>
                <ul class="related-list">${relatedHtml}</ul>
            `;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo(0, 0);

            // প্রতিটি প্রশ্ন-উত্তরের জন্য আলাদা, SEO-বান্ধব URL: {বেসপাথ}/{number}/{slug}
            document.title = `${masail.title} - মাসআলা`;
            setMetaDescription(masail.description || (masail.question || '').slice(0, 155));
            if (!skipUrlUpdate) {
                const url = basePath + `${encodeURIComponent(masail.number)}/${slugify(masail.title)}`;
                history.pushState({ masailId: masail.id }, '', url);
            }
        }

        // শেয়ার / কপি লিংক
        function shareMasail(id) {
            const masail = masailsData.find(m => m.id === id);
            if (!masail) return;
            
        }

        // ফিরে যান
        function backToList(skipUrlUpdate = false) {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailView').classList.remove('active');
            document.title = originalTitle;
            setMetaDescription(originalMetaDescription);
            if (!skipUrlUpdate) {
                history.pushState({}, '', basePath);
            }
        }

        // বর্তমান URL অনুযায়ী সঠিক পেজ (তালিকা বা নির্দিষ্ট মাসআলা) দেখানো
        function routeFromLocation() {
            const path = window.location.pathname;
            if (path.indexOf(basePath) === 0) {
                const rest = path.slice(basePath.length).replace(/^\/+|\/+$/g, '');
                if (rest) {
                    const number = decodeURIComponent(rest.split('/')[0]);
                    if (/^[0-9]+$/.test(number)) {
                        const masail = masailsData.find(m => m.number === number);
                        if (masail) {
                            showDetail(masail.id, true);
                            return;
                        }
                    }
                }
            }
            backToList(true);
        }

        window.addEventListener('popstate', routeFromLocation);

        // সার্চ কার্যকর করা
        function filterMasail(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                createMasailList(masailsData);
                return;
            }
            const filtered = masailsData.filter(masail =>
                masail.title.toLowerCase().includes(q) ||
                masail.description.toLowerCase().includes(q) ||
                masail.fullAnswer.toLowerCase().includes(q) ||
                masail.answerer.toLowerCase().includes(q) ||
                masail.location.toLowerCase().includes(q) ||
                masail.number.includes(q)
            );
            createMasailList(filtered);
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const micBtn = document.getElementById('micBtn');

            searchInput.addEventListener('input', (e) => {
                filterMasail(e.target.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterMasail(searchInput.value);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                filterMasail('');
                searchInput.focus();
            });

            // মাইক দিয়ে ভয়েস সার্চ (যদি ব্রাউজার সমর্থন করে) - বলার সাথে সাথে অটো সার্চ হবে
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.interimResults = true;   // বলার সময়ই ফলাফল আসতে থাকবে
                recognition.continuous = true;        // থামা পর্যন্ত শুনতে থাকবে
                recognition.maxAlternatives = 1;

                let listening = false;

                micBtn.addEventListener('click', () => {
                    if (listening) {
                        recognition.stop();
                        return;
                    }
                    try {
                        recognition.start();
                    } catch (e) {
                        // already started guard
                    }
                });

                recognition.addEventListener('start', () => {
                    listening = true;
                    micBtn.style.background = '#E74C3C';
                    micBtn.classList.add('listening');
                });

                recognition.addEventListener('result', (event) => {
                    let transcript = '';
                    for (let i = 0; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    searchInput.value = transcript;
                    filterMasail(transcript);   // বলার সাথে সাথে অটো সার্চ
                });

                recognition.addEventListener('end', () => {
                    listening = false;
                    micBtn.style.background = '';
                    micBtn.classList.remove('listening');
                });

                recognition.addEventListener('error', () => {
                    listening = false;
                    micBtn.style.background = '';
                    micBtn.classList.remove('listening');
                });
            } else {
                micBtn.addEventListener('click', () => {
                    alert('আপনার ব্রাউজার ভয়েস সার্চ সমর্থন করে না। অনুগ্রহ করে Chrome ব্রাউজার ব্যবহার করুন।');
                });
            }
        }

        // প্রাথমিক লোড
        window.addEventListener('DOMContentLoaded', () => {
            showMasailListView(); // showMasailListView যা createMasailList কল করে
            setupSearch();
            routeFromLocation();
        });
    </script>

    // ========== রেফারেন্স টুলটিপ (ক্লিক করা আইকনের পাশে ছোট বক্স হিসেবে দেখানো হয়) ==========
    let currentRefTooltipEl = null;
    let currentRefTooltipIcon = null;

    function buildRefTooltipHTML(ref) {
        if (!ref.sourceText) return '';
        let html = `<div class="ref-tooltip-arabic">${ref.sourceText}</div>`;
        if (ref.sourceAr) {
            html += `<div class="ref-tooltip-source-ar">${ref.sourceAr}</div>`;
        }
        return html;
    }

    function positionRefTooltip(tooltip, iconEl) {
        const rect = iconEl.getBoundingClientRect();
        const scrollX = window.scrollX || window.pageXOffset;
        const scrollY = window.scrollY || window.pageYOffset;
        const margin = 12;

        const tw = tooltip.offsetWidth;
        const th = tooltip.offsetHeight;

        let left = rect.left + scrollX + rect.width / 2 - tw / 2;
        const minLeft = scrollX + margin;
        const maxLeft = scrollX + window.innerWidth - tw - margin;
        left = Math.max(minLeft, Math.min(left, maxLeft));

        const spaceBelow = window.innerHeight - rect.bottom;
        const spaceAbove = rect.top;
        let top, arrowClass;
        if (spaceBelow >= th + 16 || spaceBelow >= spaceAbove) {
            top = rect.bottom + scrollY + 10;
            arrowClass = 'ref-arrow-top';
        } else {
            top = rect.top + scrollY - th - 10;
            arrowClass = 'ref-arrow-bottom';
        }

        tooltip.classList.remove('ref-arrow-top', 'ref-arrow-bottom');
        tooltip.classList.add(arrowClass);
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';

        const iconCenter = rect.left + scrollX + rect.width / 2;
        let arrowLeft = iconCenter - left;
        arrowLeft = Math.max(18, Math.min(arrowLeft, tw - 18));
        tooltip.style.setProperty('--ref-arrow-left', arrowLeft + 'px');
    }

    function handleOutsideRefTooltipClick(e) {
        if (!currentRefTooltipEl) return;
        if (currentRefTooltipEl.contains(e.target) || (currentRefTooltipIcon && currentRefTooltipIcon.contains(e.target))) {
            return;
        }
        closeRefTooltip();
    }

    function repositionRefTooltip() {
        if (currentRefTooltipEl && currentRefTooltipIcon) {
            positionRefTooltip(currentRefTooltipEl, currentRefTooltipIcon);
        }
    }

    function closeRefTooltip() {
        if (currentRefTooltipEl) {
            currentRefTooltipEl.remove();
        }
        currentRefTooltipEl = null;
        currentRefTooltipIcon = null;
        document.removeEventListener('click', handleOutsideRefTooltipClick, true);
        document.removeEventListener('keydown', handleRefTooltipEscape);
        window.removeEventListener('scroll', repositionRefTooltip, true);
        window.removeEventListener('resize', repositionRefTooltip);
    }

    function handleRefTooltipEscape(e) {
        if (e.key === 'Escape') closeRefTooltip();
    }

    // রেফারেন্স আইকনে ক্লিক করলে তার পাশে টুলটিপ খোলার ফাংশন
    function openRefModal(refId) {
        const iconEl = (window.event && window.event.currentTarget) || null;
        const ref = referenceData[refId];
        if (!ref || !iconEl) return;

        // একই আইকনে আবার ক্লিক করলে টুলটিপ বন্ধ হয়ে যাবে (টগল)
        if (currentRefTooltipIcon === iconEl && currentRefTooltipEl) {
            closeRefTooltip();
            return;
        }
        closeRefTooltip();

        const tooltip = document.createElement('div');
        tooltip.className = 'ref-tooltip-popup';
        tooltip.innerHTML = buildRefTooltipHTML(ref);
        document.body.appendChild(tooltip);

        currentRefTooltipEl = tooltip;
        currentRefTooltipIcon = iconEl;

        positionRefTooltip(tooltip, iconEl);
        requestAnimationFrame(() => tooltip.classList.add('active'));

        setTimeout(() => {
            document.addEventListener('click', handleOutsideRefTooltipClick, true);
        }, 0);
        document.addEventListener('keydown', handleRefTooltipEscape);
        window.addEventListener('scroll', repositionRefTooltip, true);
        window.addEventListener('resize', repositionRefTooltip);
    }

</script>
