<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাসআলা তালিকা</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
               @font-face{
    font-family:'Kalpurush';
    src:url('jakat-fitra/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            background: linear-gradient(135deg, #F8F7F4 0%, #EFF5F8 100%);
            color: #2C3E50;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
        }

        /* ========== HEADER SECTION ========== */
        .header {
            background: linear-gradient(135deg, #1B3A5C 0%, #2C5282 100%);
            position: relative;
            padding: 36px 20px 32px;
            text-align: center;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,30 Q300,0 600,30 T1200,30 L1200,120 L0,120 Z" fill="rgba(212,165,116,0.1)"/></svg>') repeat-x;
            background-size: 600px 100%;
            opacity: 0.5;
        }

        .header-text {
            position: relative;
            z-index: 2;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .search-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            background: white;
            padding: 8px 16px;
            box-shadow: 0 4px 16px rgba(27, 58, 92, 0.15);
            border-radius: 8px;
            position: relative;
            z-index: 3;
            margin: 0 auto;
            width: 90%;
            max-width: 500px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            color: #2C3E50;
            background: transparent;
        }

        .search-bar input::placeholder {
            color: #BDC3C7;
        }

        .search-bar .mic-btn {
            background: #2ECC71;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .search-bar .mic-btn:hover {
            background: #27AE60;
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
        }

        .search-bar .mic-btn.listening {
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .search-bar .clear-btn {
            background: transparent;
            color: #95A5A6;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .search-bar .clear-btn:hover {
            background: #ECF0F1;
            color: #34495E;
        }

        /* ========== MASAIL LIST ========== */
        .masail-list {
            list-style: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .masail-item {
            padding: 16px 18px;
            background: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .masail-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #2ECC71, #27AE60);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .masail-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(27, 58, 92, 0.12);
            border-left-color: #2ECC71;
        }

        .masail-item:hover::before {
            opacity: 1;
        }

        .masail-number {
            font-size: 11px;
            color: #95A5A6;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-block;
            padding: 4px 8px;
            background: #F8F9FA;
            border-radius: 3px;
            width: fit-content;
        }

        .masail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .masail-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B3A5C;
            line-height: 1.45;
            flex: 1;
            margin: 2px 0 0 0;
        }

        .masail-description {
            font-size: 13px;
            color: #7F8C8D;
            line-height: 1.5;
            margin: 2px 0 0 0;
        }

        .masail-meta-row {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #7F8C8D;
            flex-wrap: nowrap;
            padding-top: 8px;
            border-top: 1px solid #F0F0F0;
            margin-top: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .masail-meta-row::-webkit-scrollbar { display: none; }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .meta-item i {
            color: #2ECC71;
            font-size: 12px;
            width: 14px;
            text-align: center;
        }

        .masail-actions {
            display: flex;
            gap: 6px;
            justify-content: space-between;
            padding-top: 4px;
            flex-wrap: nowrap;
        }

        .action-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #95A5A6;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 500;
            padding: 4px 6px;
            border-radius: 4px;
            white-space: nowrap;
            flex: 1;
            justify-content: center;
            min-width: 0;
        }

        .action-btn:hover {
            color: #2ECC71;
            background: rgba(46, 204, 113, 0.08);
            transform: translateX(2px);
        }

        .action-btn i {
            font-size: 13px;
            color: #2ECC71;
        }

        @media (max-width: 360px) {
            .masail-actions { gap: 2px; }
            .action-btn { font-size: 11px; padding: 4px 3px; gap: 4px; }
            .masail-meta-row { gap: 10px; }
        }

        /* ========== DETAIL VIEW (ANSWER PAGE) ========== */
        .detail-view {
            display: none;
            background: linear-gradient(135deg, #F8F7F4 0%, #EFF5F8 100%);
            padding: 20px 16px 40px;
            animation: slideIn 0.3s ease;
        }

        .detail-view.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            background: #FFFFFF;
            color: #1B3A5C;
            border: 1px solid #E4EEE6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            margin-bottom: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(27, 58, 92, 0.06);
        }

        .back-btn:hover {
            transform: translateX(-4px);
            box-shadow: 0 4px 12px rgba(27, 58, 92, 0.12);
        }

        .card {
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(27, 58, 92, 0.08);
            padding: 22px 20px;
            margin-bottom: 18px;
        }

        .masail-title-main {
            font-size: 21px;
            font-weight: 800;
            color: #1B8A4A;
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .question-label { font-weight: 700; color: #1B3A5C; }
        .question-number { color: #D4A574; font-weight: 700; }

        .question-text {
            font-size: 15px;
            line-height: 1.85;
            color: #2C3E50;
            text-align: justify;
        }

        .meta-row {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            margin: 18px 0 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .meta-row::-webkit-scrollbar { display: none; }

        .meta-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #34495E;
            background: #F4F8F5;
            border: 1px solid #E4EEE6;
            padding: 8px 14px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .meta-pill i { color: #2ECC71; font-size: 13px; }

        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid #F0F0F0;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .action-row::-webkit-scrollbar { display: none; }

        .pill-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #1B8A4A;
            background: #F4F8F5;
            border: 1px solid #DCEEE0;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .pill-btn:hover { background: #E6F5EA; }

        .icon-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #F4F8F5;
            border: 1px solid #DCEEE0;
            color: #1B8A4A;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: #E6F5EA; }

        .bookmark-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #7F8C8D;
            background: transparent;
            border: 1px solid #EAEAEA;
            cursor: pointer;
            font-family: inherit;
            padding: 9px 12px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bookmark-btn:hover { color: #D4A574; border-color: #D4A574; }

        @media (max-width: 380px) {
            .action-row { gap: 5px; }
            .pill-btn, .bookmark-btn { font-size: 12px; padding: 8px 9px; }
            .pill-btn span, .bookmark-btn span { display: inline; }
            .meta-row { gap: 8px; }
            .meta-pill { font-size: 12px; padding: 7px 10px; }
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #1B8A4A;
            margin-bottom: 16px;
        }

        .arabic-box {
            background: linear-gradient(135deg, rgba(27, 58, 92, 0.04) 0%, rgba(46, 204, 113, 0.06) 100%);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .arabic-box p {
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            font-size: 18px;
            line-height: 1.55;
            color: #1B3A5C;
            direction: rtl;
        }

        .ref-button-row {
            display: flex;
            justify-content: center;
            margin: 18px 0 16px;
        }

        .ref-main-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #1B8A4A 0%, #27AE60 100%);
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 138, 74, 0.2);
        }

        .ref-main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(27, 138, 74, 0.3);
            background: linear-gradient(135deg, #16733E 0%, #229954 100%);
        }

        .ref-main-btn i {
            font-size: 15px;
        }

        .answer-text p {
            font-size: 15px;
            line-height: 1.9;
            color: #2C3E50;
            text-align: justify;
            margin-bottom: 16px;
        }

        /* ========== ARABIC QUOTE LINE ========== */
        .arabic-line {
            display: inline-block;
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            font-size: 19px;
            line-height: 2;
            color: #1B3A5C;
            direction: rtl;
        }

        /* ========== REFERENCE ICON (hides raw references, opens popup) ========== */
        .ref-icon-btn,
        .ref-line-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            vertical-align: middle;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .ref-icon-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.12);
            color: #1B8A4A;
            font-size: 11px;
            margin: 0 2px;
            transition: all 0.25s ease;
        }

        .ref-icon-btn:hover {
            background: #2ECC71;
            color: #fff;
            transform: scale(1.08);
        }

        .ref-line-wrap {
            display: block;
            text-align: right;
            margin: 2px 0 6px;
        }

        .ref-line-btn {
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(27, 58, 92, 0.06);
            color: #1B3A5C;
            font-size: 12px;
            font-weight: 700;
        }

        .ref-line-btn:hover {
            background: #1B3A5C;
            color: #fff;
        }

        /* ========== REFERENCE POPUP MODAL ========== */
        .ref-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27, 58, 92, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
            z-index: 999;
            padding: 20px;
        }

        .ref-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .ref-modal {
            background: #fff;
            width: 100%;
            max-width: 360px;
            max-height: 75vh;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .ref-modal-overlay.active .ref-modal {
            transform: scale(1);
        }

        .ref-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1B3A5C 0%, #2C5282 100%);
            color: #fff;
            flex-shrink: 0;
        }

        .ref-modal-header span {
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ref-modal-close {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 0;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ref-modal-close:hover { background: rgba(255, 255, 255, 0.3); }

        .ref-modal-body {
            padding: 14px 16px 18px;
            overflow-y: auto;
        }

        .ref-item {
            background: #F8F7F4;
            border-radius: 10px;
            padding: 14px 14px 12px;
            margin-bottom: 12px;
        }

        .ref-item:last-child { margin-bottom: 0; }

        .ref-item-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .ref-item-type {
            font-size: 11px;
            font-weight: 800;
            color: #1B8A4A;
            background: rgba(46, 204, 113, 0.12);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .ref-copy-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            border: none;
            background: transparent;
            color: #1B3A5C;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .ref-copy-btn:hover { background: rgba(27, 58, 92, 0.08); }

        .ref-all-copy-container {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .ref-copy-all-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            background: linear-gradient(135deg, #1B8A4A 0%, #27AE60 100%);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            padding: 11px 18px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 138, 74, 0.2);
        }

        .ref-copy-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(27, 138, 74, 0.3);
            background: linear-gradient(135deg, #16733E 0%, #229954 100%);
        }

        .ref-copy-all-btn i {
            font-size: 14px;
        }

        .ref-item-arabic {
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            font-size: 18px;
            line-height: 1.9;
            color: #1B3A5C;
            direction: rtl;
            margin-bottom: 8px;
        }

        .ref-item-text {
            font-size: 14px;
            color: #2C3E50;
            line-height: 1.7;
            word-break: break-word;
        }

        .ref-empty {
            text-align: center;
            color: #95A5A6;
            font-size: 13px;
            padding: 24px 10px;
        }

        .ref-final-row { margin-top: 14px; }

        .info-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 14px 0;
            border-top: 1px solid #E4EEE6;
            border-bottom: 1px solid #E4EEE6;
            margin: 16px 0;
            font-size: 12px;
            color: #34495E;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .footer-item.answerer-info strong {
            color: #1B3A5C;
            font-weight: 700;
            margin-right: 4px;
        }

        .footer-item.answerer-info span {
            color: #7F8C8D;
            font-size: 11px;
        }

        .footer-item i {
            color: #2ECC71;
            font-size: 12px;
        }

        .footer-divider {
            color: #BDC3C7;
            font-size: 10px;
        }

        .footer-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4F8F5;
            border: 1px solid #DCEEE0;
            border-radius: 6px;
            cursor: pointer;
            color: #2ECC71;
            font-size: 13px;
            transition: all 0.2s ease;
            padding: 0;
        }

        .footer-btn:hover {
            background: #E6F5EA;
            transform: scale(1.08);
        }

        .tags-inline {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .answerer-box {
            display: none;
        }

        .meta-row {
            display: none;
        }

        .action-row {
            display: none;
        }

        .tags-wrap {
            display: none;
        }

        .ref-final-row {
            display: none;
        }

        .tags-wrap {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0 0;
        }

        .tags-label { font-size: 13px; font-weight: 700; color: #7F8C8D; white-space: nowrap; }

        .tags-row { display: flex; flex-wrap: wrap; gap: 8px; }

        .tag-pill {
            font-size: 11px;
            color: #34495E;
            background: #F4F4F4;
            border: 1px solid #E8E8E8;
            padding: 4px 10px;
            border-radius: 14px;
            white-space: nowrap;
        }

        .tags-inline .tag-pill {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .comments-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 800;
            color: #1B8A4A;
            margin-bottom: 16px;
        }

        .comments-empty {

                fullAnswer: 'সুস্বাস্থ্য আল্লাহর একটি বড় নেয়ামত। রাসুল (স.) বলেছেন দুটি নেয়ামত অনেকেই পরিত্যাগ করে: স্বাস্থ্য এবং অবসর।\n\nসুস্বাস্থ্য রক্ষার জন্য: সময়মতো খাওয়া, নিয়মিত ব্যায়াম করা, পর্যাপ্ত ঘুম নেওয়া এবং পরিচ্ছন্নতা বজায় রাখা জরুরি।\n\nইসলাম পরিচ্ছন্নতাকে অর্ধেক ঈমান বলেছে এবং রোগ প্রতিরোধে উৎসাহিত করেছে।'

        ];

        // শুধুমাত্র সাধারণ সংখ্যা প্রদর্শন - Devanagari সংখ্যা নেই
        function convertToBangla(num) {
            return num.toString();
        }

        // ================== প্রতিটি প্রশ্ন-উত্তরের জন্য আলাদা URL (SEO) ==================
        const originalTitle = document.title;
        const originalMetaDescription = (document.querySelector('meta[name="description"]') || {}).content || '';

        // পেজ লোড হওয়ার সময় বর্তমান URL দেখে "লিস্টিং পেজ"-এর বেস পাথ বের করা।
        // যদি সরাসরি কোনো মাসআলার পার্মালিংকে (যেমন /frontend/masayel/163239/স্লাগ) লোড হয়,
        // তাহলে সংখ্যা ও স্লাগ অংশ বাদ দিয়ে বেস পাথ ঠিক করা হয়, যাতে "masail" নামের কোনো
        // অতিরিক্ত অংশ URL-এ যোগ না হয়।
        function computeBasePath() {
            const segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length >= 2 && /^[0-9]+$/.test(segments[segments.length - 2])) {
                segments.pop(); // স্লাগ
                segments.pop(); // সংখ্যা
            } else if (segments.length >= 1 && /^[0-9]+$/.test(segments[segments.length - 1])) {
                segments.pop(); // শুধু সংখ্যা (স্লাগ ছাড়া)
            }
            return '/' + segments.join('/') + (segments.length ? '/' : '');
        }

        const basePath = computeBasePath();

        // শিরোনাম থেকে URL-friendly স্লাগ তৈরি, যেমন "কনের বাড়ীর দাওয়াত প্রসঙ্গ" -> "কনের-বাড়ীর-দাওয়াত-প্রসঙ্গ"
        function slugify(text) {
            return String(text)
                .trim()
                .replace(/[?,।:;!"'’‘""()]/g, '')
                .replace(/\s+/g, '-');
        }

        function setMetaDescription(content) {
            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) {
                metaDesc = document.createElement('meta');
                metaDesc.setAttribute('name', 'description');
                document.head.appendChild(metaDesc);
            }
            metaDesc.setAttribute('content', content || '');
        }

        // ================== রেফারেন্স (আয়াত/হাদিস/কিতাব) গোপন রেখে আইকনে দেখানোর সিস্টেম ==================
        // বর্তমানে প্রদর্শিত উত্তরের রেফারেন্সগুলো এখানে জমা থাকে; প্রতিটি আইটেম একটি আইকনের সাথে যুক্ত
        let currentRefs = [];

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // একটি রেফারেন্স গ্রুপ যোগ করে তার ইনডেক্স রিটার্ন করে (গ্রুপে একাধিক আইটেম থাকতে পারে, যেমন একাধিক কিতাবের রেফারেন্স একসাথে)
        function pushRefGroup(items) {
            currentRefs.push(items);
            return currentRefs.length - 1;
        }

        // fullAnswer টেক্সট প্রসেস করে আয়াত/হাদিস/কিতাবের সকল দলিল ও হাওলা উত্তরের ভেতর থেকে
        // সম্পূর্ণ সরিয়ে ফেলে (কোনো আইকন/বাটনও রাখা হয় না) এবং আলাদাভাবে currentRefs-এ জমা রাখে,
        // যা পুরো পেজের একদম শেষে একটিমাত্র "রেফারেন্স" আইকনে ক্লিক করলে পপআপে দেখানো হয়।
        function renderAnswerWithHiddenReferences(text) {
            currentRefs = [];

            const ayatLineRegex = /^স[ূু]রা[^\n]*আয়াত\s*[:：]?\s*[০-৯0-9]+\.?$/;
            const hadithLineRegex = /হাদী[সছ][^০-৯0-9]*[:：]?\s*[০-৯0-9]+\.?$/;
            const inlineRefRegex = /\(([^()]*(?:স[ূু]রা|আয়াত|হাদীস|হাদিস|বুখারী|মুসলিম|তিরমিযি|আবু দাউদ|ইবনে মাজাহ|মুসনাদ)[^()]*)\)/g;

            const paragraphs = text.split('\n\n').map(paragraph => {
                const lines = paragraph.split('\n');
                const outLines = [];
                let pendingArabic = null; // ঠিক আগের লাইনে পাওয়া আরবি আয়াত/হাদিসের মূল উদ্ধৃতি, রেফারেন্স লাইনের অপেক্ষায়

                lines.forEach(rawLine => {
                    const trimmed = rawLine.trim();

                    // ০) আরবি উদ্ধৃতি লাইন (আয়াত/হাদিসের মূল আরবি টেক্সট) - উত্তরে দেখানো হবে না,
                    //    পরের লাইনের রেফারেন্সের সাথে একত্রে জমা রাখা হলো
                    const arabicLineMatch = trimmed.match(/^<span class=["']arabic-line["']>([\s\S]*)<\/span>$/);
                    if (arabicLineMatch) {
                        pendingArabic = arabicLineMatch[1];
                        return;
                    }

                    // ১) আয়াত বা হাদিসের রেফারেন্স লাইন - ঠিক আগের আরবি উদ্ধৃতির সাথে মিলিয়ে
                    //    একটি সম্পূর্ণ দলিল (আরবি + উৎস) হিসেবে জমা রাখা হলো, উত্তরে দেখানো হবে না
                    const isAyatLine = ayatLineRegex.test(trimmed);
                    const isHadithLine = /হাদী[সছ]/.test(trimmed) && /নম্বর/.test(trimmed);

                    if (isAyatLine || isHadithLine) {
                        pushRefGroup([{
                            type: isAyatLine ? 'আয়াত রেফারেন্স' : 'হাদিস রেফারেন্স',
                            arabic: pendingArabic || null,
                            source: trimmed
                        }]);
                        pendingArabic = null;
                        return;
                    }

                    // ২) সম্পূর্ণ লাইন জুড়ে বন্ধনীতে থাকা কিতাব/সূত্র রেফারেন্স, যেমন: (কিতাব ১: ৮/৫৪৮; কিতাব ২: ৯/৪৬৫৮) - সংগ্রহ করে রাখা হলো, উত্তরে দেখানো হবে না
                    const fullParenMatch = trimmed.match(/^\((.+)\)$/);
                    if (fullParenMatch && /[:：]/.test(fullParenMatch[1])) {
                        const items = fullParenMatch[1]
                            .split(';')
                            .map(s => s.trim())
                            .filter(Boolean)
                            .map(s => ({ type: 'কিতাব রেফারেন্স', source: s }));
                        pushRefGroup(items);
                        return;
                    }

                    // ৩) স্বাভাবিক বাক্যের ভেতরে ইনলাইন বন্ধনীযুক্ত রেফারেন্স, যেমন: (সূরা আনফাল: ৭২) - সংগ্রহ করে বাক্য থেকে সরিয়ে ফেলা হলো
                    const processedLine = rawLine
                        .replace(inlineRefRegex, (match, inner) => {
                            pushRefGroup([{ type: 'রেফারেন্স', source: inner.trim() }]);
                            return '';
                        })
                        .replace(/\s+([।,.!?])/g, '$1')
                        .replace(/[ \t]{2,}/g, ' ')
                        .trimEnd();

                    if (processedLine.trim()) {
                        outLines.push(processedLine);
                    }
                });

                if (!outLines.length) return ''; // যে প্যারাগ্রাফে শুধু আরবি উদ্ধৃতি/রেফারেন্স ছিল, উত্তরে তার জন্য ফাঁকা প্যারাগ্রাফ দেখানো হবে না

                return `<p>${outLines.join('<br>')}</p>`;
            });

            return paragraphs.filter(Boolean).join('');
        }

        // পুরো উত্তরের সকল দলিল/হাওলা একসাথে পপআপে দেখানো (একদম শেষের একটিমাত্র রেফারেন্স আইকনে ক্লিক করলে)
        function openRefPopup() {
            const body = document.getElementById('refModalBody');

            if (!currentRefs.length) {
                body.innerHTML = '<div class="ref-empty">এই উত্তরের জন্য কোনো রেফারেন্স যোগ করা হয়নি।</div>';
            } else {
                let refHtml = `
                    <div class="ref-all-copy-container">
                        <button type="button" class="ref-copy-all-btn" onclick="copyAllReferences()">
                            <i class="fas fa-copy"></i><span>সকল রেফারেন্স কপি করুন</span>
                        </button>
                    </div>
                `;
                
                refHtml += currentRefs.map((group, gIdx) => group.map((item, iIdx) => `
                    <div class="ref-item">
                        <div class="ref-item-top">
                            <span class="ref-item-type">${escapeHtml(item.type)}</span>
                        </div>
                        ${item.arabic ? `<div class="ref-item-arabic">${escapeHtml(item.arabic)}</div>` : ''}
                        <div class="ref-item-text">${escapeHtml(item.source)}</div>
                    </div>
                `).join('')).join('');
                
                body.innerHTML = refHtml;
            }

            document.getElementById('refModalOverlay').classList.add('active');
        }

        // সব রেফারেন্স একসাথে কপি করুন
        function copyAllReferences() {
            if (!currentRefs.length) return;
            
            let allText = [];
            currentRefs.forEach(group => {
                group.forEach(item => {
                    if (item.arabic) {
                        allText.push(`${item.arabic}\n(${item.source})`);
                    } else {
                        allText.push(item.source);
                    }
                });
            });
            
            const fullText = allText.join('\n\n');
            const btn = document.querySelector('.ref-copy-all-btn');

            const finishCopy = () => {
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i><span>কপি হয়েছে</span>';
                setTimeout(() => { btn.innerHTML = original; }, 1500);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(finishCopy).catch(() => {
                    fallbackCopy(fullText);
                    finishCopy();
                });
            } else {
                fallbackCopy(fullText);
                finishCopy();
            }
        }

        // পুরনো ব্রাউজারের জন্য কপি করার বিকল্প পদ্ধতি
        function fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(temp);
        }

        // লিস্ট তৈরি করুন
        function createMasailList(dataToRender = masailsData) {
            const listContainer = document.getElementById('masailList');
            listContainer.innerHTML = '';

            if (dataToRender.length === 0) {
                listContainer.innerHTML = '<li style="text-align:center; padding:16px 10px; color:#95A5A6;">কোনো ফলাফল পাওয়া যায়নি</li>';
                return;
            }

            dataToRender.forEach(masail => {
                const li = document.createElement('li');
                li.className = 'masail-item';

                li.innerHTML = `

                            <div class="masail-title">${masail.title}</div>

                    </div>
                    
                    <div class="masail-meta-row">
                        <div class="meta-item">
                            <i class="far fa-calendar"></i>
                            <span>${convertToBangla(masail.date.split(' ')[0])} ${masail.date.split(' ').slice(1).join(' ')}</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${masail.location}</span>
                        </div>
                    </div>

                    <div class="masail-actions">
                        <button class="action-btn">
                            <i class="far fa-eye"></i>
                            <span>দেখেছেন ${convertToBangla(masail.views)}</span>
                        </button>
                        <button class="action-btn">
                            <i class="far fa-comment"></i>
                            <span>মন্তব্য ${convertToBangla(masail.comments)}</span>
                        </button>
                        <button class="action-btn">
                            <i class="far fa-heart"></i>
                            <span>পছন্দ ${convertToBangla(masail.likes)}</span>
                        </button>
                    </div>
                `;

                listContainer.appendChild(li);
            });
        }

        // বিস্তারিত (উত্তর) ভিউ দেখান — নেভবার, ফুটার ও ব্যানার ছাড়া
        function showDetail(id, skipUrlUpdate = false) {
            const masail = masailsData.find(m => m.id === id);
            if (!masail) return;

            const dateParts = masail.date.split(' ');
            const dateStr = `${convertToBangla(dateParts[0])} ${dateParts.slice(1).join(' ')}`;

            const answerParagraphs = renderAnswerWithHiddenReferences(masail.fullAnswer);

            const tags = masail.tags || ['সাধারণ মাসআলা'];
            const tagsHtml = tags.map(t => `<span class="tag-pill">${t}</span>`).join('');

            // সম্পর্কিত প্রশ্ন (একই বিষয়ের ট্যাগ মিললে অগ্রাধিকার, নাহলে সাম্প্রতিক অন্য প্রশ্ন)
            const others = masailsData.filter(m => m.id !== masail.id);
            const related = others
                .sort((a, b) => {
                    const aMatch = (a.tags || []).some(t => tags.includes(t)) ? 1 : 0;
                    const bMatch = (b.tags || []).some(t => tags.includes(t)) ? 1 : 0;
                    return bMatch - aMatch;
                })
                .slice(0, 4);

            const relatedHtml = related.map(m => {
                const dParts = m.date.split(' ');
                const dStr = `${convertToBangla(dParts[0])} ${dParts.slice(1).join(' ')}`;
                return `
                <li class="related-item" onclick="showDetail(${m.id})">
                    <div class="related-top-row">
                        <span class="related-number">${convertToBangla(m.number)}</span>
                        <i class="fas fa-chevron-right related-arrow"></i>
                    </div>
                    <div class="related-title">${m.title}</div>
                    <div class="related-answerer"><i class="far fa-user"></i><span>উত্তর দিয়েছেন: ${m.answerer}</span></div>
                    <div class="related-meta-row">
                        <div class="meta-item"><i class="far fa-calendar"></i><span>${dStr}</span></div>
                        <div class="meta-item"><i class="fas fa-map-marker-alt"></i><span>${m.location}</span></div>
                    </div>
                </li>`;
            }).join('');

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="card">
                    <div class="masail-title-main">${masail.title}</div>
                    <div class="question-text">
                        <span class="question-label">প্রশ্নঃ</span>
                        <span class="question-number">${convertToBangla(masail.number)}.</span>
                        ${masail.question}
                    </div>
                </div>

                <div class="card">
                    <div class="section-heading"><i class="far fa-comment-dots"></i><span>উত্তর</span></div>
                    <div class="arabic-box">
                        <p>وَ عَلَيْكُـمُ السَّلَام وَرَحْمَةُ اللَّٰهِ وَبَرَكَاتُهُ<br>بِسْمِ اللَّٰهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
                    </div>
                    <div class="answer-text">${answerParagraphs}</div>

                    <div class="ref-button-row">
                        <button class="ref-main-btn" onclick="openRefPopup()"><i class="fas fa-book-quran"></i><span>রেফারেন্স</span></button>
                    </div>

                    <div class="info-footer">
                        <div class="footer-item answerer-info">
                            <strong>${masail.answerer}</strong>
                            <span>${masail.answererTitle}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <div class="footer-item">
                            <i class="far fa-calendar"></i> <span>${dateStr}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <div class="footer-item">
                            <i class="fas fa-map-marker-alt"></i> <span>${masail.location}</span>
                        </div>
                        <div class="footer-divider">|</div>
                        <button class="footer-btn" title="শেয়ার করুন" onclick="shareMasail(${masail.id})"><i class="fas fa-share-alt"></i></button>
                        <button class="footer-btn" title="প্রিন্ট করুন" onclick="window.print()"><i class="fas fa-print"></i></button>
                        <button class="footer-btn" title="বুকমার্ক করুন"><i class="far fa-bookmark"></i></button>
                        <div style="margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                            <span style="font-size: 11px; color: #7F8C8D; white-space: nowrap;">ট্যাগ:</span>
                            <div class="tags-inline">${tagsHtml}</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="comments-header"><i class="far fa-comment"></i><span>মন্তব্য (০)</span></div>
                    <div class="comments-empty">কোনো মন্তব্য নেই। প্রথম মন্তব্য করুন!</div>
                    <div class="login-prompt">
                        <i class="far fa-comment-dots"></i>
                        <p>মন্তব্য করতে লগইন করুন</p>
                        <button class="login-btn">লগইন করুন</button>
                    </div>
                </div>

                <div class="related-heading">এ সম্পর্কিত আরও জিজ্ঞাসা/প্রশ্ন-উত্তর</div>
                <ul class="related-list">${relatedHtml}</ul>
            `;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo(0, 0);

            // প্রতিটি প্রশ্ন-উত্তরের জন্য আলাদা, SEO-বান্ধব URL: {বেসপাথ}/{number}/{slug}
            document.title = `${masail.title} - মাসআলা`;
            setMetaDescription(masail.description || (masail.question || '').slice(0, 155));
            if (!skipUrlUpdate) {
                const url = basePath + `${encodeURIComponent(masail.number)}/${slugify(masail.title)}`;
                history.pushState({ masailId: masail.id }, '', url);
            }
        }

        // শেয়ার / কপি লিংক
        function shareMasail(id) {
            const masail = masailsData.find(m => m.id === id);
            const shareText = masail ? `${masail.title} - প্রশ্ন নম্বরঃ ${masail.number}` : document.title;
            if (navigator.share) {
                navigator.share({ title: shareText, url: window.location.href }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText + ' — ' + window.location.href);
                alert('লিংক কপি করা হয়েছে!');
            }
        }

        // ফিরে যান
        function backToList(skipUrlUpdate = false) {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailView').classList.remove('active');
            document.title = originalTitle;
            setMetaDescription(originalMetaDescription);
            if (!skipUrlUpdate) {
                history.pushState({}, '', basePath);
            }
        }

        // বর্তমান URL অনুযায়ী সঠিক পেজ (তালিকা বা নির্দিষ্ট মাসআলা) দেখানো
        function routeFromLocation() {
            const path = window.location.pathname;
            if (path.indexOf(basePath) === 0) {
                const rest = path.slice(basePath.length).replace(/^\/+|\/+$/g, '');
                if (rest) {
                    const number = decodeURIComponent(rest.split('/')[0]);
                    if (/^[0-9]+$/.test(number)) {
                        const masail = masailsData.find(m => m.number === number);
                        if (masail) {
                            showDetail(masail.id, true);
                            return;
                        }
                    }
                }
            }
            backToList(true);
        }

        window.addEventListener('popstate', routeFromLocation);

        // সার্চ কার্যকর করা
        function filterMasail(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                createMasailList(masailsData);
                return;
            }
            const filtered = masailsData.filter(masail =>
                masail.title.toLowerCase().includes(q) ||
                masail.description.toLowerCase().includes(q) ||
                masail.fullAnswer.toLowerCase().includes(q) ||
                masail.answerer.toLowerCase().includes(q) ||
                masail.location.toLowerCase().includes(q) ||
                masail.number.includes(q)
            );
            createMasailList(filtered);
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const micBtn = document.getElementById('micBtn');

            searchInput.addEventListener('input', (e) => {
                filterMasail(e.target.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterMasail(searchInput.value);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                filterMasail('');
                searchInput.focus();
            });

            // মাইক দিয়ে ভয়েস সার্চ (যদি ব্রাউজার সমর্থন করে) - বলার সাথে সাথে অটো সার্চ হবে
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.interimResults = true;   // বলার সময়ই ফলাফল আসতে থাকবে
                recognition.continuous = true;        // থামা পর্যন্ত শুনতে থাকবে
                recognition.maxAlternatives = 1;

                let listening = false;

                micBtn.addEventListener('click', () => {
                    if (listening) {
                        recognition.stop();
                        return;
                    }
                    try {
                        recognition.start();
                    } catch (e) {
                        // already started guard
                    }
                });

                recognition.addEventListener('start', () => {
                    listening = true;
                    micBtn.style.background = '#E74C3C';
                    micBtn.classList.add('listening');
                });

                recognition.addEventListener('result', (event) => {
                    let transcript = '';
                    for (let i = 0; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    searchInput.value = transcript;
                    filterMasail(transcript);   // বলার সাথে সাথে অটো সার্চ
                });

                recognition.addEventListener('end', () => {
                    listening = false;
                    micBtn.style.background = '';
                    micBtn.classList.remove('listening');
                });

                recognition.addEventListener('error', () => {
                    listening = false;
                    micBtn.style.background = '';
                    micBtn.classList.remove('listening');
                });
            } else {
                micBtn.addEventListener('click', () => {
                    alert('আপনার ব্রাউজার ভয়েস সার্চ সমর্থন করে না। অনুগ্রহ করে Chrome ব্রাউজার ব্যবহার করুন।');
                });
            }
        }

        // প্রাথমিক লোড
        window.addEventListener('DOMContentLoaded', () => {
            createMasailList();
            setupSearch();
            routeFromLocation();
        });
    </script>

      <!-- Navbar Loader -->
<script src="navbar/navbar-loader.js"></script>

</body>
