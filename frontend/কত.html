<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নামাজের সময়সূচী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --gold: #f2c96b;
    --gold-soft: #e6c27a;
    --panel-bg: rgba(20,26,38,0.55);
    --border-soft: rgba(255,255,255,0.12);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:100vh;
    background:#0b0e14;
    font-family:'Noto Sans Bengali', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .widget{
    transform-origin: top center;
    width:1024px;
    min-width:1024px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06), transparent 55%),
      linear-gradient(180deg, #1b2130 0%, #12161f 55%, #0c0f16 100%);
    color:#f3e9d3;
    border-radius:6px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.06);
  }

  /* Top date bar */
  .date-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 34px 6px;
    font-size:20px;
    font-weight:600;
    color:var(--gold-soft);
    letter-spacing:0.5px;
  }

  /* Sun / arc section */
  .sun-section{
    position:relative;
    padding:6px 20px 8px;
    text-align:center;
  }

  .arc-wrap{
    position:relative;
    height:190px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }

  /* Earth at center but positioned so only top half/crown is visible */
  .earth-img{
    position:absolute;
    left:50%;
    top:20%;
    width:600px;
    height:600px;
    transform:translate(-50%, 0%);
    z-index:10;
    pointer-events:none;
    filter: drop-shadow(0 0 30px rgba(100,150,200,0.4));
    border-radius:50%;
  }

  /* Orbital path visualization - hidden */
  .orbital-ring{
    position:absolute;
    left:50%;
    top:0%;
    width:560px;
    height:560px;
    border:none;
    border-radius:50%;
    transform:translate(-50%, 0%);
    z-index:5;
    display:none;
  }

  /* the sun orbits around the Earth's center */
  .sun-img{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:100px;
    height:100px;
    z-index:8;
    filter:
      drop-shadow(0 0 18px rgba(255,200,90,0.85))
      drop-shadow(0 0 46px rgba(255,150,40,0.55))
      drop-shadow(0 0 90px rgba(255,120,20,0.3));
  }

  #moonIcon{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:56px;
    color:#eef1fb;
    z-index:8;
    text-shadow:
      0 0 20px rgba(210,220,255,0.8),
      0 0 46px rgba(160,180,255,0.45);
  }

  .loading-note{
    text-align:center;
    font-size:12px;
    color:#8a93a8;
    padding:6px 0 0;
  }

  .next-prayer-info{
    position:absolute;
    left:50%;
    top:8px;
    transform:translateX(-50%);
    text-align:center;
    z-index:3;
  }

  .next-prayer-label{
    font-size:22px;
    font-weight:600;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    white-space:nowrap;
  }

  .next-prayer-sub{
    font-size:18px;
    color:var(--gold-soft);
    margin-top:4px;
    font-weight:600;
  }

  .countdown{
    font-size:40px;
    font-weight:800;
    color:#fff3d6;
    letter-spacing:2px;
    margin-top:6px;
    text-shadow:0 0 18px rgba(255,210,120,0.35);
  }

  /* Prayer times row */
  .prayer-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:44px;
    padding:14px 20px 22px;
    flex-wrap:wrap;
    background:transparent;
  }

  .prayer-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:700;
    color:#f6efdc;
  }

  .prayer-item i{
    color:#ffd97a;
    font-size:18px;
  }

  .prayer-item .moon-icon{
    color:#dfe6f5;
  }

  /* Bottom info bar */
  .info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel-bg);
    border-top:1px solid var(--border-soft);
    padding:12px 30px;
    white-space:nowrap;
    overflow:hidden;
    gap:22px;
    width:100%;
  }

  .location-block{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    color:#c9cbd4;
    font-weight:500;
    min-width:0;
    flex-shrink:1;
  }

  .location-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:19px;
    font-weight:700;
    color:#fff;
    flex-shrink:0;
  }

  .location-name i{
    color:#ff6b6b;
  }

  .dot-sep{
    color:#888;
  }

  .right-block{
    display:flex;
    align-items:center;
    gap:22px;
    flex-shrink:0;
  }

  .sun-times{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .sun-times .row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    font-weight:600;
    color:#f0e6ce;
  }

  .sun-times i{
    font-size:15px;
    color:#ffd97a;
  }

  .sun-times .fa-moon{
    color:#dfe6f5;
  }

  .weather-block{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:20px;
    font-weight:700;
    color:#fff;
  }

  .weather-block i{
    font-size:26px;
    color:#9fc6ff;
  }

</style>
</head>
<body>

<div class="stage">
<div class="widget">

  <!-- Top date row -->
  <div class="date-bar">
    <span id="islamicDate">১৫ রবিউস সানি ১৪৪৬</span>
    <span id="gregorianDate">১৯ অক্টোবর ২০২৪</span>
    <span id="banglaDate">৩ কার্তিক ১৪৩১</span>
  </div>

  <!-- Sun arc + next prayer -->
  <div class="sun-section">
    <div class="next-prayer-info">
      <div class="next-prayer-label">
        <i class="fa-solid fa-sun"></i>
        <span id="nextPrayerName">পরবর্তী নামাজ: আসর</span>
      </div>
      <div class="next-prayer-sub" id="nextPrayerSub">আসর হতে বাকি:</div>
      <div class="countdown" id="countdown">০২:৫৪:৪৩</div>
    </div>

    <div class="arc-wrap">
      <!-- Orbital ring - shows the path the sun takes around Earth -->
      <div class="orbital-ring"></div>
      
      <!-- Earth at center - geocentric view -->
      <img src="assets/EarthfromSpace.png" alt="Earth" class="earth-img">

      <!-- the sun, orbiting around the Earth's center according to real elapsed time between sunrise and sunset -->
      <img src="assets/RealisticSun.png" alt="Sun" class="sun-img" id="sunImg">
      <i class="fa-solid fa-moon" id="moonIcon" style="display:none;"></i>
    </div>
  </div>

  <!-- Prayer times -->
  <div class="prayer-row">
    <div class="prayer-item"><i class="fa-solid fa-sun"></i> <span id="fajrTime">ফজর: ১২:০৬</span></div>
    <div class="prayer-item"><i class="fa-solid fa-sun"></i> <span id="asrTime">আসর: ০৮:৪৩</span></div>
    <div class="prayer-item"><i class="fa-solid fa-sun"></i> <span id="maghribTime">মাগরিব: ০৬:৪২</span></div>
    <div class="prayer-item"><i class="fa-solid fa-moon moon-icon"></i> <span id="ishaTime">ইশা: ০৮:৪২</span></div>
  </div>

  <!-- Bottom info bar -->
  <div class="info-bar">
    <div class="location-block">
      <div class="location-name"><i class="fa-solid fa-location-dot"></i> <span id="cityName">Dhaka</span> <span class="dot-sep">•</span></div>
      <span class="location-coords" id="coordsText">Lat: 23.8103° N., Lon: 90.4 E</span>
      <span class="location-coords" id="altText">Alt: 7m</span>
    </div>

    <div class="right-block">
      <div class="sun-times">
        <div class="row"><i class="fa-solid fa-sun"></i> <span id="sunriseTime">সূর্যোদয়: ০৫:২৭</span></div>
        <div class="row"><i class="fa-solid fa-moon"></i> <span id="sunsetTime">সূর্যাস্ত: ০৬:৪২</span></div>
      </div>
      <div class="weather-block">
        <i class="fa-solid fa-cloud-showers-heavy" id="weatherIcon"></i>
        <span id="weatherText">২৮°C মেঘলা</span>
      </div>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  function toBn(num){ return String(num).replace(/[0-9]/g, d => bnDigits[d]); }
  function pad(n){ return n.toString().padStart(2,'0'); }

  const bnMonths = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  const bnDays   = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  const bnHijriMonths = ['মহররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
  const bnBanglaMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];

  function toBanglaDate(gDate){
    const y = gDate.getFullYear();
    const m = gDate.getMonth() + 1;
    const d = gDate.getDate();

    const afterNewYear = (m > 4 || (m === 4 && d >= 14));
    const bYear = afterNewYear ? (y - 593) : (y - 594);
    const startYear = afterNewYear ? y : (y - 1);
    const bnYearStart = new Date(startYear, 3, 14);
    const diffDays = Math.floor((gDate - bnYearStart) / 86400000);

    const nextGregYear = startYear + 1;
    const isLeap = (nextGregYear % 4 === 0 && (nextGregYear % 100 !== 0 || nextGregYear % 400 === 0));
    const monthLengths = [31,31,31,31,31,30,30,30,30,30,30, isLeap ? 31 : 30];

    let remaining = diffDays, monthIndex = 0;
    while (monthIndex < 11 && remaining >= monthLengths[monthIndex]) {
      remaining -= monthLengths[monthIndex];
      monthIndex++;
    }
    return { day: remaining + 1, month: bnBanglaMonths[monthIndex], year: bYear };
  }

  const weatherMap = {
    0:{icon:'fa-sun', text:'পরিষ্কার আকাশ'},
    1:{icon:'fa-cloud-sun', text:'কিছুটা মেঘলা'},
    2:{icon:'fa-cloud-sun', text:'আংশিক মেঘলা'},
    3:{icon:'fa-cloud', text:'মেঘলা'},
    45:{icon:'fa-smog', text:'কুয়াশা'},
    48:{icon:'fa-smog', text:'কুয়াশা'},
    51:{icon:'fa-cloud-rain', text:'গুঁড়ি বৃষ্টি'},
    53:{icon:'fa-cloud-rain', text:'গুঁড়ি বৃষ্টি'},
    55:{icon:'fa-cloud-rain', text:'গুঁড়ি বৃষ্টি'},
    56:{icon:'fa-cloud-rain', text:'হিমায়িত গুঁড়ি বৃষ্টি'},
    57:{icon:'fa-cloud-rain', text:'হিমায়িত গুঁড়ি বৃষ্টি'},
    61:{icon:'fa-cloud-showers-heavy', text:'বৃষ্টি'},
    63:{icon:'fa-cloud-showers-heavy', text:'বৃষ্টি'},
    65:{icon:'fa-cloud-showers-heavy', text:'ভারী বৃষ্টি'},
    66:{icon:'fa-cloud-showers-heavy', text:'হিমায়িত বৃষ্টি'},
    67:{icon:'fa-cloud-showers-heavy', text:'হিমায়িত বৃষ্টি'},
    71:{icon:'fa-snowflake', text:'তুষারপাত'},
    73:{icon:'fa-snowflake', text:'তুষারপাত'},
    75:{icon:'fa-snowflake', text:'ভারী তুষারপাত'},
    77:{icon:'fa-snowflake', text:'তুষারকণা'},
    80:{icon:'fa-cloud-showers-heavy', text:'বৃষ্টি'},
    81:{icon:'fa-cloud-showers-heavy', text:'বৃষ্টি'},
    82:{icon:'fa-cloud-showers-heavy', text:'ভারী বৃষ্টি'},
    85:{icon:'fa-snowflake', text:'তুষার বৃষ্টি'},
    86:{icon:'fa-snowflake', text:'তুষার বৃষ্টি'},
    95:{icon:'fa-bolt', text:'বজ্রঝড়'},
    96:{icon:'fa-bolt', text:'শিলাসহ ঝড়'},
    99:{icon:'fa-bolt', text:'শিলাসহ ঝড়'}
  };

  const els = {
    islamicDate: document.getElementById('islamicDate'),
    gregorianDate: document.getElementById('gregorianDate'),
    banglaDate: document.getElementById('banglaDate'),
    nextPrayerName: document.getElementById('nextPrayerName'),
    nextPrayerSub: document.getElementById('nextPrayerSub'),
    countdown: document.getElementById('countdown'),
    fajrTime: document.getElementById('fajrTime'),
    asrTime: document.getElementById('asrTime'),
    maghribTime: document.getElementById('maghribTime'),
    ishaTime: document.getElementById('ishaTime'),
    cityName: document.getElementById('cityName'),
    coordsText: document.getElementById('coordsText'),
    altText: document.getElementById('altText'),
    sunriseTime: document.getElementById('sunriseTime'),
    sunsetTime: document.getElementById('sunsetTime'),
    weatherIcon: document.getElementById('weatherIcon'),
    weatherText: document.getElementById('weatherText'),
    sunImg: document.getElementById('sunImg'),
    moonIcon: document.getElementById('moonIcon'),
    traversedPath: document.getElementById('traversedPath')
  };

  function fmt12(date){
    let h = date.getHours(), m = date.getMinutes();
    h = h % 12; if(h === 0) h = 12;
    return toBn(pad(h)) + ':' + toBn(pad(m));
  }

  function parseTimeToDate(timeStr, baseDate){
    const clean = timeStr.split(' ')[0];
    const [hh, mm] = clean.split(':').map(Number);
    const d = new Date(baseDate);
    d.setHours(hh, mm, 0, 0);
    return d;
  }

  function dateKey(d){
    return pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear();
  }

  async function fetchTimings(lat, lon, date){
    const url = `https://api.aladhan.com/v1/timings/${dateKey(date)}?latitude=${lat}&longitude=${lon}&method=2`;
    const res = await fetch(url);
    const json = await res.json();
    return json.data;
  }

  async function reverseGeocode(lat, lon){
    try{
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=bn`);
      const json = await res.json();
      return json.city || json.locality || json.principalSubdivision || 'অজানা এলাকা';
    }catch(e){ return 'Dhaka'; }
  }

  async function fetchWeather(lat, lon){
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    return await res.json();
  }

  function getOrbitalPosition(t){
    // Geocentric orbital view: sun orbits around Earth's visible crown
    // t = 0 is sunrise, t = 1 is sunset
    // Position sun in a semi-circular orbit around the top edge of visible Earth
    const centerX = 512;
    const centerY = 65;  // Center of Earth in arc-wrap viewport
    const radius = 65;  // Orbit radius - sun stays within arc-wrap bounds
    // Angle from 0 (right) to PI (left) as time progresses
    const angle = Math.PI * t;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY - radius * Math.sin(angle);
    return {x, y};
  }

  function bezierPoint(t){
    return getOrbitalPosition(t);
  }

  let state = {};

  async function init(){
    let lat = 23.8103, lon = 90.4125;

    try{
      const pos = await new Promise((resolve, reject) => {
        if(!navigator.geolocation) return reject();
        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:6000});
      });
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
    }catch(e){ /* keep Dhaka fallback */ }

    const today = new Date();
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);

    const [todayData, tomorrowData, cityName, weather] = await Promise.all([
      fetchTimings(lat, lon, today),
      fetchTimings(lat, lon, tomorrow),
      reverseGeocode(lat, lon),
      fetchWeather(lat, lon)
    ]);

    state = { lat, lon, todayData, tomorrowData, cityName, weather };
    render();
    setInterval(tick, 1000);
  }

  function render(){
    const { lat, lon, todayData, tomorrowData, cityName, weather } = state;
    const t = todayData.timings;
    const now = new Date();

    const g = todayData.date.gregorian;
    const h = todayData.date.hijri;
    const b = toBanglaDate(now);
    els.gregorianDate.textContent = `${toBn(parseInt(g.day))} ${bnMonths[parseInt(g.month.number)-1]} ${toBn(g.year)}, ${bnDays[now.getDay()]}`;
    els.islamicDate.textContent = `${toBn(parseInt(h.day))} ${bnHijriMonths[parseInt(h.month.number)-1]} ${toBn(h.year)}`;
    els.banglaDate.textContent = `${toBn(b.day)} ${b.month} ${toBn(b.year)}`;

    const fajr = parseTimeToDate(t.Fajr, now);
    const sunrise = parseTimeToDate(t.Sunrise, now);
    const dhuhr = parseTimeToDate(t.Dhuhr, now);
    const asr = parseTimeToDate(t.Asr, now);
    const sunset = parseTimeToDate(t.Sunset, now);
    const maghrib = parseTimeToDate(t.Maghrib, now);
    const isha = parseTimeToDate(t.Isha, now);
    const tomorrowBase = new Date(now.getTime() + 86400000);
    const fajrTomorrow = parseTimeToDate(tomorrowData.timings.Fajr, tomorrowBase);

    els.fajrTime.textContent = 'ফজর: ' + fmt12(fajr);
    els.asrTime.textContent = 'আসর: ' + fmt12(asr);
    els.maghribTime.textContent = 'মাগরিব: ' + fmt12(maghrib);
    els.ishaTime.textContent = 'ইশা: ' + fmt12(isha);
    els.sunriseTime.textContent = 'সূর্যোদয়: ' + fmt12(sunrise);
    els.sunsetTime.textContent = 'সূর্যাস্ত: ' + fmt12(sunset);

    els.cityName.textContent = cityName;
    els.coordsText.textContent = `Lat: ${lat.toFixed(4)}° N., Lon: ${lon.toFixed(4)}° E`;
    const alt = (weather && weather.elevation != null) ? Math.round(weather.elevation) : 0;
    els.altText.textContent = `Alt: ${alt}m`;

    const code = (weather && weather.current_weather) ? weather.current_weather.weathercode : 0;
    const wInfo = weatherMap[code] || {icon:'fa-cloud', text:'মেঘলা'};
    els.weatherIcon.className = 'fa-solid ' + wInfo.icon;
    const temp = (weather && weather.current_weather) ? Math.round(weather.current_weather.temperature) : 0;
    els.weatherText.textContent = `${toBn(temp)}°C ${wInfo.text}`;

    state.schedule = [
      {key:'Fajr', label:'ফজর', time: fajr},
      {key:'Dhuhr', label:'যোহর', time: dhuhr},
      {key:'Asr', label:'আসর', time: asr},
      {key:'Maghrib', label:'মাগরিব', time: maghrib},
      {key:'Isha', label:'ইশা', time: isha},
      {key:'Fajr', label:'ফজর', time: fajrTomorrow}
    ];
    state.sunrise = sunrise;
    state.sunset = sunset;

    tick();
  }

  function tick(){
    if(!state.schedule) return;
    const now = new Date();

    let idx = state.schedule.findIndex(p => p.time > now);
    if(idx === -1) idx = state.schedule.length - 1;
    const next = state.schedule[idx];
    const currentLabel = idx === 0 ? 'ইশা' : state.schedule[idx - 1].label;

    els.nextPrayerName.textContent = 'পরবর্তী নামাজ: ' + next.label;
    els.nextPrayerSub.textContent = currentLabel + ' শেষ হতে বাকি:';

    const diff = Math.max(0, next.time - now);
    const hh = Math.floor(diff / 3600000);
    const mm = Math.floor((diff % 3600000) / 60000);
    const ss = Math.floor((diff % 60000) / 1000);
    els.countdown.textContent = `${toBn(pad(hh))}:${toBn(pad(mm))}:${toBn(pad(ss))}`;

    const { sunrise, sunset } = state;
    if(!sunrise || !sunset) return;
    const isDay = now >= sunrise && now <= sunset;

    if(isDay){
      const pct = Math.min(1, Math.max(0, (now - sunrise) / (sunset - sunrise)));
      const p = getOrbitalPosition(pct);
      els.sunImg.style.left = (p.x / 1024 * 100) + '%';
      els.sunImg.style.top = (p.y / 190 * 100) + '%';
      els.sunImg.style.display = 'block';
      els.moonIcon.style.display = 'none';
      if(els.traversedPath) els.traversedPath.setAttribute('stroke-dasharray', (pct * 100) + ' 100');
    } else {
      els.sunImg.style.display = 'none';
      els.moonIcon.style.display = 'block';
      let nightStart = sunset, nightEnd = new Date(sunrise.getTime() + 86400000);
      if(now < sunrise){ nightStart = new Date(sunset.getTime() - 86400000); nightEnd = sunrise; }
      const pct = Math.min(1, Math.max(0, (now - nightStart) / (nightEnd - nightStart)));
      const angle = Math.PI + (Math.PI * pct);
      const centerX = 512, centerY = 65, radius = 65;
      const x = centerX + radius * Math.cos(angle);
      const y = centerY - radius * Math.sin(angle);
      els.moonIcon.style.left = (x / 1024 * 100) + '%';
      els.moonIcon.style.top = (y / 190 * 100) + '%';
      if(els.traversedPath) els.traversedPath.setAttribute('stroke-dasharray', '0 100');
    }
  }

  init();

  function fitWidget(){
    const widget = document.querySelector('.widget');
    const stage = document.querySelector('.stage');
    if(!widget || !stage) return;
    const naturalWidth = 1024;
    const scale = Math.min(1, window.innerWidth / naturalWidth);
    widget.style.transform = 'scale(' + scale + ')';
    stage.style.height = (widget.offsetHeight * scale) + 'px';
  }

  window.addEventListener('resize', fitWidget);
  window.addEventListener('load', fitWidget);
  fitWidget();
  setTimeout(fitWidget, 300);
})();
</script>

</body>
</html>
