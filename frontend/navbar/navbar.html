<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMMAH GUIDANCE - ইসলামিক গাইডেন্স</title>
  
  <style>
    /* ===== NAVBAR STYLING ===== */
    :root {
      --navbar-bg: #ffffff;
      --navbar-text: #000000;
      --navbar-border: #e0e0e0;
      --navbar-shadow: rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    }

    /* ===== NAVBAR CONTAINER ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--navbar-bg);
      border-bottom: 1px solid var(--navbar-border);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 60px;
      z-index: 100;
      box-shadow: 0 2px 4px var(--navbar-shadow);
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .navbar.navbar-hidden {
      transform: translateY(-100%);
    }

    /* ===== HAMBURGER MENU ===== */
    .navbar-menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navbar-text);
      transition: opacity 0.2s ease;
    }

    .navbar-menu-btn:hover {
      opacity: 0.7;
    }

    .navbar-menu-btn:active {
      transform: scale(0.95);
    }

    .navbar-menu-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    /* ===== NAVBAR LOGO/TITLE ===== */
    .navbar-logo {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 16px;
      text-decoration: none;
      color: var(--navbar-text);
    }

    .navbar-logo img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      margin-bottom: 2px;
    }

    .navbar-logo-text {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-align: center;
    }

    .navbar-logo-text-main {
      font-weight: 600;
      font-size: 14px;
    }

    .navbar-logo-text-sub {
      font-weight: 400;
      font-size: 12px;
      color: #666666;
    }

    /* ===== SEARCH BUTTON ===== */
    .navbar-search-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navbar-text);
      transition: opacity 0.2s ease;
    }

    .navbar-search-btn:hover {
      opacity: 0.7;
    }

    .navbar-search-btn:active {
      transform: scale(0.95);
    }

    .navbar-search-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    /* ===== SIDEBAR ===== */
    .navbar-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 80%;
      max-width: 280px;
      height: 100vh;
      background: #ffffff;
      z-index: 101;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
      overflow-x: hidden;
    }

    .navbar-sidebar.active {
      transform: translateX(0);
    }

    /* ===== SIDEBAR HEADER ===== */
    .navbar-sidebar-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 20px;
      border-bottom: none;
      background: transparent;
    }

    .navbar-sidebar-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .navbar-sidebar-logo img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .navbar-sidebar-logo-text {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    .navbar-sidebar-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #333;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.2s ease;
      padding: 0;
    }

    .navbar-sidebar-close:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    /* ===== SIDEBAR NAV ===== */
    .navbar-sidebar-nav {
      display: flex;
      flex-direction: column;
      padding: 24px 0 8px;
    }

    .navbar-sidebar-link {
      padding: 14px 20px;
      text-decoration: none;
      color: #333333;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
      font-size: 14px;
      display: block;
      font-weight: 500;
    }

    .navbar-sidebar-link:hover {
      background: #f5f5f5;
      border-left-color: #03c3d2;
      color: #03c3d2;
    }

    .navbar-sidebar-link.active {
      background: #f0f0f0;
      border-left-color: #000000;
      color: #000000;
      font-weight: 600;
    }

    /* ===== SIDEBAR BACKDROP ===== */
    .navbar-sidebar-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .navbar-sidebar-backdrop.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ===== CONTENT PADDING ===== */
    body {
      padding-top: 60px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .navbar {
        padding: 10px 12px;
        height: 56px;
      }
      
      .navbar-logo {
        margin: 0 8px;
      }
      
      .navbar-logo-text-main {
        font-size: 13px;
      }
      
      .navbar-logo-text-sub {
        font-size: 11px;
      }
    }

    /* ===== SEARCH MODAL (নামাজের সময়সূচী পেজ থেকে যুক্ত করা হয়েছে) ===== */
    /* Search Modal - সর্বোচ্চ z-index যাতে বডিতে সবার উপরে থাকে */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: rgba(15, 20, 18, 0.6);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility 0s linear .25s;
    }

    .search-overlay.open {
      opacity: 1;
      visibility: visible;
      transition: opacity .25s ease, visibility 0s linear 0s;
    }

    .search-modal {
      background: #fff;
      border-radius: 10px;
      padding: 30px 24px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      transform: scale(0.9);
      transition: transform .3s cubic-bezier(.32,.72,.35,1);
    }

    .search-overlay.open .search-modal {
      transform: scale(1);
    }

    .search-modal-title {
      margin: 0 0 22px;
      font-size: 18.5px;
      font-weight: 700;
      color: #2f473f;
      line-height: 1.5;
    }

    .search-modal-inputwrap {
      margin-bottom: 18px;
    }

    .search-modal-input {
      width: 100%;
      border: 1.5px solid #1f8a5f;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      font-family: inherit;
      color: #20242b;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      text-align: center;
    }

    .search-modal-input::placeholder {
      color: #8b909a;
      opacity: 0.9;
    }

    .search-modal-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      background: #d3d6d3;
      color: #8b9089;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
    }

    .search-modal-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .search-modal-btn.highlight {
      background: #1f8a5f;
      color: #fff;
      box-shadow: 0 8px 20px rgba(31, 138, 95, 0.45);
    }

    /* ===== সাইডবার মেনু গ্রিড (নামাজের সময়সূচী পেজ থেকে যুক্ত করা হয়েছে) ===== */
    .navbar-sidebar-menu-title {
      padding: 18px 20px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #8b909a;
      letter-spacing: 0.3px;
    }

    .navbar-sidebar-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px 16px 20px;
    }

    .navbar-sidebar-menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      padding: 10px 4px;
      background: #f7f8f7;
      border: 1px solid rgba(31, 138, 95, 0.08);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .navbar-sidebar-menu-card:hover {
      background: #eef8f3;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .navbar-sidebar-menu-card:active {
      transform: scale(0.95);
    }

    .navbar-sidebar-menu-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .navbar-sidebar-menu-icon img {
      width: 24px;
      height: 24px;
      max-width: 24px;
      max-height: 24px;
      object-fit: contain;
      display: block;
    }

    .navbar-sidebar-menu-lbl {
      font-size: 11px;
      font-weight: 600;
      color: #2f473f;
      line-height: 1.25;
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <div class="navbar">
    <!-- Hamburger Menu -->
    <button id="navbar-menu-btn" class="navbar-menu-btn" title="মেনু">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Logo & Title -->
    <a href="/index.html" class="navbar-logo">
      <img src="assets/ummahguidanceLOGO3.png" alt="Logo">
    </a>

    <!-- Search Button -->
    <button id="navbar-search-btn" class="navbar-search-btn" title="খুঁজুন">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
  </div>

  <!-- ===== SIDEBAR ===== -->
  <div id="navbar-sidebar" class="navbar-sidebar">
    <!-- Sidebar Header -->
    <div class="navbar-sidebar-header">
      <div class="navbar-sidebar-logo">
        <img src="assets/ummahguidanceLOGO3.png" alt="Logo">
      </div>
      <button id="navbar-sidebar-close" class="navbar-sidebar-close" title="বন্ধ করুন">✕</button>
    </div>

    <!-- Sidebar Navigation -->
    <nav class="navbar-sidebar-nav">
      <a href="/index.html" class="navbar-sidebar-link">হোম</a>
      <a href="/about.html" class="navbar-sidebar-link">আমাদের সম্পর্কে</a>
      <a href="/services.html" class="navbar-sidebar-link">সেবা</a>
      <a href="/blog.html" class="navbar-sidebar-link">ব্লগ</a>
      <a href="/contact.html" class="navbar-sidebar-link">যোগাযোগ</a>
      <a href="/faq.html" class="navbar-sidebar-link">FAQ</a>
    </nav>
  </div>

  <!-- Sidebar Backdrop -->
  <div id="navbar-sidebar-backdrop" class="navbar-sidebar-backdrop"></div>

  <!-- ===== SEARCH MODAL (নামাজের সময়সূচী পেজ থেকে যুক্ত করা হয়েছে) ===== -->
  <div class="search-overlay" id="navbar-search-overlay" aria-hidden="true">
    <div class="search-modal">
      <h3 class="search-modal-title">কি খুঁজছেন? আরবী বা বাংলায় বাক্যটি লিখুন</h3>
      <div class="search-modal-inputwrap">
        <input type="text" id="navbar-search-modal-input" class="search-modal-input" placeholder="উম্মাহ গাইডেন্সর সকল সেকশনে অনুসন্ধান করুন">
      </div>
      <button type="button" class="search-modal-btn" id="navbar-search-modal-btn">অনুসন্ধান</button>
    </div>
  </div>


  <script>


function initNavbar() {
    const navbarMenuBtn = document.getElementById('navbar-menu-btn');
    const navbarSidebar = document.getElementById('navbar-sidebar');
    const navbarSidebarBackdrop = document.getElementById('navbar-sidebar-backdrop');
    const navbarSidebarClose = document.getElementById('navbar-sidebar-close');
    const navbarSearchBtn = document.getElementById('navbar-search-btn');
    const navbarSidebarLinks = document.querySelectorAll('.navbar-sidebar-link, .navbar-sidebar-menu-card');

    // ===== SIDEBAR FUNCTIONS =====

    function openSidebar() {
      console.log('%c🟢 OPENING SIDEBAR', 'background: #90EE90; color: black; padding: 3px 8px; font-weight: bold; border-radius: 3px;');
      
      if (navbarSidebar) {
        navbarSidebar.classList.add('active');
      }
      
      if (navbarSidebarBackdrop) {
        navbarSidebarBackdrop.classList.add('active');
      }
      
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      console.log('%c🔴 CLOSING SIDEBAR', 'background: #FFB6C6; color: black; padding: 3px 8px; font-weight: bold; border-radius: 3px;');
      
      if (navbarSidebar) {
        navbarSidebar.classList.remove('active');
      }
      
      if (navbarSidebarBackdrop) {
        navbarSidebarBackdrop.classList.remove('active');
      }
      
      document.body.style.overflow = 'auto';
    }

    // ===== EVENT LISTENERS =====
    console.log('%c🔗 Attaching Event Listeners', 'color: cyan; font-weight: bold;');

    // Menu Button
    if (navbarMenuBtn) {
      navbarMenuBtn.addEventListener('click', function(e) {
        console.log('%c🍔 MENU BUTTON CLICKED', 'background: yellow; color: black; font-weight: bold; padding: 3px 8px; border-radius: 3px;');
        e.preventDefault();
        openSidebar();
      });
      console.log('✅ Menu button listener attached');
    }

    // Close Button
    if (navbarSidebarClose) {
      navbarSidebarClose.addEventListener('click', function(e) {
        console.log('%c❌ CLOSE BUTTON CLICKED', 'background: orange; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;');
        e.preventDefault();
        closeSidebar();
      });
      console.log('✅ Close button listener attached');
    }

    // Backdrop Click
    if (navbarSidebarBackdrop) {
      navbarSidebarBackdrop.addEventListener('click', function(e) {
        console.log('%c⬛ BACKDROP CLICKED', 'background: gray; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;');
        closeSidebar();
      });
      console.log('✅ Backdrop listener attached');
    }

    // Sidebar Links Click
    navbarSidebarLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        console.log('%c🔗 SIDEBAR LINK CLICKED:', 'background: blue; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;', this.textContent);
        setTimeout(closeSidebar, 150);
      });
    });
    console.log(`✅ ${navbarSidebarLinks.length} sidebar links listeners attached`);

    // ===== SEARCH MODAL (নামাজের সময়সূচী পেজ থেকে যুক্ত করা হয়েছে) =====
    const navbarSearchOverlay = document.getElementById('navbar-search-overlay');
    const navbarSearchModalInput = document.getElementById('navbar-search-modal-input');
    const navbarSearchModalBtn = document.getElementById('navbar-search-modal-btn');

    function updateNavbarSearchModalBtnState() {
      if (!navbarSearchModalBtn) return;
      const hasText = !!(navbarSearchModalInput && navbarSearchModalInput.value.trim().length > 0);
      navbarSearchModalBtn.classList.toggle('highlight', hasText);
    }

    function openNavbarSearchOverlay() {
      if (!navbarSearchOverlay) return;
      navbarSearchOverlay.classList.add('open');
      navbarSearchOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      updateNavbarSearchModalBtnState();
      setTimeout(function() {
        if (navbarSearchModalInput) navbarSearchModalInput.focus();
      }, 300);
    }

    function closeNavbarSearchOverlay() {
      if (!navbarSearchOverlay) return;
      navbarSearchOverlay.classList.remove('open');
      navbarSearchOverlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = 'auto';
    }

    // Search Button
    if (navbarSearchBtn) {
      navbarSearchBtn.addEventListener('click', function(e) {
        console.log('%c🔍 SEARCH BUTTON CLICKED', 'background: purple; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;');
        e.preventDefault();
        openNavbarSearchOverlay();
      });
      console.log('✅ Search button listener attached');
    }

    // Close on backdrop click
    if (navbarSearchOverlay) {
      navbarSearchOverlay.addEventListener('click', function(e) {
        if (e.target === navbarSearchOverlay) closeNavbarSearchOverlay();
      });
    }

    // Input state + Enter key submit
    if (navbarSearchModalInput) {
      navbarSearchModalInput.addEventListener('input', updateNavbarSearchModalBtnState);
      navbarSearchModalInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (navbarSearchModalBtn) navbarSearchModalBtn.click();
        }
      });
    }

    // Search submit — এখানে আপনার প্রকৃত সার্চ ফাংশন/পেজ যুক্ত করুন
    if (navbarSearchModalBtn) {
      navbarSearchModalBtn.addEventListener('click', function() {
        const q = navbarSearchModalInput ? navbarSearchModalInput.value.trim() : '';
        if (!q) return;
        console.log('%c🔎 SEARCH QUERY:', 'background: purple; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;', q);
        // উদাহরণ: window.location.href = '/search?q=' + encodeURIComponent(q);
        closeNavbarSearchOverlay();
      });
    }

    // ESC Key to close search modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && navbarSearchOverlay && navbarSearchOverlay.classList.contains('open')) {
        closeNavbarSearchOverlay();
      }
    });

    // ESC Key to Close Sidebar
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && navbarSidebar && navbarSidebar.classList.contains('active')) {
        console.log('%c⌨️ ESC KEY PRESSED', 'background: brown; color: white; font-weight: bold; padding: 3px 8px; border-radius: 3px;');
        closeSidebar();
      }
    });
    console.log('✅ ESC key listener attached');

    // ===== SCROLL SHOW/HIDE NAVBAR =====
    const navbarEl = document.querySelector('.navbar');
    let lastScrollY = window.scrollY;
    let ticking = false;
    const scrollThreshold = 5; // ignore tiny scroll jitters
    const minScrollToHide = 60; // don't hide navbar until scrolled past this point

    function handleNavbarScroll() {
      const currentScrollY = window.scrollY;
      const diff = currentScrollY - lastScrollY;

      if (Math.abs(diff) < scrollThreshold) {
        ticking = false;
        return;
      }

      // Always show navbar near the top of the page
      if (currentScrollY < minScrollToHide) {
        navbarEl.classList.remove('navbar-hidden');
      } else if (diff > 0) {
        // Scrolling down -> hide navbar (and close sidebar if open)
        navbarEl.classList.add('navbar-hidden');
        if (navbarSidebar && navbarSidebar.classList.contains('active')) {
          closeSidebar();
        }
      } else {
        // Scrolling up -> show navbar
        navbarEl.classList.remove('navbar-hidden');
      }

      lastScrollY = currentScrollY;
      ticking = false;
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(handleNavbarScroll);
        ticking = true;
      }
    }, { passive: true });
    console.log('✅ Scroll show/hide navbar enabled');

    // ===== ACTIVE LINK HIGHLIGHTING =====
    function updateActiveLink() {
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      
      navbarSidebarLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href === currentPage || (currentPage === '' && href === '/index.html')) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    updateActiveLink();
    window.addEventListener('hashchange', updateActiveLink);
    console.log('✅ Active link highlighting enabled');

    // ===== DEBUG FUNCTION =====
    window.debugNavbar = function() {
      console.log('%c🐛 NAVBAR DEBUG INFO', 'color: orange; font-size: 14px; font-weight: bold; background: lightyellow; padding: 8px; border-radius: 4px;');
      console.log('='.repeat(50));
      
      console.log('%c✅ ELEMENTS:', 'color: green; font-weight: bold;');
      console.log('Menu Button:', navbarMenuBtn ? '✅ Found' : '❌ Missing');
      console.log('Sidebar:', navbarSidebar ? '✅ Found' : '❌ Missing');
      console.log('Backdrop:', navbarSidebarBackdrop ? '✅ Found' : '❌ Missing');
      console.log('Close Button:', navbarSidebarClose ? '✅ Found' : '❌ Missing');
      console.log('Search Button:', navbarSearchBtn ? '✅ Found' : '❌ Missing');
      
      console.log('%c📋 SIDEBAR INFO:', 'color: blue; font-weight: bold;');
      if (navbarSidebar) {
        console.log('Sidebar is active:', navbarSidebar.classList.contains('active'));
        console.log('Sidebar classes:', navbarSidebar.className);
      }
      
      console.log('%c🎮 MANUAL COMMANDS:', 'color: purple; font-weight: bold;');
      console.log('• debugNavbar.open() - Open sidebar');
      console.log('• debugNavbar.close() - Close sidebar');
      
      console.log('%c✅ DEBUG COMPLETE', 'color: green; font-size: 12px; font-weight: bold;');
    };

    window.debugNavbar.open = openSidebar;
    window.debugNavbar.close = closeSidebar;

    console.log('%c✅ NAVBAR LOADED SUCCESSFULLY!', 'color: green; font-size: 14px; font-weight: bold; background: lightgreen; padding: 8px; border-radius: 4px;');
    console.log('%c💡 Run debugNavbar() to check navbar status', 'color: blue; font-size: 12px;');
}
