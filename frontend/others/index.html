<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সেটিংস</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
              @font-face{
    font-family:'Kalpurush';
    src:url('namaz-shikkha/icons/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Bengali', 'Kalpurush', 'Hind Siliguri', sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d5016 0%, #3d6b1f 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-back {
            position: absolute;
            left: 20px;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            padding: 15px 10px;
            border-radius: 10px;
        }

        .menu-item:hover {
            background-color: #e8e8e8;
            transform: translateY(-5px);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: #f0f0f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 32px;
            line-height: 1;
        }

        .menu-item:hover .icon-box {
            background-color: #e0e0e0;
            transform: scale(1.1);
        }

        .label {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            color: #2c2c2c;
            word-break: break-word;
        }

        /* Icon Styles */
        i {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .header {
                padding: 12px 15px;
            }

            .header-title {
                font-size: 20px;
            }

            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 15px 5px;
            }

            .menu-item {
                padding: 10px 5px;
            }

            .icon-box {
                width: 55px;
                height: 55px;
                font-size: 28px;
                margin-bottom: 8px;
            }

            .label {
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .menu-grid {
                gap: 8px;
            }

            .icon-box {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="header-title">সেটিংস</div>
    </div>

    <div class="menu-container">
        <div class="menu-grid">
            <!-- আমার আকাউন্ট -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-user" style="color: #4a90e2; font-size: 28px;"></i>
                </div>
                <div class="label">আমার<br>আকাউন্ট</div>
            </div>

            <!-- গুগল অ্যাড-ফ্রি পুনর্ক্রয়ার -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-shield-alt" style="color: #FFB800; font-size: 28px;"></i>
                </div>
                <div class="label">গুগল অ্যাড-ফ্রি<br>পুনর্ক্রয়ার</div>
            </div>

            <!-- ডার্ক মোড -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-moon" style="color: #2d5016; font-size: 28px;"></i>
                </div>
                <div class="label">ডার্ক মোড</div>
            </div>

            <!-- আসর ক্যালকুলেশন -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-clock" style="color: #FF6B6B; font-size: 28px;"></i>
                </div>
                <div class="label">আসর<br>ক্যালকুলেশন</div>
            </div>

            <!-- হিজরি তারিখ আপডেট -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-calendar" style="color: #FF69B4; font-size: 28px;"></i>
                </div>
                <div class="label">হিজরি তারিখ<br>আপডেট</div>
            </div>

            <!-- বাংলা ক্যালেন্ডার -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-calendar-alt" style="color: #2d5016; font-size: 28px;"></i>
                </div>
                <div class="label">বাংলা<br>ক্যালেন্ডার</div>
            </div>

            <!-- অ্যাপ শেয়ার -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-share-alt" style="color: #4CAF50; font-size: 28px;"></i>
                </div>
                <div class="label">অ্যাপ শেয়ার</div>
            </div>

            <!-- রেটিং দিন -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-star" style="color: #FFD700; font-size: 28px;"></i>
                </div>
                <div class="label">রেটিং দিন</div>
            </div>

            <!-- ভাষা পরিবর্তন -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-language" style="color: #2196F3; font-size: 28px;"></i>
                </div>
                <div class="label">ভাষা<br>পরিবর্তন</div>
            </div>

            <!-- আরবি ফন্ট -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-font" style="color: #2d5016; font-size: 28px;"></i>
                </div>
                <div class="label">আরবি ফন্ট</div>
            </div>

            <!-- আপের ভার্শন -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-mobile-alt" style="color: #4CAF50; font-size: 28px;"></i>
                </div>
                <div class="label">আপের<br>ভার্শন</div>
            </div>

            <!-- সচরাচর জিজ্ঞাসা -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-question-circle" style="color: #FF6F00; font-size: 28px;"></i>
                </div>
                <div class="label">সচরাচর<br>জিজ্ঞাসা</div>
            </div>

            <!-- ফিডব্যাক -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-comment" style="color: #2196F3; font-size: 28px;"></i>
                </div>
                <div class="label">ফিডব্যাক</div>
            </div>

            <!-- অনান্য অ্যাপস -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-th" style="color: #9C27B0; font-size: 28px;"></i>
                </div>
                <div class="label">অনান্য<br>অ্যাপস</div>
            </div>

            <!-- ওয়েবসাইট -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-globe" style="color: #00796B; font-size: 28px;"></i>
                </div>
                <div class="label">ওয়েবসাইট</div>
            </div>

            <!-- প্লে স্টোর -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-play-circle" style="color: #1f88e5; font-size: 28px;"></i>
                </div>
                <div class="label">প্লে স্টোর<br>খান</div>
            </div>

            <!-- পরিচালনাকারী -->
            <div class="menu-item">
                <div class="icon-box">
                    <i class="fas fa-users" style="color: #E91E63; font-size: 28px;"></i>
                </div>
                <div class="label">পরিচালনা<br>কারী</div>
            </div>
        </div>
    </div>

    <script>
        // Back button functionality
        document.querySelector('.header-back').addEventListener('click', function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                console.log('Back button clicked');
            }
        });

        // Smooth scrolling for mobile
        document.addEventListener('DOMContentLoaded', function() {
            // Any additional interactive features can be added here
            console.log('Menu loaded successfully');
        });
    </script>

      <!-- Navbar Loader -->
<script src="navbar/navbar-loader.js"></script>

</body>
</html>
