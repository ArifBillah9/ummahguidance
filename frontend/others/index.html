<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সেটিংস</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
              @font-face{
    font-family:'Kalpurush';
    src:url('namaz-shikkha/icons/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Bengali', 'Kalpurush', 'Hind Siliguri', sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d5016 0%, #3d6b1f 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-back {
            position: absolute;
            left: 20px;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            padding: 15px 10px;
            border-radius: 10px;
        }

        .menu-item:hover {
            background-color: #e8e8e8;
            transform: translateY(-5px);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: #f0f0f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 32px;
            line-height: 1;
        }

        .menu-item:hover .icon-box {
            background-color: #e0e0e0;
            transform: scale(1.1);
        }

        .label {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            color: #2c2c2c;
            word-break: break-word;
        }

        /* Icon Styles */
        svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .header {
                padding: 12px 15px;
            }

            .header-title {
                font-size: 20px;
            }

            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 15px 5px;
            }

            .menu-item {
                padding: 10px 5px;
            }

            .icon-box {
                width: 55px;
                height: 55px;
                font-size: 28px;
                margin-bottom: 8px;
            }

            .label {
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .menu-grid {
                gap: 8px;
            }

            .icon-box {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="header-title">সেটিংস</div>
    </div>

    <div class="menu-container">
        <div class="menu-grid">
            <!-- আমার আকাউন্ট -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#4a90e2"/>
                    </svg>
                </div>
                <div class="label">আমার<br>আকাউন্ট</div>
            </div>

            <!-- গুগল অ্যাড-ফ্রি পুনর্ক্রয়ার -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="8" r="4" fill="#d4af37"/>
                        <path d="M8 14h8c2 0 2 1 2 2v4H6v-4c0-1 0-2 2-2z" fill="#c41e3a"/>
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="#4CAF50" opacity="0.3"/>
                    </svg>
                </div>
                <div class="label">গুগল অ্যাড-ফ্রি<br>পুনর্ক্রয়ার</div>
            </div>

            <!-- বিনিয়োগ -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="5" y="8" width="3" height="10" fill="#FFD700"/>
                        <rect x="11" y="3" width="3" height="15" fill="#4CAF50"/>
                        <rect x="17" y="6" width="3" height="12" fill="#FF6B6B"/>
                        <path d="M3 20h18" stroke="#333" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="label">বিনিয়োগ</div>
            </div>

            <!-- ডার্ক মোড -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="9" fill="#333"/>
                        <circle cx="12" cy="5" r="2" fill="white"/>
                        <circle cx="12" cy="19" r="2" fill="white"/>
                        <circle cx="5" cy="12" r="2" fill="white"/>
                        <circle cx="19" cy="12" r="2" fill="white"/>
                    </svg>
                </div>
                <div class="label">ডার্ক মোড</div>
            </div>

            <!-- আসর ক্যালকুলেশন -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10" stroke="#333" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="12" r="2" fill="#333"/>
                        <path d="M12 7v5M17 12h-5" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="7" cy="7" r="1.5" fill="#666"/>
                        <circle cx="17" cy="7" r="1.5" fill="#666"/>
                        <circle cx="7" cy="17" r="1.5" fill="#666"/>
                        <circle cx="17" cy="17" r="1.5" fill="#666"/>
                    </svg>
                </div>
                <div class="label">আসর<br>ক্যালকুলেশন</div>
            </div>

            <!-- হিজরি তারিখ আপডেট -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="#FF69B4" stroke-width="2"/>
                        <circle cx="12" cy="15" r="3" fill="#FF69B4"/>
                        <line x1="9" y1="6" x2="9" y2="9" stroke="#333" stroke-width="2"/>
                        <line x1="15" y1="6" x2="15" y2="9" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <div class="label">হিজরি তারিখ<br>আপডেট</div>
            </div>

            <!-- বাংলা ক্যালেন্ডার -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="3" y="4" width="18" height="16" rx="2" fill="#90EE90" stroke="#2d5016" stroke-width="2"/>
                        <text x="12" y="14" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5016" font-family="Arial">রম</text>
                    </svg>
                </div>
                <div class="label">বাংলা<br>ক্যালেন্ডার</div>
            </div>

            <!-- অ্যাপ শেয়ার -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="6" r="3" fill="#4CAF50"/>
                        <circle cx="5" cy="15" r="3" fill="#4CAF50"/>
                        <circle cx="19" cy="15" r="3" fill="#4CAF50"/>
                        <path d="M12 9L7 13" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
                        <path d="M12 9L17 13" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
                    </svg>
                </div>
                <div class="label">অ্যাপ শেয়ার</div>
            </div>

            <!-- রেটিং দিন -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12,2 15,10 23,10 17,15 19,23 12,18 5,23 7,15 1,10 9,10" fill="#FFD700"/>
                    </svg>
                </div>
                <div class="label">রেটিং দিন</div>
            </div>

            <!-- ভাষা পরিবর্তন -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <text x="6" y="10" font-size="8" font-weight="bold" fill="#2196F3">A</text>
                        <text x="6" y="17" font-size="6" fill="#FF9800">অ</text>
                        <circle cx="18" cy="12" r="5" fill="none" stroke="#673AB7" stroke-width="1.5"/>
                        <path d="M18 8v8" stroke="#673AB7" stroke-width="1.5"/>
                    </svg>
                </div>
                <div class="label">ভাষা<br>পরিবর্তন</div>
            </div>

            <!-- আরবি ফন্ট -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 6h6v2H4V6zm0 4h10v2H4v-2zm0 4h8v2H4v-2zM18 2v10h-2v-3h-3v3h-2V2h2v5h3V2h2z" fill="#2d5016"/>
                    </svg>
                </div>
                <div class="label">আরবি ফন্ট</div>
            </div>

            <!-- আপের ভার্শন -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="#4CAF50" stroke-width="2"/>
                        <text x="12" y="14" font-size="8" font-weight="bold" text-anchor="middle" fill="#4CAF50" font-family="Arial">v1</text>
                    </svg>
                </div>
                <div class="label">আপের<br>ভার্শন</div>
            </div>

            <!-- সচরাচর জিজ্ঞাসা -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="#FF6F00" stroke-width="2"/>
                        <text x="12" y="15" font-size="14" font-weight="bold" text-anchor="middle" fill="#FF6F00">?</text>
                    </svg>
                </div>
                <div class="label">সচরাচর<br>জিজ্ঞাসা</div>
            </div>

            <!-- ফিডব্যাক -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="2" y="2" width="20" height="16" rx="2" fill="none" stroke="#2196F3" stroke-width="2"/>
                        <path d="M12 18l-4 4v-4H5" stroke="#2196F3" stroke-width="2" fill="none"/>
                        <line x1="6" y1="8" x2="18" y2="8" stroke="#2196F3" stroke-width="1.5"/>
                        <line x1="6" y1="12" x2="18" y2="12" stroke="#2196F3" stroke-width="1.5"/>
                    </svg>
                </div>
                <div class="label">ফিডব্যাক</div>
            </div>

            <!-- অনান্য অ্যাপস -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="3" y="3" width="7" height="7" fill="#9C27B0"/>
                        <rect x="14" y="3" width="7" height="7" fill="#00BCD4"/>
                        <rect x="3" y="14" width="7" height="7" fill="#FF5722"/>
                        <rect x="14" y="14" width="7" height="7" fill="#FFC107"/>
                    </svg>
                </div>
                <div class="label">অনান্য<br>অ্যাপস</div>
            </div>

            <!-- ওয়েবসাইট -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="#00796B" stroke-width="2"/>
                        <text x="12" y="15" font-size="10" font-weight="bold" text-anchor="middle" fill="#00796B" font-family="Arial">www</text>
                    </svg>
                </div>
                <div class="label">ওয়েবসাইট</div>
            </div>

            <!-- প্লে স্টোর -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 13.5L12 20l9-6.5V3H3z" fill="none" stroke="#1f88e5" stroke-width="2"/>
                        <polygon points="6,8 12,12 18,8" fill="#1f88e5"/>
                    </svg>
                </div>
                <div class="label">প্লে স্টোর<br>খান</div>
            </div>

            <!-- পরিচালনাকারী -->
            <div class="menu-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="8" cy="6" r="3" fill="#E91E63"/>
                        <path d="M2 9h12c1.1 0 2 .9 2 2v10H2V11c0-1.1.9-2 2-2z" fill="#E91E63" opacity="0.7"/>
                        <circle cx="16" cy="6" r="3" fill="#E91E63" opacity="0.8"/>
                        <path d="M14 9h10c1.1 0 2 .9 2 2v10h-12v-10c0-1.1.9-2 2-2z" fill="#E91E63" opacity="0.5"/>
                    </svg>
                </div>
                <div class="label">পরিচালনা<br>কারী</div>
            </div>
        </div>
    </div>

    <script>
        // Back button functionality
        document.querySelector('.header-back').addEventListener('click', function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                console.log('Back button clicked');
            }
        });

        // Smooth scrolling for mobile
        document.addEventListener('DOMContentLoaded', function() {
            // Any additional interactive features can be added here
            console.log('Menu loaded successfully');
        });
    </script>

      <!-- Navbar Loader -->
<script src="navbar/navbar-loader.js"></script>

</body>
</html>
