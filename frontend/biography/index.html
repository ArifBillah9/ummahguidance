<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইমাম ও আলেমদের জীবনী</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ===== HOME PAGE ===== */
        .home-header {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 20px;
        }

        .home-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 700;
        }

        .home-header p {
            font-size: 1.1em;
            color: #7f8c8d;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .menu-card {
            background: white;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #ecf0f1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }

        .menu-card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-card-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .menu-card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .menu-card-count {
            color: #95a5a6;
            font-size: 0.95em;
        }

        /* ===== CATEGORY PAGE ===== */
        .category-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border: 1px solid #ecf0f1;
        }

        .category-header-icon {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .category-header-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .category-header-content h1 {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .category-header-content p {
            color: #7f8c8d;
            font-size: 1em;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #34495e;
            color: white;
            cursor: pointer;
            border: none;
            font-size: 0.95em;
            font-family: 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: #2c3e50;
        }

        .scholars-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .scholar-item {
            background: white;
            padding: 20px;
            cursor: pointer;
            border: 1px solid #ecf0f1;
            transition: all 0.3s ease;
            text-align: center;
        }

        .scholar-item:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            transform: translateY(-3px);
        }

        .scholar-item-name {
            font-size: 1.05em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .scholar-item-arabic {
            font-family: 'Amiri', serif;
            font-size: 1.1em;
            color: #34495e;
            margin-bottom: 8px;
        }

        .scholar-item-era {
            color: #7f8c8d;
            font-size: 0.85em;
        }

        /* ===== BIO PAGE ===== */
        .bio-container {
            background: white;
            padding: 40px;
            border: 1px solid #ecf0f1;
        }

        .bio-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
        }

        .bio-icon {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
        }

        .bio-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bio-header-content h1 {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .bio-header-content .arabic {
            font-family: 'Amiri', serif;
            font-size: 1.3em;
            color: #34495e;
            margin-bottom: 10px;
        }

        .bio-header-content .era {
            color: #7f8c8d;
            font-size: 1.05em;
        }

        .bio-content {
            line-height: 1.8;
            color: #555;
            font-size: 1.05em;
        }

        .bio-content p {
            margin-bottom: 15px;
            text-align: justify;
        }

        @media (max-width: 768px) {
            .bio-header {
                flex-direction: column;
                text-align: center;
            }

            .home-header h1 {
                font-size: 1.8em;
            }

            .menu-card-title {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HOME PAGE -->
        <div id="homePage" class="page active">
            <div class="home-header">
                <h1>ইমাম ও আলেমদের জীবনী</h1>
                <p>ইসলামের মহান চিন্তাবিদ এবং বিদ্বানদের জীবন ও অবদান</p>
            </div>
            <div class="categories-grid" id="categoriesContainer"></div>
        </div>

        <!-- CATEGORY PAGE -->
        <div id="categoryPage" class="page">
            <button class="back-btn" onclick="goToHome()">← হোম এ ফেরত যান</button>
            <div class="category-header">
                <div class="category-header-icon" id="categoryIcon"></div>
                <div class="category-header-content">
                    <h1 id="categoryTitle"></h1>
                    <p id="categoryDescription"></p>
                </div>
            </div>
            <div class="scholars-list" id="scholarsList"></div>
        </div>

        <!-- BIO PAGE -->
        <div id="bioPage" class="page">
            <button class="back-btn" onclick="goToCategoryFromBio()">← ক্যাটাগরি তে ফেরত যান</button>
            <div class="bio-container">
                <div class="bio-header">
                    <div class="bio-icon" id="bioIcon"></div>
                    <div class="bio-header-content">
                        <h1 id="bioName"></h1>
                        <div class="arabic" id="bioArabic"></div>
                        <div class="era" id="bioEra"></div>
                    </div>
                </div>
                <div class="bio-content" id="bioContent"></div>
            </div>
        </div>
    </div>

    <script>
        const scholarsData = {
            'ইমাম ও ফকিহ': {
                description: 'ইসলামী আইনশাস্ত্রের প্রতিষ্ঠাতা এবং মহান ফকিহগণ',
                icon: 'assets/moslem.png',
                scholars: [
                    {
                        name: 'ইমাম আবু হানিফা',
                        arabic: 'الإمام أبو حنيفة النعمان بن ثابت',
                        era: '(৮০-১৫০ হিজরী / ৬৯৯-৭৬৭ খ্রিস্টাব্দ)',
                        bio: 'ইমাম নুমান ইবন সাবিত, যিনি আবু হানিফা নামে পরিচিত, হানাফী মাজহাবের প্রতিষ্ঠাতা। তিনি ইসলামী আইনশাস্ত্রে যুক্তি এবং সাধারণ নীতি ব্যবহারে অগ্রণী ছিলেন। তাঁর পদ্ধতি \"রায়\" এবং \"কিয়াস\" এর উপর ভিত্তি করে গড়ে উঠেছিল। হানাফী মাজহাব আজও বিশ্বব্যাপী লক্ষ লক্ষ মুসলিমের দ্বারা অনুসরণ করা হয়।'
                    },
                    {
                        name: 'ইমাম মালিক',
                        arabic: 'الإمام مالك بن أنس',
                        era: '(৯৩-১৭৯ হিজরী / ৭১১-৭৯৫ খ্রিস্টাব্দ)',
                        bio: 'ইমাম মালিক ইবন আনাস মালিকী মাজহাবের প্রতিষ্ঠাতা। তিনি মদীনায় বসবাস করতেন এবং তাঁর ফতোয়া ও পদ্ধতি অত্যন্ত প্রভাবশালী ছিল। তাঁর প্রসিদ্ধ সংকলন \"আল-মুওয়াত্তা\" ইসলামী আইনশাস্ত্রের একটি মূল্যবান কাজ। তিনি সুন্নাহ এবং ইজমা (সম্মতি) এর উপর বিশেষ গুরুত্ব দিয়েছিলেন।'
                    },
                    {
                        name: 'ইমাম শাফেয়ী',
                        arabic: 'الإمام محمد بن إدريس الشافعي',
                        era: '(১৫০-২০৪ হিজরী / ৭৬৭-৮২০ খ্রিস্টাব্দ)',
                        bio: 'ইমাম মুহাম্মদ ইবন ইদরিস আশ-শাফেয়ী শাফেয়ী মাজহাবের প্রতিষ্ঠাতা। তিনি একজন অসাধারণ আইন শাস্ত্রবিদ এবং মুহাদ্দিস ছিলেন। তাঁর বিখ্যাত গ্রন্থ \"আল-উসূল\" ইসলামী আইনশাস্ত্রের নীতিগত ভিত্তি স্থাপন করেছে। তিনি কুরআন, সুন্নাহ, ইজমা এবং কিয়াস সংমিশ্রণে একটি ভারসাম্যপূর্ণ পদ্ধতি অনুসরণ করেছিলেন।'
                    },
                    {
                        name: 'ইমাম আহমদ ইবন হাম্বল',
                        arabic: 'الإمام أحمد بن محمد بن حنبل الشيباني',
                        era: '(১৬৪-২৪১ হিজরী / ৭৮০-৮৫৫ খ্রিস্টাব্দ)',
                        bio: 'ইমাম আহমদ ইবন হাম্বল হাম্বলী মাজহাবের প্রতিষ্ঠাতা এবং একজন মহান মুহাদ্দিস। তিনি তাঁর সংকলন \"আল-মুসনাদ\" এর জন্য বিখ্যাত, যা হাদীসের একটি বিশাল সংকলন। তিনি হাদীস এবং সুন্নাহের প্রতি গভীর আনুগত্যশীল ছিলেন। তাঁর জীবন সংকটপূর্ণ সময়েও তাঁর বিশ্বাস এবং নীতির এক অনন্য উদাহরণ।'
                    },
                    {
                        name: 'ইমাম আবু ইউসুফ',
                        arabic: 'الإمام يعقوب بن إبراهيم الأنصاري',
                        era: '(১১৩-১৮২ হিজরী / ৭৩১-৭৯৮ খ্রিস্টাব্দ)',
                        bio: 'ইমাম ইয়াকুব ইবন ইব্রাহিম আবু ইউসুফ, ইমাম আবু হানিফার সবচেয়ে বিখ্যাত শিষ্য এবং হানাফী মাজহাবের উন্নয়নে গুরুত্বপূর্ণ ভূমিকা পালন করেছেন। তিনি খলিফা হারুন আর-রশীদের প্রধান বিচারপতি ছিলেন এবং তাঁর ফতোয়া অত্যন্ত প্রভাবশালী ছিল। তাঁর সংকলন \"আল-খারাজ\" ইসলামী অর্থনীতির একটি গুরুত্বপূর্ণ গ্রন্থ।'
                    },
                    {
                        name: 'ইমাম মুহাম্মদ ইবন হাসান আশ-শায়বানী',
                        arabic: 'الإمام محمد بن الحسن الشيباني',
                        era: '(১৩২-১৮৯ হিজরী / ৭৫০-৮০৫ খ্রিস্টাব্দ)',
                        bio: 'ইমাম মুহাম্মদ ইবন হাসান আশ-শায়বানী ইমাম আবু হানিফার আরেকজন বিখ্যাত শিষ্য এবং ইসলামী আইনশাস্ত্রে গুরুত্বপূর্ণ অবদান রেখেছেন। তাঁর সংকলনগুলি হানাফী মাজহাবের ভিত্তি তৈরি করেছে। তিনি ফিকহ এবং হাদীসের সমন্বয় সাধনে অত্যন্ত দক্ষ ছিলেন।'
                    },
                    {
                        name: 'ইমাম আওযায়ী',
                        arabic: 'الإمام عبد الرحمن بن عمرو الأوزاعي',
                        era: '(৮৮-১৫৭ হিজরী / ৭০৭-৭৭৩ খ্রিস্টাব্দ)',
                        bio: 'ইমাম আবদুর রহমান ইবন আমর আল-আওযায়ী আওযায়ী মাজহাবের প্রতিষ্ঠাতা। তিনি শাম অঞ্চলে একজন বিখ্যাত আলেম ছিলেন এবং তাঁর শিষ্যরা তাঁর পদ্ধতি অনুসরণ করেছিলেন। যদিও তাঁর মাজহাব বর্তমানে অনুসরণ করা হয় না, তবে তাঁর ফতোয়াগুলি অন্যান্য মাজহাবে ব্যবহৃত হয়।'
                    },
                    {
                        name: 'ইমাম সুফিয়ান আস-সাওরী',
                        arabic: 'الإمام سفيان بن سعيد الثوري',
                        era: '(৯৭-১৬১ হিজরী / ৭১৫-৭৭৭ খ্রিস্টাব্দ)',

                    },
                    {
                        name: 'ইমাম লায়স ইবন সা\'দ',
                        arabic: 'الإمام الليث بن سعد',
                        era: '(৯৪-১৭৫ হিজরী / ৭১২-৭৯১ খ্রিস্টাব্দ)',
                        bio: 'ইমাম আল-লায়স ইবন সা\'দ মিসরের একজন বিখ্যাত মুহাদ্দিস এবং আইনশাস্ত্রবিদ ছিলেন। তিনি মিসরে ইসলামী জ্ঞানের প্রসার এবং বিকাশে গুরুত্বপূর্ণ ভূমিকা পালন করেছেন। তাঁর ফতোয়া এবং পদ্ধতি অত্যন্ত প্রভাবশালী ছিল।'
                    }
                ]
            },
            'মুহাদ্দিস': {
                description: 'হাদীস সংকলনের মহান বিশারদরা',
                icon: 'https://cdn-icons-png.flaticon.com/512/1524/1524926.png',
                scholars: [
                    {
                        name: 'ইমাম বুখারী',
                        arabic: 'الإمام محمد بن إسماعيل البخاري',
                        era: '(১৯৪-২৫৬ হিজরী / ৮১০-৮৭০ খ্রিস্টাব্দ)',
                        bio: 'ইমাম মুহাম্মদ ইবন ইসমাইল আল-বুখারী ইসলামের সবচেয়ে বিশ্বস্ত এবং প্রামাণিক হাদীস সংকলক। তাঁর \"সহিহ আল-বুখারী\" মুসলিম বিশ্বে সর্বোচ্চ মর্যাদার সাথে গ্রহণ করা হয়েছে। তিনি ১৬ বছর ধরে ৬ লক্ষ হাদীস থেকে শুধুমাত্র ৭,৪৫০ টি প্রামাণিক হাদীস নির্বাচন করেছিলেন।'
                    },
                    {
                        name: 'ইমাম মুসলিম',

        let currentCategory = '';
        let currentScholar = '';

        // Home Page Initialization
        function initializeHome() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            Object.entries(scholarsData).forEach(([category, data]) => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    <div class="menu-card-icon">
                        <img src="${data.icon}" alt="${category}">
                    </div>
                    <div class="menu-card-title">${category}</div>
                    <div class="menu-card-count">${data.scholars.length} জন আলেম</div>
                `;
                card.onclick = () => goToCategory(category);
                container.appendChild(card);
            });
        }

        // Navigation Functions
        function goToCategory(category) {
            currentCategory = category;
            const categoryData = scholarsData[category];
            
            document.getElementById('categoryIcon').innerHTML = `<img src="${categoryData.icon}" alt="${category}">`;
            document.getElementById('categoryTitle').textContent = category;
            document.getElementById('categoryDescription').textContent = categoryData.description;
            
            const scholarsList = document.getElementById('scholarsList');
            scholarsList.innerHTML = '';
            
            categoryData.scholars.forEach(scholar => {
                const item = document.createElement('div');
                item.className = 'scholar-item';
                item.innerHTML = `
                    <div class="scholar-item-name">${scholar.name}</div>
                    <div class="scholar-item-arabic">${scholar.arabic}</div>
                    <div class="scholar-item-era">${scholar.era}</div>
                `;
                item.onclick = () => goToBio(category, scholar.name);
                scholarsList.appendChild(item);
            });
            
            showPage('categoryPage');
        }

        function goToBio(category, scholarName) {
            currentCategory = category;
            const scholar = scholarsData[category].scholars.find(s => s.name === scholarName);
            
            document.getElementById('bioIcon').innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/1524/1524926.png" alt="Biography">`;
            document.getElementById('bioName').textContent = scholar.name;
            document.getElementById('bioArabic').textContent = scholar.arabic;
            document.getElementById('bioEra').textContent = scholar.era;
            document.getElementById('bioContent').innerHTML = scholar.bio.split('\n').map(p => `<p>${p}</p>`).join('');
            
            showPage('bioPage');
        }

        function goToHome() {
            showPage('homePage');
        }

        function goToCategoryFromBio() {
            goToCategory(currentCategory);
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Initialize on load
        initializeHome();
    </script>
