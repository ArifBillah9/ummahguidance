<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিবলনা কম্পাস</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
              @font-face{
    font-family:'Kalpurush';
    src:url('qibla/fonts/Kalpurush.woff2') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
        :root {
            --needle-color: #16a085;
            --needle-base-color: #27ae60;
            --needle-base-dark: #16a085;
            --compass-background: #ecf0f1;
            --compass-shadow: #d5dbdb;
            --direction-primary: #e74c3c;
            --direction-secondary: #2c3e50;
            --tick-color: #7f8c8d;
            --tick-major-color: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', 'Kalpurush', 'Noto Sans Bengali', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e9e9e9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-back {
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            flex: 1;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-space {
            width: 30px;
        }

        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .location-info {
            margin-bottom: 30px;
        }

        .city-name {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 48px;
            font-weight: 700;
            color: #27ae60;
            letter-spacing: 2px;
        }

        .compass-wrapper {
            margin: 40px 0;
            display: flex;
            justify-content: center;
        }

        .compass-container {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--compass-background) 0%, var(--compass-shadow) 100%);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1), inset 0 2px 5px rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .direction-marker {
            position: absolute;
            font-size: 18px;
            font-weight: 700;
            color: var(--direction-secondary);
        }

        .north {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--direction-primary);
        }

        .east {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #2c3e50;
        }

        .south {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #2c3e50;
        }

        .west {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #2c3e50;
        }

        .compass-ticks {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 12px;
            background: var(--tick-color);
            left: 50%;
            top: 15px;
            margin-left: -1px;
            transform-origin: center 132.5px;
            transition: background 0.3s ease;
        }

        .tick.major {
            height: 16px;
            background: var(--tick-major-color);
            width: 3px;
            margin-left: -1.5px;
        }

        .compass-needle {
            position: absolute;
            width: 40px;
            height: 140px;
            top: 50%;
            left: 50%;
            margin-left: -20px;
            margin-top: -70px;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }

        .needle-triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 50px solid var(--needle-color);
            top: 0;
            left: 5px;
            transition: border-bottom-color 0.3s ease;
        }

        .needle-base {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, var(--needle-base-color), var(--needle-base-dark));
            border-radius: 50%;
            top: 45px;
            left: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
        }

        .compass-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 50px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .compass-icon {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            border: 2px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .compass-icon:hover {
            transform: scale(1.05);
        }

        .compass-icon.active {
            border-color: var(--needle-color);
            background: rgba(22, 160, 133, 0.1);
            box-shadow: 0 0 15px rgba(22, 160, 133, 0.3);
        }

        .compass-icon svg {
            width: 50px;
            height: 50px;
            stroke: #2c3e50;
            fill: none;
            stroke-width: 2;
        }

        .compass-icon.active svg {
            stroke: #16a085;
        }

        .crown-badge {
            display: none;
        }

        .footer-text {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 30px 20px 0 20px;
        }

        .permission-request {
            text-align: center;
            padding: 20px;
            background: #fff3cd;
            border-radius: 10px;
            margin: 20px;
            color: #856404;
            font-size: 14px;
        }

        .permission-button {
            background: #16a085;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .permission-button:hover {
            background: #117a65;
        }

        .degree-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            z-index: 5;
            min-width: 60px;
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 18px;
            }

            .city-name {
                font-size: 20px;
            }

            .temperature {
                font-size: 42px;
            }

            .compass-container {
                width: 240px;
                height: 240px;
            }

            .compass-icons {
                gap: 10px;
            }

            .compass-icon {
                width: 85px;
                height: 85px;
            }

            .compass-icon svg {
                width: 42px;
                height: 42px;
            }

            .footer-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-back">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="header-title">বিবলনা কম্পাস</div>
            <div class="header-space"></div>
        </div>

        <div class="content">
            <div class="location-info">
                <div class="city-name">বিবলনা</div>
                <div class="temperature"><span id="tempValue">26</span>°</div>
            </div>

            <div class="compass-wrapper">
                <div class="compass-container">
                    <div class="compass-dial">
                        <div class="compass-ticks" id="ticksContainer"></div>
                        <div class="direction-marker north">উ</div>
                        <div class="direction-marker east">প</div>
                        <div class="direction-marker south">দ</div>
                        <div class="direction-marker west">ম</div>
                    </div>
                    <div class="compass-needle" id="needle">
                        <div class="needle-triangle"></div>
                        <div class="needle-base"></div>
                    </div>
                    <div class="degree-display" id="degreeDisplay">0°</div>
                </div>
            </div>

            <div class="compass-icons">
                <div class="compass-icon active" data-style="style1">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45"/>
                        <line x1="50" y1="10" x2="50" y2="25"/>
                        <line x1="50" y1="75" x2="50" y2="90"/>
                        <line x1="10" y1="50" x2="25" y2="50"/>
                        <line x1="75" y1="50" x2="90" y2="50"/>
                        <line x1="22" y1="22" x2="33" y2="33"/>
                        <line x1="67" y1="67" x2="78" y2="78"/>
                        <line x1="78" y1="22" x2="67" y2="33"/>
                        <line x1="33" y1="67" x2="22" y2="78"/>
                        <polygon points="50,20 55,35 50,32 45,35" fill="currentColor"/>
                    </svg>
                </div>

                <div class="compass-icon" data-style="style2">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45"/>
                        <line x1="50" y1="20" x2="50" y2="35"/>
                        <line x1="50" y1="65" x2="50" y2="80"/>
                        <line x1="20" y1="50" x2="35" y2="50"/>
                        <line x1="65" y1="50" x2="80" y2="50"/>
                        <path d="M 50 50 L 70 50" stroke-width="2"/>
                        <circle cx="50" cy="50" r="5" fill="currentColor"/>
                    </svg>
                </div>

                <div class="compass-icon" data-style="style3">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="1"/>
                        <line x1="50" y1="15" x2="50" y2="25"/>
                        <line x1="50" y1="75" x2="50" y2="85"/>
                        <line x1="15" y1="50" x2="25" y2="50"/>
                        <line x1="75" y1="50" x2="85" y2="50"/>
                        <circle cx="50" cy="50" r="4" fill="currentColor"/>
                    </svg>
                </div>

                <div class="compass-icon" data-style="style4">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2.5"/>
                        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="0.5"/>
                        <line x1="50" y1="15" x2="50" y2="30" stroke-width="2"/>
                        <line x1="50" y1="70" x2="50" y2="85" stroke-width="2"/>
                        <line x1="15" y1="50" x2="30" y2="50" stroke-width="2"/>
                        <line x1="70" y1="50" x2="85" y2="50" stroke-width="2"/>
                        <polygon points="50,22 56,35 50,33 44,35" fill="currentColor"/>
                    </svg>
                </div>
            </div>

            <div class="footer-text">
                সঠিক দিকনির্দেশনার জন্য ডিভাইসটি সমতলভাবে ধরুন
            </div>
        </div>
    </div>

    <script>
        // Create compass ticks
        function createCompassTicks() {
            const container = document.getElementById('ticksContainer');
            for (let i = 0; i < 360; i += 6) {
                const tick = document.createElement('div');
                tick.className = (i % 30 === 0) ? 'tick major' : 'tick';
                tick.style.transform = `rotate(${i}deg)`;
                container.appendChild(tick);
            }
        }

        createCompassTicks();

        // Compass functionality
        const needle = document.getElementById('needle');
        const degreeDisplay = document.getElementById('degreeDisplay');
        let currentDegree = 0;

        function updateCompass(degree) {
            currentDegree = degree;
            needle.style.transform = `rotate(${degree}deg)`;
            degreeDisplay.textContent = Math.round(degree) + '°';
        }

        // Check for DeviceOrientation API support
        function requestPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', onDeviceOrientation);
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS devices
                window.addEventListener('deviceorientation', onDeviceOrientation);
            }
        }

        function onDeviceOrientation(event) {
            let alpha = event.alpha; // 0-360
            updateCompass(alpha);
        }

        // Request permission on iOS
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permissionButton = document.createElement('button');
            permissionButton.className = 'permission-button';
            permissionButton.textContent = 'কম্পাস চালু করুন';
            
            const permissionDiv = document.createElement('div');
            permissionDiv.className = 'permission-request';
            permissionDiv.innerHTML = 'কম্পাস ব্যবহার করতে অনুমতি দিন';
            permissionDiv.appendChild(permissionButton);
            
            document.querySelector('.content').insertBefore(permissionDiv, document.querySelector('.compass-wrapper'));
            
            permissionButton.addEventListener('click', requestPermission);
        } else {
            // Auto-start on non-iOS devices
            requestPermission();
        }

        // Compass styles
        const compassStyles = {
            style1: {
                needleColor: '#16a085',
                needleBaseColor: '#27ae60',
                needleBaseDark: '#16a085',
                compassBackground: '#ecf0f1',
                compassShadow: '#d5dbdb',
                directionPrimary: '#e74c3c',
                directionSecondary: '#2c3e50',
                tickColor: '#7f8c8d',
                tickMajorColor: '#2c3e50'
            },
            style2: {
                needleColor: '#3498db',
                needleBaseColor: '#2980b9',
                needleBaseDark: '#1f618d',
                compassBackground: '#ecf0f1',
                compassShadow: '#bdc3c7',
                directionPrimary: '#e74c3c',
                directionSecondary: '#34495e',
                tickColor: '#95a5a6',
                tickMajorColor: '#34495e'
            },
            style3: {
                needleColor: '#f39c12',
                needleBaseColor: '#e67e22',
                needleBaseDark: '#d35400',
                compassBackground: '#2c3e50',
                compassShadow: '#1a252f',
                directionPrimary: '#f39c12',
                directionSecondary: '#ecf0f1',
                tickColor: '#34495e',
                tickMajorColor: '#95a5a6'
            },
            style4: {
                needleColor: '#e74c3c',
                needleBaseColor: '#c0392b',
                needleBaseDark: '#a93226',
                compassBackground: '#34495e',
                compassShadow: '#2c3e50',
                directionPrimary: '#e74c3c',
                directionSecondary: '#ecf0f1',
                tickColor: '#7f8c8d',
                tickMajorColor: '#ecf0f1'
            }
        };

        function applyCompassStyle(styleName) {
            const style = compassStyles[styleName];
            const root = document.documentElement;
            
            root.style.setProperty('--needle-color', style.needleColor);
            root.style.setProperty('--needle-base-color', style.needleBaseColor);
            root.style.setProperty('--needle-base-dark', style.needleBaseDark);
            root.style.setProperty('--compass-background', style.compassBackground);
            root.style.setProperty('--compass-shadow', style.compassShadow);
            root.style.setProperty('--direction-primary', style.directionPrimary);
            root.style.setProperty('--direction-secondary', style.directionSecondary);
            root.style.setProperty('--tick-color', style.tickColor);
            root.style.setProperty('--tick-major-color', style.tickMajorColor);
        }

        // Icon selection
        document.querySelectorAll('.compass-icon').forEach(icon => {
            icon.addEventListener('click', function() {
                document.querySelectorAll('.compass-icon').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                const styleName = this.getAttribute('data-style');
                applyCompassStyle(styleName);
            });
        });

        // Back button
        document.querySelector('.header-back').addEventListener('click', function() {
            if (window.history.length > 1) {
                window.history.back();
            }
        });

        // Demo: Simulate compass rotation if device orientation not available
        let demoAngle = 0;
        const isDemo = () => {
            try {
                return !window.DeviceOrientationEvent;
            } catch {
                return true;
            }
        };

        if (isDemo()) {
            setInterval(() => {
                demoAngle = (demoAngle + 0.5) % 360;
                updateCompass(demoAngle);
            }, 30);
        }
    </script>


  <!-- Navbar Loader -->
<script src="navbar/navbar-loader.js"></script>
</body>
</html>
