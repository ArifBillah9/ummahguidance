                            }
                        }
                    }
                }
            }
        };

        // পৃষ্ঠা পরিচালনা
        let currentState = {
            page: 'main',
            selectedKhalifa: null,
            selectedChapter: null,
            selectedItem: null
        };

        // মূল পৃষ্ঠা লোড করা
        function loadMainPage() {
            const grid = document.getElementById('mainItemsGrid');
            grid.innerHTML = '';
            
            Object.keys(khalifatData).forEach(key => {
                const khalifa = khalifatData[key];
                const item = document.createElement('div');
                item.className = 'item';
                item.onclick = () => showKhalifaPage(key);
                
                item.innerHTML = `
                    <div class="item-icon"><i class="fas ${khalifa.icon}"></i></div>
                    <div class="item-info">
                        <div class="item-title">${khalifa.name}</div>
                        <div class="item-description">${khalifa.desc}</div>
                    </div>
                `;
                
                grid.appendChild(item);
            });
        }

        // খিলাফাত পৃষ্ঠা দেখানো
        function showKhalifaPage(khalifaKey) {
            currentState.page = 'khalifa';
            currentState.selectedKhalifa = khalifaKey;
            
            const khalifa = khalifatData[khalifaKey];
            document.getElementById('headerTitle').textContent = khalifa.name;
            document.getElementById('headerSubtitle').textContent = khalifa.desc;
            document.getElementById('backBtn').style.display = 'flex';
            
            // মূল পৃষ্ঠা লুকাও
            document.getElementById('mainPage').classList.remove('active');
            document.getElementById('detailPage').classList.remove('active');
            
            // অধ্যায় পৃষ্ঠা দেখাও
            const chapterContainer = document.getElementById('chapterContainer');
            chapterContainer.innerHTML = '';
            
            Object.keys(khalifa.chapters).forEach(chapterKey => {
                const chapter = khalifa.chapters[chapterKey];
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter-item';
                
                const itemsHTML = Object.keys(chapter.items).map(itemKey => {
                    const item = chapter.items[itemKey];
                    return `
                        <div class="dropdown-item" onclick="showDetail('${khalifaKey}', '${chapterKey}', '${itemKey}')">
                            ${item.name}
                        </div>
                    `;
                }).join('');
                
                chapterDiv.innerHTML = `
                    <div class="chapter-header" onclick="toggleChapter(event)">
                        <div class="chapter-title">${chapter.title}</div>
                        <div class="dropdown-arrow"><i class="fas fa-chevron-down"></i></div>
                    </div>
                    <div class="dropdown-content">
                        ${itemsHTML}
                    </div>
                `;
                
                chapterContainer.appendChild(chapterDiv);
            });
            
            document.getElementById('khaLifaPage').classList.add('active');
        }

        // বিস্তারিত পৃষ্ঠা দেখানো
        function showDetail(khalifaKey, chapterKey, itemKey) {
            currentState.page = 'detail';
            currentState.selectedKhalifa = khalifaKey;
            currentState.selectedChapter = chapterKey;
            currentState.selectedItem = itemKey;
            
            const khalifa = khalifatData[khalifaKey];
            const chapter = khalifa.chapters[chapterKey];
            const item = chapter.items[itemKey];
            
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-title">${item.name}</div>
                <div class="detail-text">${item.detail}</div>
            `;
            
            document.getElementById('khaLifaPage').classList.remove('active');
            document.getElementById('detailPage').classList.add('active');
        }

        // ড্রপডাউন টগল
        function toggleChapter(event) {
            event.preventDefault();
            const header = event.target.closest('.chapter-header');
            const chapter = header.closest('.chapter-item');
            chapter.classList.toggle('active');
        }

        // ফিরে যাওয়া
        function goBack() {
            if (currentState.page === 'detail') {
                showKhalifaPage(currentState.selectedKhalifa);
            } else if (currentState.page === 'khalifa') {
                document.getElementById('backBtn').style.display = 'none';
                document.getElementById('headerTitle').textContent = 'ইসলামী খিলাফাত ও সাম্রাজ্যের ইতিহাস';
                document.getElementById('headerSubtitle').textContent = 'বিশ্ব ইতিহাসের গুরুত্বপূর্ণ সাম্রাজ্যসমূহ';
                
                document.getElementById('khaLifaPage').classList.remove('active');
                document.getElementById('detailPage').classList.remove('active');
                document.getElementById('mainPage').classList.add('active');
                
                currentState.page = 'main';
                currentState.selectedKhalifa = null;
            }
        }

        // প্রাথমিক লোডিং
        loadMainPage();
    </script>
